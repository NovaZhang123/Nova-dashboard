function downloadPirateCard(className) {
  if (typeof html2canvas === 'undefined') { toast('卡片库加载中，请稍后再试'); return; }
  // Find the pirate cards section for this class
  const sections = document.querySelectorAll('.ranking-section');
  let target = null;
  sections.forEach(sec => {
    const h2 = sec.querySelector('h2');
    if (h2 && h2.textContent.includes(className)) target = sec;
  });
  if (!target) { toast('未找到 ' + className + ' 的卡片'); return; }

  // Clone the pirate cards into a clean canvas
  const canvas = document.createElement('div');
  canvas.className = 'card-canvas-hidden';
  canvas.style.width = '480px';
  canvas.style.padding = '24px';
  canvas.style.background = '#ffffff';
  canvas.style.borderRadius = '16px';
  canvas.style.fontFamily = 'system-ui, sans-serif';

  // Copy the pirate cards as they appear
  const pirateCards = target.querySelector('.pirate-cards');
  if (!pirateCards) { toast('未找到海盗币卡片'); return; }

  const clone = pirateCards.cloneNode(true);
  clone.style.display = 'grid';
  canvas.appendChild(clone);

  // Add title
  const title = document.createElement('div');
  title.style.cssText = 'font-size:18px;font-weight:700;margin-bottom:16px;color:#1e293b;text-align:center';
  title.textContent = className + ' · 🏆 海盗币排名';
  canvas.insertBefore(title, canvas.firstChild);

  document.body.appendChild(canvas);

  html2canvas(canvas, { backgroundColor: '#ffffff', scale: 2 }).then(imgCanvas => {
    document.body.removeChild(canvas);
    const link = document.createElement('a');
    link.download = '海盗币-' + className + '.png';
    link.href = imgCanvas.toDataURL('image/png');
    link.click();
    toast('海盗币卡片已下载');
  }).catch(() => {
    if (canvas.parentNode) canvas.parentNode.removeChild(canvas);
    toast('下载失败，请重试');
  });
}

        ${s.en ? '<div style="font-size:12px;color:#5f6368;">' + escHtml(s.en) + '</div>' : ''}
      </div>
      <span style="font-size:20px;">🌟</span>
    </div>
  `).join('');

  const preview = document.getElementById('cardPreview');
  preview.style.width = '420px';
  preview.innerHTML = `
    <div style="font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;">
      <div style="text-align:center;margin-bottom:12px;">
        <div style="font-size:14px;font-weight:700;color:#E8A400;letter-spacing:2px;">🏆 本周两次打卡小明星</div>
        <div style="font-size:20px;font-weight:700;color:#5B8DEF;margin-top:4px;">${className} · 完成追踪</div>
        <div style="font-size:13px;color:#5f6368;margin-top:2px;">${fmtCycleRange(cycleNewDate, className)}</div>
      </div>
      <div style="height:3px;background:linear-gradient(90deg,#FFD54F,#FFB300,#FFD54F);border-radius:2px;margin-bottom:16px;"></div>
      ${itemsHTML}
      <div style="text-align:center;margin-top:14px;padding-top:14px;border-top:1px dashed #FFE082;">
        <div style="font-size:16px;font-weight:700;color:#E8A400;">
          🎉 两次课都完成，太厉害了！
        </div>
        <div style="font-size:12px;color:#999;margin-top:6px;">
          新课 + 复习课 · 复述视频双打卡 · 共 ${doubleDone.length} 位小明星
        </div>
      </div>
    </div>
  `;

  toast('正在生成卡片...');

  if (typeof html2canvas === 'undefined') {
    await new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    });
  }

  try {
    const canvas = await html2canvas(preview, {
      backgroundColor: '#ffffff',
      scale: 2,
      useCORS: true,
    });
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = className + '_两次打卡小明星_' + cycleNewDate + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast('打卡卡片已下载！🪙');
    }, 'image/png');
  } catch (e) {
    toast('生成失败，请重试');
    console.error(e);
  }
}

// ╔══════════════════════════════════════════╗
// ║          TAB 4: WEEKLY REPORT           ║
// ╚══════════════════════════════════════════╝

// ╔══════════════════════════════════════════╗
// ║     REPORT TEXT INPUTS STORAGE           ║
// ╚══════════════════════════════════════════╝

function getReportTextKey() {
  const sat = new Date(currentReportSunday);
  sat.setDate(currentReportSunday.getDate() + 6);
  return STORAGE_PREFIX + 'report-text-' + getISOWeekKey(sat);
}
function loadReportTexts() {
  try { return JSON.parse(localStorage.getItem(getReportTextKey()) || '{}'); } catch(e) { return {}; }
}
function saveReportTexts(data) {
  const key = getReportTextKey();
  if (Object.keys(data).every(k => !data[k])) { localStorage.removeItem(key); return; }
  localStorage.setItem(key, JSON.stringify(data));
}

// ⭐ 综合评星：两月周期数据（支持月份导航 + 复制绩效文案）
window.starMonthOffset = 0; // 0 = current pair, -2 = prev pair, etc.

function renderReport() {
  const sun = currentReportSunday;
  const sat = new Date(sun);
  sat.setDate(sun.getDate() + 6);
  const weekLabel = formatReportWeek(sun);

  let html = '<div class="action-bar"><span class="hint">周报区间：上周日 ~ 本周六</span>'
    + '<div class="week-nav"><button onclick="prevWeekRp()">◀</button>'
    + '<span class="week-label">' + weekLabel + '</span>'
    + '<button onclick="nextWeekRp()">▶</button>'
    + '<button onclick="goTodayRp()" style="font-size:.72rem;width:auto;padding:0 10px;font-weight:600">本周报</button></div>'
    + '<button class="btn btn-outline" onclick="downloadReportExcel()">📊 导出 Excel</button>'
    + '<button class="btn btn-outline" onclick="downloadReportPPTX()" style="background:#4F46E5;color:#fff;border-color:#4F46E5">📑 导出 PPTX</button></div>';

  // Accumulate global totals
  let globalListenTotal = 0, globalListenMet = 0;
  let globalVideoTotal = 0, globalVideoDone = 0, globalVideoLate = 0;
  let globalAttTotal = 0, globalAttPresent = 0, globalAttBaseTotal = 0;

  // For each class
  for (const cn of Object.keys(CLASSES)) {
    const students = getAllStudents(cn);

    // Calculate listening stats for report week
    const listenRows = students.map(s => {
      if (getStudentCfg(cn, s.name).exemptListening) {
        return { name: s.name, listening: '免打卡', listeningRate: null };
      }
      if (isAfterLeftWeek(cn, s.name, sun)) {
        return { name: s.name, listening: '已退学', listeningRate: null, exemptReason: '已退学/停课' };
      }
      if (isBeforeJoinWeek(cn, s.name, sun)) {
        return { name: s.name, listening: '未加入', listeningRate: null, exemptReason: '新生未加入' };
      }
      // Consecutive leave exemption: both lessons in this week were missed
      if (isConsecutiveLeave(cn, s.name, sun)) {
        return { name: s.name, listening: '请假中', listeningRate: null, exemptReason: '连续请假' };
      }
      let totalDays = 0, metDays = 0;
      const d = new Date(sun);
      while (d.getTime() <= sat.getTime()) {
        totalDays++;
        if (loadMinutesForDate(cn, s.name, d) >= TARGET) metDays++;
        d.setDate(d.getDate() + 1);
      }
      return { name: s.name, listening: metDays + '/' + totalDays, listeningRate: totalDays > 0 ? metDays / totalDays : 0 };
    });

    // 视频统计 V2：只统计截止日期已过的作业
    // 使用理论配对日期（而非已创建记录）作为截止日，确保排课切换后不误判
    const lessonDates = getLessonDatesInReportWeek(cn, sun);
    const videoByName = {};
    let videoTotal = 0, videoDone = 0, videoLateTotal = 0;
    students.forEach(s => { videoByName[s.name] = { total: 0, done: 0, lateCount: 0 }; });

    {
      const todayStr = dateStr(new Date());
      const toCount = getReportWeekVideoEntries(cn, sun, todayStr);
      const leaves = loadLeaves();
      toCount.forEach(rec => {
        students.forEach(s => {
          if (isLeaveNoMakeup(cn, s.name, rec.date)) return;
          if (isStudentInactive(cn, s.name, sun)) return;
          videoByName[s.name].total++;
          videoTotal++;
          if (rec.submissions[s.name]) { videoByName[s.name].done++; videoDone++; }
        });
      });
    }

    // Attendance stats
    const attByName = {};
    let attTotal = 0, attPresent = 0;
    students.forEach(s => { attByName[s.name] = { total: 2, present: 0, makeupCount: 0 }; });

    if (lessonDates) {
      [lessonDates.newLesson, lessonDates.review].forEach(ld => {
        const attData = loadAttendance(dateStr(ld));
        if (attData[cn]) {
          students.forEach(s => {
            if (isStudentInactive(cn, s.name, sun)) return;
            const status = attData[cn][s.name] || 'present';
            attTotal++;
            if (status === 'present') { attByName[s.name].present++; attPresent++; }
          });
        } else {
          students.forEach(s => {
            if (isStudentInactive(cn, s.name, sun)) return;
            attTotal++;
            attByName[s.name].present++; attPresent++;
          });
        }
      });
    }

    // Add makeup attendance from other weeks — cross-week makeups boost current week's attendance
    const leaves = loadLeaves();
    leaves.forEach(l => {
      if (!l.makeupScheduled || !l.makeupDate) return;
      if (l.className !== cn) return;
      const md = new Date(l.makeupDate + 'T00:00:00');
      if (md >= sun && md <= sat) {
        // Skip if this is just a regular attendance for current week's own lesson
        const isOwnLesson = lessonDates && (
          l.date === dateStr(lessonDates.newLesson) ||
          l.date === dateStr(lessonDates.review)
        );
        if (!isOwnLesson) {
          if (!attByName[l.student]) attByName[l.student] = { total: 2, present: 0, makeupCount: 0 };
          attByName[l.student].total++;
          attByName[l.student].present++;
          attByName[l.student].makeupCount++;
          attTotal++;
          attPresent++;
        }
      }
    });

    // Count manually-added late video submissions for this report week
    // Track separately from normal done — display as "+N 补交"
    const toCountLen = getReportWeekVideoEntries(cn, sun, dateStr(new Date())).length;
    const reportWeekKey = getISOWeekKey(sat);
    const reportLateSubs = loadLateSubs(cn, reportWeekKey);
    reportLateSubs.forEach(ls => {
      const vs = videoByName[ls.name];
      if (vs) {
        vs.lateCount++;
        videoLateTotal++;
      } else {
        videoByName[ls.name] = { total: toCountLen, done: 0, lateCount: 1 };
        videoLateTotal++;
      }
    });

    // Build table
    var videoPeriodDesc = getReportWeekVideoPeriodInfo(cn, sun).desc;
    html += '<div class="report-table-wrap"><table class="report-table"><thead><tr>'
      + '<th>学生</th><th>听录音</th><th>录音达标率</th><th>视频打卡</th><th>视频达标率</th><th>出勤</th><th>出勤率</th><th></th></tr>'
      + '<tr class="video-period-hint"><td colspan="3"></td><td colspan="2" style="font-size:.68rem;color:#64748B;font-weight:400;padding:2px 8px 6px;text-align:center">' + videoPeriodDesc + '</td><td colspan="3"></td></tr>'
      + '</thead><tbody>';

    students.forEach(s => {
      const lr = listenRows.find(r => r.name === s.name);
      const va = videoByName[s.name];
      const aa = attByName[s.name];

      const lRate = lr.listeningRate !== null ? (lr.listeningRate >= 0.7 ? 'rate-good' : 'rate-bad') : 'rate-na';
      const lRateText = lr.listeningRate !== null ? (lr.listeningRate * 100).toFixed(0) + '%' : '—';
      const vRate = va.total > 0 ? ((va.done + va.lateCount) / va.total >= 0.5 ? 'rate-good' : 'rate-bad') : 'rate-na';
      const vRateText = va.total > 0 ? ((va.done + va.lateCount) / va.total * 100).toFixed(0) + '%' : '—';
      const aRate = aa.total > 0 ? ((aa.present / aa.total) >= 0.8 ? 'rate-good' : 'rate-bad') : 'rate-na';
      const aRateText = aa.total > 0 ? (aa.present / aa.total * 100).toFixed(0) + '%' : '—';
      const aDisplay = (aa.makeupCount || 0) > 0 ? aa.present + '/' + aa.total + ' ⚡' : aa.present + '/' + aa.total;

      const vDisplay = va.done + '/' + va.total + (va.lateCount > 0 ? ' ⚡+' + va.lateCount : '');
      const rowClass = lr.exemptReason ? ' style="opacity:0.4"' : '';

      html += '<tr' + rowClass + '>'
        + '<td class="name-col">' + escHtml(s.name) + (lr.exemptReason ? ' <span style="font-size:.7em;color:#94a3b8">(' + lr.exemptReason + ')</span>' : '') + '</td>'
        + '<td>' + lr.listening + '</td>'
        + '<td class="' + lRate + '">' + lRateText + '</td>'
        + '<td>' + vDisplay + '</td>'
        + '<td class="' + vRate + '">' + vRateText + '</td>'
        + '<td>' + aDisplay + '</td>'
        + '<td class="' + aRate + '">' + aRateText + '</td>'
        + '<td><button class="sc-heatmap-btn" title="个人周报卡" onclick="showStudentCard(\'' + cn + '\',\'' + escHtml(s.name) + '\',\'' + dateStr(sun) + '\')" style="font-size:.85rem">📋</button></td>'
        + '</tr>';
    });

    // Accumulate global totals
    const lMet = listenRows.filter(r => r.listeningRate !== null).reduce((s, r) => s + r.listening * 1, 0) || 0;
    const lTotal = listenRows.filter(r => r.listeningRate !== null).length * 7;
    globalListenTotal += lTotal;
    // Count actual met days
    let lMetActual = 0, lTotalActual = 0;
    listenRows.forEach(r => {
      if (r.listeningRate !== null) {
        const parts = r.listening.split('/');
        lMetActual += parseInt(parts[0]) || 0;
        lTotalActual += parseInt(parts[1]) || 7;
      }
    });
    globalListenMet += lMetActual;

    globalVideoTotal += videoTotal;
    globalVideoDone += (videoDone + videoLateTotal);
    globalVideoLate += videoLateTotal;
    globalAttTotal += attTotal;
    globalAttPresent += attPresent;

    // Class summary — use base expected attendance as denominator (active students only)
    const activeStudentCount = students.filter(s => !isStudentInactive(cn, s.name, sun)).length;
    const attBase = activeStudentCount * 2;
    globalAttBaseTotal += attBase;
    const lAvg = listenRows.filter(r => r.listeningRate !== null).reduce((sum, r, _, arr) => sum + r.listeningRate / arr.length, 0);
    const vSumDisplay = videoDone + (videoLateTotal > 0 ? '+' + videoLateTotal : '');
    const vAvg = videoTotal > 0 ? (videoDone + videoLateTotal) / videoTotal : 0;
    const aAvg = attBase > 0 ? attPresent / attBase : 0;

    html += '<tr class="section-header"><td><strong>' + cn + ' 汇总</strong></td>'
      + '<td>' + lMetActual + '/' + lTotalActual + '</td><td class="' + (lAvg >= 0.7 ? 'rate-good' : 'rate-bad') + '">' + (isNaN(lAvg) ? '—' : (lAvg * 100).toFixed(0) + '%') + '</td>'
      + '<td>' + vSumDisplay + '/' + videoTotal + '</td><td class="' + (vAvg >= 0.5 ? 'rate-good' : 'rate-bad') + '">' + (vAvg * 100).toFixed(0) + '%</td>'
      + '<td>' + attPresent + '/' + attBase + '</td><td class="' + (aAvg >= 0.8 ? 'rate-good' : 'rate-bad') + '">' + (aAvg * 100).toFixed(0) + '%</td>'
      + '<td></td></tr>';

    html += '</tbody></table></div>';
  }

  // ═══ Global Summary ═══
  const glAvg = globalListenTotal > 0 ? globalListenMet / globalListenTotal : 0;
  const gvAvg = globalVideoTotal > 0 ? globalVideoDone / globalVideoTotal : 0;
  const gaAvg = globalAttBaseTotal > 0 ? globalAttPresent / globalAttBaseTotal : 0;
  const gOverall = (glAvg + gvAvg + gaAvg) / 3;

  html += '<div class="report-table-wrap" style="margin-top:20px"><table class="report-table summary-table"><thead><tr>'
    + '<th colspan="8" style="text-align:center;font-size:.95rem;background:#1e293b;color:#fff">📊 综合汇总</th></tr></thead><tbody>';

  html += '<tr class="section-header">'
    + '<td>📻 录音综合达标率</td>'
    + '<td>' + globalListenMet + '/' + globalListenTotal + '</td>'
    + '<td class="' + (glAvg >= 0.7 ? 'rate-good' : 'rate-bad') + '">' + (glAvg * 100).toFixed(1) + '%</td>'
    + '<td colspan="5"></td></tr>';

  const gvSumDisplay = globalVideoDone + (globalVideoLate > 0 ? '+' + globalVideoLate : '');
  html += '<tr class="section-header">'
    + '<td>📹 视频综合达标率</td>'
    + '<td>' + gvSumDisplay + '/' + globalVideoTotal + '</td>'
    + '<td class="' + (gvAvg >= 0.5 ? 'rate-good' : 'rate-bad') + '">' + (gvAvg * 100).toFixed(1) + '%</td>'
    + '<td colspan="5"></td></tr>';

  html += '<tr class="section-header">'
    + '<td>👥 总出勤率</td>'
    + '<td>' + globalAttPresent + '/' + globalAttBaseTotal + '</td>'
    + '<td class="' + (gaAvg >= 0.8 ? 'rate-good' : 'rate-bad') + '">' + (gaAvg * 100).toFixed(1) + '%</td>'
    + '<td colspan="5"></td></tr>';

  html += '<tr class="section-header" style="border-top:2px solid var(--accent)">'
    + '<td><strong>🎯 综合 KPI</strong></td>'
    + '<td></td>'
    + '<td class="' + (gOverall >= 0.7 ? 'rate-good' : 'rate-bad') + '" style="font-size:1.1rem;font-weight:800">' + (gOverall * 100).toFixed(1) + '%</td>'
    + '<td colspan="5"></td></tr>';

  html += '</tbody></table></div>';

  // ⭐ 综合评星面板（两月周期）— 支持月份导航 + 复制绩效文案
  {
    const star = computeStarRatings(window.starMonthOffset);
    const STAR_TARGET = 0.85; // 目标 85%
    const overallRate = (star.listenMet + star.videoDone) / (star.listenTotal + star.videoExpected);

    function buildBar(rate, label, emoji) {
      const pct = Math.round(rate * 100);
      const stars = rate >= STAR_TARGET ? '⭐'.repeat(5) : '⭐'.repeat(Math.max(1, Math.min(5, Math.ceil(rate / STAR_TARGET * 5))));
      const barColor = rate >= STAR_TARGET ? '#22c55e' : (rate >= STAR_TARGET * 0.7 ? '#f59e0b' : '#ef4444');
      const barW = Math.min(100, Math.max(0, rate * 100));
      return '<div style="margin-bottom:12px;">'
        + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">'
        + '<span>' + emoji + ' ' + label + '</span>'
        + '<span style="font-weight:700;color:#1e293b;">' + pct + '%</span></div>'
        + '<div style="background:#e2e8f0;border-radius:6px;height:20px;position:relative;overflow:hidden;">'
        + '<div style="width:' + barW + '%;height:100%;background:' + barColor + ';border-radius:6px;transition:width .3s;"></div>'
        + '<div style="position:absolute;left:85%;top:-2px;bottom:-2px;width:2px;background:#64748b;z-index:1;"></div>'
        + '<span style="position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:.7rem;color:#64748b;font-weight:600;">目标85%</span>'
        + '</div>'
        + '<div style="text-align:right;margin-top:2px;font-size:1rem;letter-spacing:2px;">' + stars + '</div>'
        + '</div>';
    }

    // Performance text is generated on-demand by copyPerformanceText()

    html += '<div class="star-panel" style="margin-top:20px;padding:16px 20px;background:#f0f9ff;border-radius:10px;border:1px solid #e0f0ff;">'
      + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">'
      + '<h3 style="margin:0;font-size:1rem;color:#1e293b;">⭐ 综合评星（' + star.label + '）</h3>'
      + '<div style="display:flex;align-items:center;gap:6px;">'
      + '<button onclick="window.starMonthOffset-=2;renderReport()" style="font-size:.8rem;padding:4px 10px;border:1.5px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer;font-weight:600">◀</button>'
      + '<button onclick="window.starMonthOffset=0;renderReport()" style="font-size:.72rem;padding:4px 8px;border:1.5px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer;font-weight:600;color:var(--accent)">本期</button>'
      + '<button onclick="window.starMonthOffset+=2;renderReport()" style="font-size:.8rem;padding:4px 10px;border:1.5px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer;font-weight:600">▶</button>'
      + '</div></div>'
      + buildBar(star.listenRate, '平均听录音达标率', '📻')
      + buildBar(star.videoRate,  '平均视频达标率',   '📹')
      + buildBar(overallRate,       '综合平均率',         '🏆')
      + '<div style="margin-top:14px;display:flex;align-items:center;justify-content:space-between;">'
      + '<div style="font-size:.78rem;color:#64748B;line-height:1.5;">'
      + '<div>📊 录音：' + star.listenMet + '/' + star.listenTotal + '达标</div>'
      + '<div>🎬 视频：' + star.videoDone + '/' + star.videoExpected + '完成</div>'
      + '</div>'
      + '<button id="copyPerfBtn" onclick="copyPerformanceText(\'' + star.label + '\')" style="font-size:.78rem;padding:8px 16px;border-radius:8px;border:1.5px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;font-weight:600;white-space:nowrap;">📋 复制绩效文案</button>'
      + '</div></div>';
  }

  // Performance text copy function
  window.copyPerformanceText = function(monthLabel) {
    var star = computeStarRatings(window.starMonthOffset);
    var md = star.monthlyData;
    var keys = Object.keys(md).sort();

    function getStudentCount(monthKey) {
      return md[monthKey] ? md[monthKey].students.size : 0;
    }

    // Find the two month keys that match our label range
    var m1Label = monthLabel.split('+')[0]; // e.g., "6月"
    var m2Label = monthLabel.split('+')[1]; // e.g., "7月"
    var mNum1 = parseInt(m1Label), mNum2 = parseInt(m2Label);
    var year = new Date().getFullYear();
    var mk1 = year + '-' + String(mNum1).padStart(2,'0');
    var mk2 = year + '-' + String(mNum2).padStart(2,'0');
    var s1 = getStudentCount(mk1), s2 = getStudentCount(mk2);

    var lMet = star.listenMet, lTotal = star.listenTotal;
    var vDone = star.videoDone, vExp = star.videoExpected;
    var overallPct = ((lMet + vDone) / (lTotal + vExp)) * 100;
    var overallPctRounded = Math.round(overallPct);

    // Format matching template:
    // "张雨2月+3月听录音和视频打卡完成率,学生2月16人、3月17人,录音打卡应完成次数751,实际完成527;视频打卡应完成次数200,实际完成166。综合平均率77%"
    var m1Num = parseInt(monthLabel.split('+')[0]); // e.g., 2
    var m2Num = parseInt(monthLabel.split('+')[1]); // e.g., 3
    var text = monthLabel + '听录音和视频打卡完成率';
    text += '，学生' + m1Num + '月' + s1 + '人、' + m2Num + '月' + s2 + '人';
    text += '，录音打卡应完成次数' + lTotal + '，实际完成' + lMet;
    text += '；视频打卡应完成次数' + vExp + '，实际完成' + vDone;
    text += '。综合平均率' + overallPctRounded + '%';

    navigator.clipboard.writeText(text).then(function() {
      var btn = document.getElementById('copyPerfBtn');
      if (btn) { btn.textContent = '✅ 已复制！'; btn.style.background='#22c55e'; setTimeout(function() { btn.textContent = '📋 复制绩效文案'; btn.style.background=''; }, 2000); }
      toast('已复制到剪贴板');
    }).catch(function() {
      // Fallback: use textarea
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.left='-9999px';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy');
      document.body.removeChild(ta);
      toast('已复制到剪贴板（兼容模式）');
    });
  };

  // ═══ Text Input Cards: 看过程 & 看自己 ═══
  const texts = loadReportTexts();
  const escAttr = (s) => (s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function downloadReportExcel() {
  if (typeof XLSX === 'undefined') { toast('Excel库加载失败'); return; }
  const wb = XLSX.utils.book_new();
  const sun = currentReportSunday;
  const sat = new Date(sun); sat.setDate(sun.getDate() + 6);
  const allRecords = getAllVideoRecords();

  let globalListenTotal = 0, globalListenMet = 0;
  let globalVideoDone = 0, globalVideoExpected = 0;
  let globalAttTotal = 0, globalAttPresent = 0, globalAttBaseTotal = 0;

  for (const cn of Object.keys(CLASSES)) {
    const students = getAllStudents(cn);
    const rows = [['学生', '听录音达标', '录音达标率', '视频打卡', '视频达标率', '出勤', '出勤率']];
    const lessonDates = getLessonDatesInReportWeek(cn, sun);

    let clsListenTotal = 0, clsListenMet = 0;
    let clsVideoDone = 0, clsAttTotal = 0, clsAttPresent = 0;
    const leaves = loadLeaves();

    students.forEach(s => {
      const exempt = getStudentCfg(cn, s.name).exemptListening;
      const consecutiveLeave = isConsecutiveLeave(cn, s.name, sun);
      let lTotal = 0, lMet = 0;
      if (!exempt && !consecutiveLeave) {
        const dd = new Date(sun);
        while (dd.getTime() <= sat.getTime()) {
          lTotal++;
          if (loadMinutesForDate(cn, s.name, dd) >= TARGET) lMet++;
          dd.setDate(dd.getDate() + 1);
        }
        clsListenTotal += lTotal;
        clsListenMet += lMet;
      }

      // Video: count current + late submissions in report week
      let vDone = 0;
      if (lessonDates) {
        const nlRec = getVideoRecord(cn, dateStr(lessonDates.newLesson), 'new');
        if (nlRec && nlRec.date === dateStr(lessonDates.newLesson) && nlRec.submissions[s.name]) vDone++;
        const rvRec = getVideoRecord(cn, dateStr(lessonDates.review), 'review');
        if (rvRec && rvRec.date === dateStr(lessonDates.review) && rvRec.submissions[s.name]) vDone++;
        // Late submissions from previous cycles
        allRecords.forEach(rec => {
          if (rec.className !== cn) return;
          if (rec.date === dateStr(lessonDates.newLesson) || rec.date === dateStr(lessonDates.review)) return;
          const sub = rec.submissions[s.name];
          if (!sub) return;
          const subDate = typeof sub === 'string' ? sub : rec.date;
          const subD = new Date(subDate + 'T00:00:00');
          if (subD >= sun && subD <= sat) vDone++;
        });
      }
      clsVideoDone += vDone;

      // Attendance
      let aPresent = 0, aTotal = 2;
      if (lessonDates) {
        [lessonDates.newLesson, lessonDates.review].forEach(ld => {
          const attData = loadAttendance(dateStr(ld));
          const status = attData[cn] ? (attData[cn][s.name] || 'present') : 'present';
          if (status === 'present') aPresent++;
          clsAttTotal++;
        });
        // Add makeup attendance from other weeks
        leaves.forEach(l => {
          if (!l.makeupScheduled || !l.makeupDate) return;
          if (l.className !== cn || l.student !== s.name) return;
          const md = new Date(l.makeupDate + 'T00:00:00');
          if (md >= sun && md <= sat) {
            const isOwn = l.date === dateStr(lessonDates.newLesson) || l.date === dateStr(lessonDates.review);
            if (!isOwn) { aPresent++; aTotal++; clsAttTotal++; }
          }
        });
      }
      clsAttPresent += aPresent;

      const vDisplay = vDone > 2 ? vDone + '/2' : vDone + '/2';

      rows.push([
        s.name,
        exempt ? '免打卡' : (consecutiveLeave ? '请假中' : lMet + '/' + lTotal),
        exempt ? '—' : (consecutiveLeave ? '—' : (lTotal > 0 ? (lMet / lTotal * 100).toFixed(0) + '%' : '—')),
        vDisplay,
        (vDone / 2 * 100).toFixed(0) + '%',
        aPresent + '/' + aTotal,
        (aPresent / aTotal * 100).toFixed(0) + '%',
      ]);
    });

    // Class summary row
    if (students.length > 0) {
      const lRate = clsListenTotal > 0 ? (clsListenMet / clsListenTotal * 100).toFixed(0) + '%' : '—';
      rows.push([
        cn + ' 汇总',
        clsListenMet + '/' + clsListenTotal,
        lRate,
        clsVideoDone + '/' + (students.length * 2),
        (clsVideoDone / (students.length * 2) * 100).toFixed(0) + '%',
        clsAttPresent + '/' + (students.length * 2),
        (clsAttPresent / (students.length * 2) * 100).toFixed(0) + '%',
      ]);
    }

    globalListenTotal += clsListenTotal;
    globalListenMet += clsListenMet;
    globalVideoDone += clsVideoDone;
    globalVideoExpected += students.length * 2;
    globalAttTotal += clsAttTotal;
    globalAttPresent += clsAttPresent;
    globalAttBaseTotal += students.length * 2;

    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch: 10}, {wch: 14}, {wch: 10}, {wch: 14}, {wch: 10}, {wch: 10}, {wch: 10}];
    XLSX.utils.book_append_sheet(wb, ws, cn);
  }

  // Global summary sheet
  const summaryRows = [['指标', '应完成', '实际完成', '达标率']];
  summaryRows.push(['📻 录音综合', globalListenTotal, globalListenMet, globalListenTotal > 0 ? (globalListenMet / globalListenTotal * 100).toFixed(1) + '%' : '—']);
  summaryRows.push(['📹 视频综合', globalVideoExpected, globalVideoDone, globalVideoExpected > 0 ? (globalVideoDone / globalVideoExpected * 100).toFixed(1) + '%' : '—']);
  summaryRows.push(['👥 出勤综合', globalAttBaseTotal, globalAttPresent, globalAttBaseTotal > 0 ? (globalAttPresent / globalAttBaseTotal * 100).toFixed(1) + '%' : '—']);
  const gOverall = (globalListenTotal + globalVideoExpected + globalAttBaseTotal) > 0
    ? ((globalListenMet + globalVideoDone + globalAttPresent) / (globalListenTotal + globalVideoExpected + globalAttBaseTotal) * 100).toFixed(1) + '%'
    : '—';
  summaryRows.push(['🎯 综合 KPI', '', '', gOverall]);

  const ws2 = XLSX.utils.aoa_to_sheet(summaryRows);
  ws2['!cols'] = [{wch: 16}, {wch: 12}, {wch: 12}, {wch: 10}];
  XLSX.utils.book_append_sheet(wb, ws2, '综合汇总');

  XLSX.writeFile(wb, '周报-' + formatReportWeek(sun).replace(/[月日\s-]/g, '') + '.xlsx');
  toast('周报已导出');
}

// 辅助：判断学生是否请假且不补交（视频分母 -1）
function isLeaveNoMakeup(className, studentName, dateStr) {

  for (var i = 0; i < leaves.length; i++) {

// ╔══════════════════════════════════════════╗
// ║  视频统计 V3 共享辅助函数                    ║
// ╚══════════════════════════════════════════╝
// 截止逻辑：新课视频 → 复习课当天截止；复习课视频 → 下周新课当天截止
// 算法：从所有历史作业中筛选截止日期≤cutoffDate的，取最近最多2条
// cutoffDate: 可选，传入则用该日期作截止判断；不传则用今天
function getCountableVideoEntries(className, cutoffDate) {
  var cutoff = cutoffDate || dateStr(new Date());
  // 收集该班级所有视频记录
  var entries = [];
  for (var i = 0; i < localStorage.length; i++) {
    var key = localStorage.key(i);
    if (key && key.indexOf('nd-V-' + className + '-') >= 0) {
      try {
        var rec = JSON.parse(localStorage.getItem(key));
        if (rec && rec.date && rec.submissions) entries.push(rec);
      } catch (e) {}
    }
  }
  if (entries.length === 0) return [];
  // 按日期升序
  entries.sort(function(a, b) { return new Date(a.date) - new Date(b.date); });
  // 为每条记录计算截止日 = 下一条 opposite-type 的日期
  var pastDeadline = [];
  for (var i = 0; i < entries.length; i++) {
    var deadline = null;
    for (var j = i + 1; j < entries.length; j++) {
      if (entries[j].type !== entries[i].type) { deadline = entries[j].date; break; }
    }
    if (deadline !== null && deadline <= cutoff) pastDeadline.push(entries[i]);
  }
  // 取最近最多2条
  return pastDeadline.slice(-2);
}

// ══════════════════════════════════════════
// 周报专用视频统计：使用理论配对日期判断截止
// ══════════════════════════════════════════
// 与 getCountableVideoEntries 的区别：
// - 后者用「下一条已创建的 opposite-type 记录」作截止 → 提前创建记录会误判
// - 本函数用 getPairedReviewDate/getPairedNewDate 算出理论配对日期 → 反映真实截止时间
//
// 规则：一条视频作业在它的配对课程日（含）当天及之后才算"截止"
//   - 新课 → 截止日 = 配对复习课日期（getPairedReviewDate）
//   - 复习课 → 截止日 = 配对新课日期（getPairedNewDate）
//
// 截止边界 = min(今天, 报告周周六)
//   - 这样保证历史周报结果不随时间变化（时间不变量）
//   - 同时本周内查看时不会把未来的课算进去
// 返回：所有已截止的视频记录，取最近 2 条（一个完整周期）

function getReportWeekVideoEntries(className, reportSunday, todayStr) {
  var entries = [];
  for (var i = 0; i < localStorage.length; i++) {
    var key = localStorage.key(i);
    if (key && key.indexOf('nd-V-' + className + '-') >= 0) {
      try {
        var rec = JSON.parse(localStorage.getItem(key));
        if (rec && rec.date && rec.submissions) entries.push(rec);
      } catch (e) {}
    }
  }
  if (entries.length === 0) return [];
  entries.sort(function(a, b) { return new Date(a.date) - new Date(b.date); });

  // 截止边界 = min(今天, 报告周周六)
  // 保证历史周报结果不随时间变化（时间不变量）
  var sat = new Date(reportSunday);
  sat.setDate(sat.getDate() + 6);
  var satStr = dateStr(sat);
  var cutoff = todayStr < satStr ? todayStr : satStr;

  // 用理论配对日期计算每条记录的截止日
  var countable = [];
  for (var i = 0; i < entries.length; i++) {
    var rec = entries[i];
    var pairedDate;
    try {
      if (rec.type === 'new') {
        pairedDate = getPairedReviewDate(rec.date, className);
      } else if (rec.type === 'review') {
        pairedDate = getPairedNewDate(rec.date, className);
      } else {
        continue; // 未知类型跳过
      }
    } catch(e) { continue; }

    var deadlineStr = dateStr(pairedDate);
    // 两个条件都满足才算入：
    // 1. 截止日 ≤ cutoff（配对课程已发生，学生已有机会提交）
    // 2. 课程日期 ≤ cutoff（本节课程已经上了，不能统计未来的课）
    if (deadlineStr <= cutoff && rec.date <= cutoff) {
      countable.push(rec);
    }
  }

  // 取最近最多2条（一个完整周期 = 新课 + 复习课）
  return countable.slice(-2);
}

// 周报专用的视频周期描述文本生成
function getReportWeekVideoPeriodInfo(className, reportSunday) {
  var todayStr = dateStr(new Date());
  var entries = getReportWeekVideoEntries(className, reportSunday, todayStr);

  if (entries.length === 0) {
    return { desc: '统计0次(无已截止作业)', counted: [] };
  }

  var descParts = entries.map(function(r) {
    return r.date + ' ' + getLessonTypeLabel(r.type);
  });

  };
}

// 生成视频统计周期的描述文本（用于UI标注）
// cutoffDate: 可选，传入则用该日期作截止判断；不传则用今天
function getVideoPeriodInfo(className, cutoffDate) {
  var cutoff = cutoffDate || dateStr(new Date());
  var entries = [];
  for (var i = 0; i < localStorage.length; i++) {
    var key = localStorage.key(i);
    if (key && key.indexOf('nd-V-' + className + '-') >= 0) {
      try {
        var rec = JSON.parse(localStorage.getItem(key));
        if (rec && rec.date && rec.submissions) entries.push(rec);
      } catch (e) {}
    }
  }
  if (entries.length === 0) return { desc: '无数据', counted: [], skipped: [] };
  entries.sort(function(a, b) { return new Date(a.date) - new Date(b.date); });

  var counted = [], skipped = [];
  for (var i = 0; i < entries.length; i++) {
    var deadline = null;
    for (var j = i + 1; j < entries.length; j++) {
      if (entries[j].type !== entries[i].type) { deadline = entries[j].date; break; }
    }
    if (deadline === null) { skipped.push(entries[i]); continue; } // 没有后续课→永远不截止
    if (deadline <= cutoff) counted.push(entries[i]);
    else skipped.push(entries[i]);
  }

  // 实际被纳入统计的是 pastDeadline.slice(-2)
  var actualCounted = counted.slice(-2);
  var actualSkipped = entries.filter(function(e) {
    return actualCounted.indexOf(e) < 0;
  });

  // 构建描述文本
  var parts = [];
  if (actualCounted.length > 0) {
    var countedDesc = actualCounted.map(function(r) {
      return r.date + ' ' + getLessonTypeLabel(r.type);
    }).join(', ');
    parts.push('统计' + actualCounted.length + '次(' + countedDesc + ')');
  } else {
    parts.push('统计0次(无已截止作业)');
  }
  // 被跳过且未截止的
  var pendingSkip = skipped.filter(function(e) { return actualCounted.indexOf(e) < 0; });
  if (pendingSkip.length > 0 && actualSkipped.length > 0) {
    // 只标注最近的未截止作业
    var latestSkipped = entries[entries.length - 1];
    var latestDeadline = null;
    for (var jj = entries.length - 1; jj >= 0; jj--) {
      if (entries[jj].date === latestSkipped.date && entries[jj].type === latestSkipped.type) {
        for (var kk = jj + 1; kk < entries.length; kk++) {
          if (entries[kk].type !== latestSkipped.type) { latestDeadline = entries[kk].date; break; }
        }
        break;
      }
    }
    if (latestDeadline) {
      parts.push(latestSkipped.date + ' ' + getLessonTypeLabel(latestSkipped.type) + '(截止' + latestDeadline + ')未截止→跳过');
    }
    parts.push('往前取已截止的' + actualCounted.length + '条');
  }
  return { desc: parts.join('; '), counted: actualCounted, skipped: actualSkipped };
}

// ╔══════════════════════════════════════════╗
// ║  评星面板：两月平均达标率                    ║
// ╚══════════════════════════════════════════╝
// 计算当前两月周期（6月+7月）的平均听录音和视频数据

function getTwoMonthRange(offset) {
  // Each unit of offset = 1 month; we show two consecutive months
  // Pairs always start on even-numbered months: 2+3, 4+5, 6+7, 8+9...
  const today = new Date(); today.setHours(0,0,0,0);
  const base = new Date(today.getFullYear(), today.getMonth(), 1); // 1st of current month
  base.setMonth(base.getMonth() + offset);
  // Align to even months (2,4,6,8,10,12): if 1-indexed month is odd, shift back one
  if ((base.getMonth() + 1) % 2 === 1) { base.setMonth(base.getMonth() - 1); }
  const m1 = new Date(base);
  const m2 = new Date(base); m2.setMonth(m2.getMonth() + 1);
  return {
    m1Start: new Date(m1.getFullYear(), m1.getMonth(), 1),
    m1End:   new Date(m2.getFullYear(), m2.getMonth(), 1), // last day of m1
    m2End:   new Date(m2.getFullYear(), m2.getMonth() + 1, 0), // last day of m2
    label:   (m1.getMonth() + 1) + '月+' + (m2.getMonth() + 1) + '月',
    labelCn: [m1, m2].map(d => (d.getMonth()+1)+'月')
  };
}

function computeStarRatings(monthOffset) {
  const range = getTwoMonthRange(monthOffset || 0);
  var today = new Date();
  today.setHours(0,0,0,0);

  var totalListenMet = 0, totalListenTotal = 0;
  var totalVideoDone = 0, totalVideoExpected = 0;
  // Per-month & per-class breakdown for performance report text
  var monthlyData = {}; // key: "2026-06" → { listenMet, listenTotal, videoDone, videoExpected, students: Set }
  var classes = Object.keys(CLASSES);

  // Scan every report week that overlaps our 2-month range
  // Start from first Sunday on/before m1 start, end at last Sunday after m2 end
  var scanSun = new Date(range.m1Start);
  scanSun.setDate(scanSun.getDate() - ((scanSun.getDay() + 7) % 7)); // back to Sunday
  var scanEnd = range.m2End;
  // Advance to next Sunday past m2 end
  var lastScanSat = new Date(scanEnd);
  while (lastScanSat.getDay() !== 6) lastScanSat.setDate(lastScanSat.getDate() + 1);

  while (scanSun.getTime() <= lastScanSat.getTime()) {
    var sat = new Date(scanSun); sat.setDate(sat.getDate() + 6);
    var satStr = dateStr(sat);

    // Determine which month(s) this week belongs to
    var weekMonths = [];
    var d = new Date(scanSun);
    while (d.getTime() <= sat.getTime()) {
      var mk = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
      if (!weekMonths.includes(mk)) weekMonths.push(mk);
      d.setDate(d.getDate() + 1);
    }

    for (var ci = 0; ci < classes.length; ci++) {
      var cn = classes[ci];
      var students = getAllStudents(cn);

      // Ensure month buckets exist
      weekMonths.forEach(function(mk) {
        if (!monthlyData[mk]) monthlyData[mk] = { listenMet: 0, listenTotal: 0, videoDone: 0, videoExpected: 0, students: new Set() };
      });

      // Listening — only up to today
      students.forEach(function(s) {
        if (getStudentCfg(cn, s.name).exemptListening) return;
        if (isConsecutiveLeave(cn, s.name, scanSun)) return;
        if (isStudentInactive(cn, s.name, scanSun)) return;
        var dd = new Date(scanSun);
        while (dd.getTime() <= sat.getTime()) {
          if (dd.getTime() > today.getTime()) break;
          totalListenTotal++;
          // Bucket by month
          var lk = dd.getFullYear() + '-' + String(dd.getMonth() + 1).padStart(2, '0');
          if (monthlyData[lk]) { monthlyData[lk].listenTotal++; }
          if (loadMinutesForDate(cn, s.name, dd) >= TARGET) {
            totalListenMet++;
            if (monthlyData[lk]) monthlyData[lk].listenMet++;
          }
          dd.setDate(dd.getDate() + 1);
        }
        // Track student presence in each month
        weekMonths.forEach(function(mk) {
          if (monthlyData[mk] && !isStudentInactive(cn, s.name, scanSun)) {
            monthlyData[mk].students.add(cn + ':' + s.name);
          }
        });
      });

      // Video
      var toCount = getCountableVideoEntries(cn, satStr);
      toCount.forEach(function(rec) {
        students.forEach(function(s) {
          if (isLeaveNoMakeup(cn, s.name, rec.date)) return;
          if (isStudentInactive(cn, s.name, scanSun)) return;
          totalVideoExpected++;
          if (rec.submissions[s.name]) totalVideoDone++;
          // Bucket by record date's month
          var vk = rec.date.substring(0, 7); // "YYYY-MM"
          if (monthlyData[vk]) {
            monthlyData[vk].videoExpected++;
            if (rec.submissions[s.name]) monthlyData[vk].videoDone++;
          }
        });
      });
    }

    scanSun.setDate(scanSun.getDate() + 7);
  }

  return {
    listenRate: totalListenTotal > 0 ? totalListenMet / totalListenTotal : 0,
    videoRate: totalVideoExpected > 0 ? totalVideoDone / totalVideoExpected : 0,
    listenMet: totalListenMet,
    listenTotal: totalListenTotal,
    videoDone: totalVideoDone,
    videoExpected: totalVideoExpected,
    monthlyData: monthlyData,
    label: range.label,
    labelCn: range.labelCn
  };
}

function computeReportSummary() {
  const sun = currentReportSunday;
  const sat = new Date(sun); sat.setDate(sun.getDate() + 6);
  const weekLabel = formatReportWeek(sun);
  const weekFileName = (sun.getMonth()+1)+'月'+(sun.getDate())+'-'+(sat.getMonth()+1)+'月'+(sat.getDate())+'日';

  const classes = [];
  let gListenTotal = 0, gListenMet = 0;
  let gVideoTotal = 0, gVideoDone = 0, gVideoLate = 0;
  let gAttTotal = 0, gAttPresent = 0, gAttBaseTotal = 0;

  for (const cn of Object.keys(CLASSES)) {
    const students = getAllStudents(cn);
    const lessonDates = getLessonDatesInReportWeek(cn, sun);
    const isCrossWeek = getSchedule(cn, sat).newLessonDay > getSchedule(cn, sat).reviewDay;
    const reportWeekKey = getISOWeekKey(sat);
    students.forEach(s => {
      if (getStudentCfg(cn, s.name).exemptListening) return;
      if (isConsecutiveLeave(cn, s.name, sun)) return; // exempt from listening KPI
      if (isStudentInactive(cn, s.name, sun)) return; // inactive (before join / after left)
      let totalDays = 0, metDays = 0;
      const d = new Date(sun);
      while (d.getTime() <= sat.getTime()) { totalDays++; if (loadMinutesForDate(cn, s.name, d) >= TARGET) metDays++; d.setDate(d.getDate() + 1); }
      listenTotal += totalDays; listenMet += metDays;
    });

    // 视频统计 V3：只统计截止日期已过的作业，请假不补的学生不计入分母
    let videoExpected = 0, videoDoneCount = 0, lateCount = 0;
    {
      const todayStr = dateStr(new Date());
      const toCount = getReportWeekVideoEntries(cn, sun, todayStr);
      const leaves = loadLeaves();
      toCount.forEach(rec => {
        students.forEach(s => {
          if (isLeaveNoMakeup(cn, s.name, rec.date)) return;
          if (isStudentInactive(cn, s.name, sun)) return; // inactive (before join / after left)
          videoExpected++;
          if (rec.submissions[s.name]) videoDoneCount++;
        });
      });
    }

    const reportLateSubs = loadLateSubs(cn, reportWeekKey);
    reportLateSubs.forEach(ls => { lateCount++; });

    let attTotal = 0, attPresent = 0;
    if (lessonDates) {
      [lessonDates.newLesson, lessonDates.review].forEach(ld => {
        const attData = loadAttendance(dateStr(ld));
        students.forEach(s => {
          if (isStudentInactive(cn, s.name, sun)) return; // inactive (before join / after left)
          attTotal++;
          if (!attData[cn] || (attData[cn][s.name] || 'present') === 'present') attPresent++;
        });
      });
      const leaves = loadLeaves();
      leaves.forEach(l => {
        if (!l.makeupScheduled || !l.makeupDate || l.className !== cn) return;
        const md = new Date(l.makeupDate + 'T00:00:00');
        if (md >= sun && md <= sat) {
          const isOwn = lessonDates && (l.date === dateStr(lessonDates.newLesson) || l.date === dateStr(lessonDates.review));
          if (!isOwn) { attPresent++; attTotal++; }
        }
      });
    }

    const activeStudentCount2 = students.filter(s => !isStudentInactive(cn, s.name, sun)).length;
    const attBase = activeStudentCount2 * 2;
    const attRate = attBase > 0 ? attPresent / attBase : 0;

    classes.push({ cn, listenTotal, listenMet, listenRate, videoExpected, videoDoneCount, lateCount, videoRate, attTotal, attPresent, attBase, attRate });
    gListenTotal += listenTotal; gListenMet += listenMet;
    gVideoTotal += videoExpected; gVideoDone += (videoDoneCount + lateCount); gVideoLate += lateCount;
    gAttTotal += attTotal; gAttPresent += attPresent; gAttBaseTotal += attBase;
  }

  const gListenRate = gListenTotal > 0 ? gListenMet / gListenTotal : 0;
  const gVideoRate = gVideoTotal > 0 ? gVideoDone / gVideoTotal : 0;
  const gAttRate = gAttBaseTotal > 0 ? gAttPresent / gAttBaseTotal : 0;
  const gOverall = (gListenRate + gVideoRate + gAttRate) / 3;

  return { weekLabel, weekFileName, sun, sat, classes, gListenTotal, gListenMet, gListenRate, gVideoTotal, gVideoDone, gVideoLate, gVideoRate, gAttTotal, gAttPresent, gAttBaseTotal, gAttRate, gOverall };
}

function renderAttendance() {
  const leaves = loadLeaves();
  const monday = getWeekMonday(attWeekOffset);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() - 1);
  sunday.setHours(0, 0, 0, 0);
  const sat = new Date(monday);
  sat.setDate(monday.getDate() + 5);

  let html = '<div class="action-bar"><span class="hint">出勤周报 · 每节课记录出勤/请假</span>'
    + '<div class="week-nav"><button onclick="prevWeekA()">◀</button>'
    + '<span class="week-label">' + formatWeekRange(monday) + '</span>'
    + '<button onclick="nextWeekA()">▶</button>'
    + (attWeekOffset !== 0 ? '<button onclick="goTodayA()" style="font-size:.72rem;width:auto;padding:0 10px;font-weight:600">本周</button>' : '')
    + '</div></div>';

  for (const cn of Object.keys(CLASSES)) {
    const students = getAllStudents(cn);
    const sched = getSchedule(cn, sat);
    if (!sched) continue;

    // Find new lesson and review dates in this week
    const nlDate = new Date(sunday);
    nlDate.setDate(sunday.getDate() + sched.newLessonDay);
    nlDate.setHours(0, 0, 0, 0);
    const rvDate = new Date(sunday);
    rvDate.setDate(sunday.getDate() + sched.reviewDay);
    rvDate.setHours(0, 0, 0, 0);

    const nlStr = dateStr(nlDate);
    const rvStr = dateStr(rvDate);
    const nlData = loadAttendance(nlStr);
    const rvData = loadAttendance(rvStr);
    if (!nlData[cn]) nlData[cn] = {};
    if (!rvData[cn]) rvData[cn] = {};

    // Count stats
    let nlPresent = 0, nlLeave = 0;
    students.forEach(s => {
      if ((nlData[cn][s.name] || 'present') === 'present') nlPresent++; else nlLeave++;
    });
    let rvPresent = 0, rvLeave = 0;
    students.forEach(s => {
      if ((rvData[cn][s.name] || 'present') === 'present') rvPresent++; else rvLeave++;
    });

    const formatMD = (d) => (d.getMonth() + 1) + '/' + d.getDate();
    const dayNames = ['日', '一', '二', '三', '四', '五', '六'];

    html += '<div class="att-section"><div class="class-header"><h2>' + cn + '<span class="count">' + students.length + ' 人</span></h2></div>';
    html += '<div class="att-summary">'
      + '<div class="att-summary-item">🆕 新课 (' + formatMD(nlDate) + ' 周' + dayNames[sched.newLessonDay] + ') <span class="num">' + nlPresent + '/' + students.length + '</span> 出勤</div>'
      + '<div class="att-summary-item">📝 复习课 (' + formatMD(rvDate) + ' 周' + dayNames[sched.reviewDay] + ') <span class="num">' + rvPresent + '/' + students.length + '</span> 出勤</div>'
      + '</div>';

    // Table-style layout for each class
    // Sort columns by actual date (some classes have review before new lesson in same week)
    const cols = nlDate <= rvDate
      ? [{ label: '🆕 新课', date: nlDate, str: nlStr, data: nlData },
         { label: '📝 复习课', date: rvDate, str: rvStr, data: rvData }]
      : [{ label: '📝 复习课', date: rvDate, str: rvStr, data: rvData },
         { label: '🆕 新课', date: nlDate, str: nlStr, data: nlData }];

    html += '<div style="overflow-x:auto"><table class="att-table"><thead><tr>'
      + '<th class="att-name-col">学生</th>'
      + cols.map(c => '<th class="att-lesson-col">' + c.label + '<br><span class="att-date-sub">' + formatMD(c.date) + '</span></th>').join('')
      + '</tr></thead><tbody>';

    students.forEach(s => {
      html += '<tr><td class="att-name-cell">' + escHtml(s.name) + '</td>';
      cols.forEach(c => {
        const status = c.data[cn][s.name] || 'present';
        html += '<td class="att-toggle-cell">'
          + '<button class="att-btn' + (status === 'present' ? ' active-present' : '') + '" onclick="setAttendanceDate(\'' + cn + '\',\'' + escHtml(s.name) + '\',\'' + c.str + '\',\'present\')">出勤</button>'
          + '<button class="att-btn' + (status === 'leave' ? ' active-leave' : '') + '" onclick="setAttendanceDate(\'' + cn + '\',\'' + escHtml(s.name) + '\',\'' + c.str + '\',\'leave\')">请假</button>'
          + '</td>';
      });
      html += '</tr>';
    });

    html += '</tbody></table></div></div>';
  }

  // Show cross-week makeups falling in this week → boosts this week's attendance
  const weekMakeups = leaves.filter(l => {
    if (!l.makeupScheduled || !l.makeupDate) return false;
    const md = new Date(l.makeupDate + 'T00:00:00');
    return md >= monday && md <= sat;
  });
  if (weekMakeups.length > 0) {
    html += '<div class="leave-history" style="border-left:3px solid #10b981"><h3>🔁 本周补课 · 计入本周出勤</h3>';
    weekMakeups.forEach(l => {
      html += '<div class="leave-item scheduled">'
        + '<div class="leave-info"><strong>' + l.className + '</strong> · ' + l.student
        + ' · 请假' + l.date + ' → 补课' + l.makeupDate + '</div></div>';
    });
    html += '<div style="font-size:.78rem;color:var(--text-muted);padding:0 12px 8px">这些补课将计入本周报的出勤统计</div></div>';
  }

  // Leave history
  html += '<div class="leave-history"><h3>📋 请假记录 · 待补课</h3>';
  const pendingLeaves = leaves.filter(l => !l.makeupScheduled && !l.noMakeup);
  if (pendingLeaves.length === 0) {
    html += '<div style="color:var(--text-muted);font-size:.84rem;padding:8px">暂无待补课的请假记录</div>';
  } else {
    leaves.forEach((l, origIdx) => {
      if (l.makeupScheduled || l.noMakeup) return;
      html += '<div class="leave-item pending-makeup">'
        + '<div class="leave-info"><strong>' + l.className + '</strong> · ' + l.student + ' · ' + l.date
        + (l.reason ? ' · ' + l.reason : '') + '</div>'
        + '<div class="leave-actions"><input type="date" id="makeupDate-' + origIdx + '" placeholder="补课日期">'
        + '<button class="btn-sm" onclick="scheduleMakeup(' + origIdx + ',document.getElementById(\'makeupDate-' + origIdx + '\').value)">安排补课</button>'
        + '<button class="btn-sm" onclick="markNoMakeup(' + origIdx + ')" style="background:#94a3b8;margin-left:4px">不补</button></div></div>';
    });
  }
  const noMakeupLeaves = leaves.filter(l => l.noMakeup);
  if (noMakeupLeaves.length > 0) {
    html += '<h3 style="margin-top:16px;font-size:.9rem">🚫 不补课</h3>';
    noMakeupLeaves.forEach(l => {
      html += '<div class="leave-item" style="background:#f1f5f9;border-left:3px solid #94a3b8"><div class="leave-info">'
        + '<strong>' + l.className + '</strong> · ' + l.student + ' · 请假' + l.date
        + ' · 不补课</div>'
        + '<button class="btn-ghost" onclick="removeLeave(' + leaves.indexOf(l) + ')" style="color:#ef4444">删除</button></div>';
    });
  }
  const scheduledLeaves = leaves.filter(l => l.makeupScheduled);
  if (scheduledLeaves.length > 0) {
    html += '<h3 style="margin-top:16px;font-size:.9rem">✅ 已安排补课</h3>';
    scheduledLeaves.forEach(l => {
      html += '<div class="leave-item scheduled"><div class="leave-info">'
        + '<strong>' + l.className + '</strong> · ' + l.student + ' · 请假' + l.date
        + ' → 补课' + l.makeupDate + '</div>'
        + '<button class="btn-ghost" onclick="removeLeave(' + leaves.indexOf(l) + ')" style="color:#ef4444">删除</button></div>';
    });
  }
  html += '</div>';

  document.getElementById('attendanceContent').innerHTML = html;
}

function setAttendanceDate(className, student, dateStr, status) {
  const attData = loadAttendance(dateStr);
  if (!attData[className]) attData[className] = {};
  attData[className][student] = status;
  saveAttendance(dateStr, attData);

  const leaves = loadLeaves();
  if (status === 'leave') {
    const exists = leaves.find(l => l.className === className && l.student === student && l.date === dateStr);
    if (!exists) {
      leaves.push({ className, student, date: dateStr, reason: '', makeupScheduled: false, makeupDate: null });
      saveLeaves(leaves);
    }
  } else {
    // Auto-remove leave record when switching back to present
    const filtered = leaves.filter(l => !(l.className === className && l.student === student && l.date === dateStr));
    if (filtered.length !== leaves.length) saveLeaves(filtered);
  }
  renderAttendance();
}

function prevWeekA() { attWeekOffset--; renderHeader(); renderAttendance(); }
function nextWeekA() { attWeekOffset++; renderHeader(); renderAttendance(); }
function goTodayA() { attWeekOffset = 0; renderHeader(); renderAttendance(); }

function scheduleMakeup(idx, makeupDate) {
  if (!makeupDate) { toast('请选择补课日期'); return; }
  const leaves = loadLeaves();
  if (idx >= 0 && idx < leaves.length) {
    leaves[idx].makeupScheduled = true;
    leaves[idx].makeupDate = makeupDate;
    saveLeaves(leaves);
    toast('补课已安排');
    renderAttendance();
  }
}

function markNoMakeup(idx) {
  const leaves = loadLeaves();
  if (idx >= 0 && idx < leaves.length) {
    leaves[idx].noMakeup = true;
    saveLeaves(leaves);
    toast('已标记为不补课');
    renderAttendance();
  }
}

function removeLeave(idx) {
  const leaves = loadLeaves();
  if (idx >= 0 && idx < leaves.length) {
    leaves.splice(idx, 1);
    saveLeaves(leaves);
    renderAttendance();
  }
}

function exportAllBackup() {
  const backup = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key.startsWith(STORAGE_PREFIX)) {
      try { backup[key] = JSON.parse(localStorage.getItem(key)); } catch (e) {}
    }
  }
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.download = 'Nova看板数据备份-' + dateStr(new Date()) + '.json';
  a.href = URL.createObjectURL(blob);
  a.click();
  URL.revokeObjectURL(a.href);
  toast('数据备份已下载');
}

function importBackup() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        const backup = JSON.parse(ev.target.result);
        let count = 0;
        for (const [key, value] of Object.entries(backup)) {
          if (key.startsWith(STORAGE_PREFIX) && typeof value === 'object') {
            localStorage.setItem(key, JSON.stringify(value));
            count++;
          }
        }
        // Clear migration flag so old-format video keys get re-migrated
        localStorage.removeItem(STORAGE_PREFIX + 'V-MIGRATED-v2');
        migrateVideoKeys();
        renderAll();
        toast('已恢复 ' + count + ' 条数据（视频记录已自动迁移）');
      } catch (err) { toast('备份文件格式错误'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetListeningWeek() {
  if (!confirm('确定重置本周听录音数据？')) return;
  const monday = getWeekMonday(weekOffset);
  const data = {};
  for (const cn of Object.keys(CLASSES)) {
    data[cn] = {};
    for (const s of getListeningStudents(cn)) {
      data[cn][s.name] = { mon: 0, tue: 0, wed: 0, thu: 0, fri: 0, sat: 0, sun: 0 };
    }
  }
  saveListening(monday, data);
  renderAll();
  toast('本周数据已重置');
}

function triggerImportExcel() {
  const input = document.createElement('input');
  input.type = 'file';
  input.setAttribute('accept', '.xls,.xlsx,.html');
  input.setAttribute('multiple', '');
  input.style.display = 'none';
  input.onchange = async function(e) {
    await handleExcelImport(e);
    input.remove();
  };
  document.body.appendChild(input);
  input.click();
}

async function handleExcelImport(e) {
  const files = Array.from(e.target.files || []);
  if (files.length === 0) return;

  let totalImported = 0;
  let allDates = [];
  let changes = {};
  const errors = [];
  const fileResults = [];

  toast('正在导入 ' + files.length + ' 个文件...');

  for (let i = 0; i < files.length; i++) {
    try {
      const result = await processSingleFile(files[i]);
      fileResults.push(files[i].name + ': ' + result.count + '条');
      totalImported += result.count;
      allDates = allDates.concat(result.dates || []);
      // Deep merge changes to avoid overwriting same-week data from different files
      if (result.changes) deepMergeChanges(changes, result.changes);
    } catch (err) {
      fileResults.push(files[i].name + ': ❌' + err.message);
      errors.push(files[i].name + ': ' + err.message);
    }
  }

  if (totalImported > 0) {
    if (allDates.length > 0) {
      autoNavigateToWeek(allDates, changes);
    } else {
      mergeImportChanges(changes);
      saveCurrentListeningWeek();
    }
    renderListening();
    renderHeader();
    const msg = '已从 ' + files.length + ' 个文件导入 ' + totalImported + ' 条记录';
    toast(errors.length > 0 ? msg + '（' + errors.length + ' 个失败）' : msg);
  } else if (errors.length === files.length) {
    toast('所有文件均导入失败: ' + fileResults.join('; '));
  } else {
    toast('0条记录。文件详情: ' + fileResults.join('; '));
  }
}

function processSingleFile(file) {
  return new Promise(function(resolve, reject) {
    // try XLSX binary first; fallback to text for HTML
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    if (ext === 'html' || ext === 'htm' || ext === 'xml') {
      const reader = new FileReader();
      reader.onload = function(ev) {
        try {
          const rawText = ev.target.result || '';
          console.log('🌐 HTML file:', file.name, 'length:', rawText.length);
          const result = parseHtmlTable(rawText);
          console.log('  → count:', result.count);
          resolve({ count: result.count, dates: result.dates || [], changes: result.changes || {} });
        } catch (err) {
          console.error('💥 HTML parse error', file.name, ':', err);
          reject(err);
        }
      };
      reader.onerror = function() { reject(new Error('读取失败')); };
      reader.readAsText(file);
      return;
    }

    // XLSX read — readAsArrayBuffer is the reliable modern approach
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        if (typeof XLSX === 'undefined') {
          reject(new Error('Excel库加载失败'));
          return;
        }
        const buf = ev.target.result;
        console.log('📄 File:', file.name, 'size:', file.size, 'buffer length:', buf && buf.byteLength);
        if (!buf || !buf.byteLength) {
          reject(new Error('文件内容为空'));
          return;
        }
        const data = new Uint8Array(buf);
        const wb = XLSX.read(data, { cellDates: true });
        console.log('📊 Format detected:', wb.SheetNames.join(', '));
        let count = 0, dates = [], changes = {};
        wb.SheetNames.forEach(function(sn) {
          const result = parseSheet(wb.Sheets[sn]);
          console.log('  Sheet', sn, '→ count:', result.count);
          count += result.count;
          dates = dates.concat(result.dates || []);
          if (result.changes) deepMergeChanges(changes, result.changes);
        });
        resolve({ count: count, dates: dates, changes: changes });
      } catch (err) {
        console.error('💥 Error parsing', file.name, ':', err);
        reject(err);
      }
    };
    reader.onerror = function() { reject(new Error('读取失败')); };
    reader.readAsArrayBuffer(file);
  });
}

function parseHtmlTable(html) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  const allRows = doc.querySelectorAll('tr');
  if (allRows.length < 3) return { count: 0, dates: [] };

  let headerRowCount = 0;
  for (let r = 0; r < allRows.length; r++) {
    if (allRows[r].querySelector('th')) { headerRowCount++; }
    else { break; }
  }
  if (headerRowCount === 0) return { count: 0, dates: [] };

  const grid = [];
  for (let r = 0; r < headerRowCount; r++) {
    grid[r] = [];
    const cells = allRows[r].querySelectorAll('th, td');
    let c = 0;
    for (let i = 0; i < cells.length; i++) {
      const el = cells[i];
      while (grid[r][c]) c++;
      const cs = parseInt(el.getAttribute('colspan')) || 1;
      const rs = parseInt(el.getAttribute('rowspan')) || 1;
      const txt = (el.textContent || '').trim();
      for (let dr = 0; dr < rs; dr++) {
        for (let dc = 0; dc < cs; dc++) {
          const rr = r + dr, cc = c + dc;
          if (!grid[rr]) grid[rr] = [];
          grid[rr][cc] = txt;
        }
      }
      c += cs;
    }
  }

  const colCount = Math.max(...grid.map(row => row.length));
  let nameCol = -1;
  const dateCols = {};
  const seenDateCols = new Set(); // avoid duplicates from colspan expansion

  for (let c = 0; c < colCount; c++) {
    const top = (grid[0] && grid[0][c]) || '';
    const sub = (grid[1] && grid[1][c]) || '';
    if (top.indexOf('姓名') >= 0) { nameCol = c; }
    const dateMatch = top.match(/^(\d{4}-\d{1,2}-\d{1,2})$/);
    if (dateMatch) {
      // Only add the first column for each date (skip colspan duplicates)
      // Also prefer columns where sub-header says '打卡' (not '批复')
      const dateKey = dateMatch[1];
      if (!seenDateCols.has(dateKey)) {
        seenDateCols.add(dateKey);
        dateCols[c] = dateKey;
      } else if (sub.indexOf('打卡') >= 0) {
        // Replace previous entry with the explicit 打卡 column
        for (const k in dateCols) { if (dateCols[k] === dateKey) { delete dateCols[k]; break; } }
        dateCols[c] = dateKey;
      }
    }
  }

  if (nameCol < 0) nameCol = 2;
  if (Object.keys(dateCols).length === 0) return { count: 0, dates: [] };

  let count = 0;
  const importDates = [];
  // changes structure: { mondayISO: { cls: { name: { dk: minutes } } } }
  const changes = {};
  for (let r = headerRowCount; r < allRows.length; r++) {
    const tds = allRows[r].querySelectorAll('td');
    if (tds.length <= nameCol) continue;
    const name = (tds[nameCol].textContent || '').trim();
    if (!name) continue;

    let cls = '';
    if (nameCol > 0 && (nameCol - 1) < tds.length) {
      const cc = (tds[nameCol - 1].textContent || '').trim();
      const cm = cc.match(/(\d+)班/);
      if (cm) cls = cm[1] + '班';
    }
    if (!cls) cls = findClassForStudent(name);
    if (!cls) continue;

    for (const colStr in dateCols) {
      const col = parseInt(colStr);
      if (col >= tds.length) continue;
      let cellText = (tds[col].textContent || '').trim();
      if (!cellText) cellText = (tds[col].getAttribute('title') || '').trim();
      if (!cellText || cellText === 'NaN') continue;
      const mm = cellText.match(/(\d+)/);
      if (!mm) continue;
      const minutes = parseInt(mm[1]);
      if (minutes > 0) {
        const dk = dateStrToDayKey(dateCols[colStr]);
        if (dk) {
          const mondayKey = getMondayKeyFromDateStr(dateCols[colStr]);
          if (!changes[mondayKey]) changes[mondayKey] = {};
          if (!changes[mondayKey][cls]) changes[mondayKey][cls] = {};
          if (!changes[mondayKey][cls][name]) changes[mondayKey][cls][name] = {};
          changes[mondayKey][cls][name][dk] = minutes;
          importDates.push(dateCols[colStr]);
          count++;
        }
      }
    }
  }
  return { count, dates: importDates, changes };
}

function normalizeCell(v) {
  if (v instanceof Date && !isNaN(v.getTime())) {
    return v.getFullYear() + '-' + String(v.getMonth()+1).padStart(2,'0') + '-' + String(v.getDate()).padStart(2,'0');
  }
  return String(v || '').trim();
}

function parseSheet(ws) {
  var rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
  if (rows.length < 3) return { count: 0, dates: [] };
  var isA = false, isB = false;
  for (var r = 0; r < Math.min(6, rows.length); r++) {
    var row = rows[r] || [];
    for (var c = 0; c < row.length; c++) {
      var cell = normalizeCell(row[c]);
      if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(cell)) isA = true;
      if (/^\d{1,2}月\d{1,2}日$/.test(cell)) isB = true;
    }
  }
  if (isA) return parseFormatA(rows);
  if (isB) return parseFormatB(rows);
  return { count: 0, dates: [], changes: {} };
}

function parseFormatA(rows) {
  var dateCols = {};
  var nameCol = -1;
  for (var r = 0; r < Math.min(6, rows.length); r++) {
    var row = rows[r] || [];
    for (var c = 0; c < row.length; c++) {
      var cell = normalizeCell(row[c]);
      if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(cell)) { dateCols[c] = cell; }
      if (cell.indexOf('姓名') >= 0) nameCol = c;
    }
  }
  if (Object.keys(dateCols).length === 0) return { count: 0, dates: [] };
  if (nameCol < 0) nameCol = 2;
  return parseDataRows(rows, nameCol, dateCols, true);
}

function parseFormatB(rows) {
  var now = new Date();
  var dateCols = {};
  var nameCol = -1;
  for (var r = 0; r < Math.min(6, rows.length); r++) {
    var row = rows[r] || [];
    for (var c = 0; c < row.length; c++) {
      var cell = normalizeCell(row[c]);
      var m = cell.match(/^(\d{1,2})月(\d{1,2})日$/);
      if (m) {
        var mo = parseInt(m[1]), dy = parseInt(m[2]);
        // If the month is ahead of current month by more than 1, it's likely last year
        var y = (mo > now.getMonth() + 2) ? now.getFullYear() - 1 : now.getFullYear();
        dateCols[c] = y + '-' + String(mo).padStart(2,'0') + '-' + String(dy).padStart(2,'0');
      }
      if (cell.indexOf('姓名') >= 0) nameCol = c;
    }
  }
  if (Object.keys(dateCols).length === 0) return { count: 0, dates: [] };
  if (nameCol < 0) nameCol = 2;
  return parseDataRows(rows, nameCol, dateCols, false);
}

function parseDataRows(rows, nameCol, dateCols, stripMinSuffix) {
  var classCol = nameCol > 0 ? nameCol - 1 : -1;
  var dataStart = -1;
  for (var r = 2; r < rows.length; r++) {
    var row = rows[r] || [];
    if (row.length <= nameCol) continue;
    var nm = String(row[nameCol] || '').trim();
    if (/^[\u4e00-\u9fa5]{2,4}$/.test(nm)) { dataStart = r; break; }
  }
  if (dataStart < 0) return { count: 0, dates: [] };

  var importDates = [];
  var count = 0;
  // changes structure: { mondayISO: { cls: { name: { dk: minutes } } } }
  var changes = {};
  for (var r = dataStart; r < rows.length; r++) {
    var row = rows[r] || [];
    var name = String(row[nameCol] || '').trim();
    if (!name || !/^[\u4e00-\u9fa5]{2,4}$/.test(name)) continue;

    var cls = '';
    if (classCol >= 0) {
      var cc = String(row[classCol] || '');
      var cm = cc.match(/(\d+)班/);
      if (cm) cls = cm[1] + '班';
    }
    if (!cls) cls = findClassForStudent(name);
    if (!cls) continue;

    for (var colStr in dateCols) {
      var col = parseInt(colStr);
      var val = row[col];
      if (val === '' || val == null || String(val) === 'NaN') continue;
      var minutes = 0;
      if (typeof val === 'number') { minutes = Math.round(val); }
      else { var s = String(val); var mm = s.match(/(\d+)/); if (mm) minutes = parseInt(mm[1]); }
      if (minutes > 0) {
        var dk = dateStrToDayKey(dateCols[colStr]);
        if (dk) {
          var mondayKey = getMondayKeyFromDateStr(dateCols[colStr]);
          if (!changes[mondayKey]) changes[mondayKey] = {};
          if (!changes[mondayKey][cls]) changes[mondayKey][cls] = {};
          if (!changes[mondayKey][cls][name]) changes[mondayKey][cls][name] = {};
          changes[mondayKey][cls][name][dk] = minutes;
          importDates.push(dateCols[colStr]);
          count++;
        }
      }
    }
  }
  return { count: count, dates: importDates, changes: changes };
}

function dateStrToDayKey(dateStr) {
  var d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return null;
  var keys = ['sun','mon','tue','wed','thu','fri','sat'];
  return keys[d.getDay()] || null;
}

function getMondayKeyFromDateStr(dateStr) {
  var d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return dateStr;
  var mon = getMonday(d);
  return mon.getFullYear() + '-' + String(mon.getMonth()+1).padStart(2,'0') + '-' + String(mon.getDate()).padStart(2,'0');
}

function findClassForStudent(name) {
  for (const cn of Object.keys(CLASSES)) {
    for (const s of getListeningStudents(cn)) {
      if (s.name === name) return cn;
    }
  }
  return '';
}

// Deep merge changes: { mondayKey: { cls: { name: { dk: minutes } } } }
// Avoids Object.assign overwriting same-week data from different files
function deepMergeChanges(target, source) {
  for (var mk in source) {
    if (!target[mk]) target[mk] = {};
    for (var cls in source[mk]) {
      if (!target[mk][cls]) target[mk][cls] = {};
      for (var name in source[mk][cls]) {
        if (!target[mk][cls][name]) target[mk][cls][name] = {};
        for (var dk in source[mk][cls][name]) {
          target[mk][cls][name][dk] = source[mk][cls][name][dk];
        }
      }
    }
  }
}

function saveCurrentListeningWeek() {
  const monday = getWeekMonday(weekOffset);
  saveListening(monday, getOrCreateListening(monday));
}

function mergeImportChanges(changes) {
  // changes: { mondayISO: { cls: { name: { dk: minutes } } } }
  for (var mondayKey in changes) {
    var mon = new Date(mondayKey + 'T00:00:00');
    if (isNaN(mon.getTime())) continue;
    var data = getOrCreateListening(mon);
    for (var cls in changes[mondayKey]) {
      if (!data[cls]) data[cls] = {};
      for (var name in changes[mondayKey][cls]) {
        if (!data[cls][name]) data[cls][name] = { mon:0,tue:0,wed:0,thu:0,fri:0,sat:0,sun:0 };
        for (var dk in changes[mondayKey][cls][name]) {
          data[cls][name][dk] = Math.max(data[cls][name][dk] || 0, changes[mondayKey][cls][name][dk]);
        }
      }
    }
    saveListening(mon, data);
  }
}

function autoNavigateToWeek(dateStrs, changes) {
  // Save ALL weeks present in changes
  mergeImportChanges(changes);

  // Navigate to the week with the MOST records (not earliest date)
  // because a file spanning Sun-Mon would have Sun in prev week but most data in current week
  var weekCounts = {};
  for (var mk in changes) {
    var total = 0;
    for (var cls in changes[mk]) for (var nm in changes[mk][cls]) for (var dk in changes[mk][cls][nm]) total++;
    weekCounts[mk] = total;
  }
  var bestMonday = null;
  var bestCount = 0;
  for (var mk in weekCounts) {
    if (weekCounts[mk] > bestCount) {
      bestCount = weekCounts[mk];
      bestMonday = mk;
    }
  }
  if (!bestMonday) return;

  var targetMon = new Date(bestMonday + 'T00:00:00');
  if (isNaN(targetMon.getTime())) return;

  var curMonday = getWeekMonday(weekOffset);
  if (targetMon.getTime() === curMonday.getTime()) return;

  var curWeekMonday = getWeekMonday(0);
  var diffDays = (targetMon.getTime() - curWeekMonday.getTime()) / 86400000;
  weekOffset = Math.round(diffDays / 7);

  var weeksCount = Object.keys(changes).length;
  var msg = weeksCount > 1
    ? '已导入 ' + weeksCount + ' 周数据，定位到数据最多的一周 ' + formatWeekRange(targetMon)
    : '已自动定位到 ' + formatWeekRange(targetMon);
  toast(msg);
}

// ─── Monthly Heatmap ───

function showHeatmap(className, studentName, btn) {
  const today = new Date(); today.setHours(0,0,0,0);
  const cfg = getStudentCfg(className, studentName);
  const sourceName = (cfg && cfg.syncWith) ? cfg.syncWith : studentName;

  // Build 4 weeks: W-3, W-2, 上周, 本周
  const weekLabels = ['W-3', 'W-2', '上周', '本周'];
  const weeks = [];
  for (let w = 3; w >= 0; w--) {
    const mon = getWeekMonday(-w);
    const data = getOrCreateListening(mon);
    weeks.push({ label: weekLabels[3 - w], mon: dateStr(mon), data });
  }

  const DAY_LABELS_SHORT = ['周一','周二','周三','周四','周五','周六','周日'];

  let totalMin = 0, totalDays = 0, totalMetDays = 0, maxStreak = 0, currStreak = 0;
  let rowsHtml = '';

  weeks.forEach(function(wk) {
    const refMonday = new Date(wk.mon + 'T00:00:00');
    let cellsHtml = '';
    DAY_KEYS.forEach(function(k, di) {
      const dayDate = new Date(refMonday);
      dayDate.setDate(refMonday.getDate() + di);
      dayDate.setHours(0,0,0,0);
      const isFuture = dayDate.getTime() > today.getTime();
      const isToday = dayDate.getTime() === today.getTime();

      const v = (wk.data[className] && wk.data[className][sourceName])
        ? (wk.data[className][sourceName][k] || 0) : 0;

      let label = isToday ? '今天' : DAY_LABELS_SHORT[di];
      let cls, tag;
      if (isFuture) { cls = 'future'; tag = ''; }
      else if (isToday && v < TARGET) { cls = 'today-pending'; tag = v > 0 ? '差' + (TARGET - v) : '待打'; }
      else if (v >= TARGET) { cls = 'met'; tag = '✓'; }
      else if (v > 0) { cls = 'unmet'; tag = '差' + (TARGET - v); }
      else { cls = 'unmet'; tag = '未打'; }

      if (!isFuture) {
        totalMin += v;
        if (v > 0) { totalDays++; currStreak++; maxStreak = Math.max(maxStreak, currStreak); }
        else currStreak = 0;
        if (v >= TARGET) totalMetDays++;
      }

      cellsHtml += '<div class="day-cell"><div class="day-box ' + cls + '">'
        + '<span class="day-label">' + label + '</span>'
        + '<span class="day-val">' + (isFuture ? '--' : (v > 0 ? v : '--')) + '</span>'
        + '<span class="day-tag">' + tag + '</span></div></div>';
    });
    rowsHtml += '<div class="hm-week-row">'
      + '<span class="hm-week-label">' + wk.label + '</span>'
      + '<div class="hm-week-cells">' + cellsHtml + '</div></div>';
  });

  const cardHtml = '<div class="hm-header"><div class="hm-title">🔥 ' + escHtml(studentName)
    + '<span class="hm-class">' + className + '</span></div>'
    + '<div style="display:flex;align-items:center;gap:4px">'
    + '<button class="hm-download-btn" title="下载" onclick="downloadHeatmap()">⬇️</button>'
    + '<button class="hm-close" onclick="closeHeatmap()">✕</button></div></div>'
    + '<div class="hm-body">'
    + rowsHtml
    + '<div class="hm-stats">'
    + '<div class="hm-stat"><div class="hm-stat-val">' + totalMin + '<span class="unit"> min</span></div><div class="hm-stat-lbl">总分钟</div></div>'
    + '<div class="hm-stat"><div class="hm-stat-val">' + totalDays + '<span class="unit"> 天</span></div><div class="hm-stat-lbl">打卡天数</div></div>'
    + '<div class="hm-stat"><div class="hm-stat-val">' + totalMetDays + '<span class="unit"> 天</span></div><div class="hm-stat-lbl">达标天数</div></div>'
    + '<div class="hm-stat"><div class="hm-stat-val">' + maxStreak + '<span class="unit"> 天</span></div><div class="hm-stat-lbl">最长连续</div></div>'
    + '</div></div>';

  document.getElementById('heatmapCard').innerHTML = cardHtml;
  document.getElementById('heatmapOverlay').classList.remove('hidden');
}

function closeHeatmap(e) {
  if (e && e.target !== document.getElementById('heatmapOverlay')) return;
  document.getElementById('heatmapOverlay').classList.add('hidden');
}

function downloadHeatmap() {
  const card = document.getElementById('heatmapCard');
  const overlay = document.getElementById('heatmapOverlay');
  overlay.style.background = 'white';
  overlay.style.backdropFilter = 'none';
  html2canvas(card, { scale: 2, backgroundColor: '#ffffff' }).then(canvas => {
    overlay.style.background = '';
    overlay.style.backdropFilter = '';
    const link = document.createElement('a');
    link.download = 'heatmap-' + new Date().toISOString().slice(0,10) + '.png';
    link.href = canvas.toDataURL();
    link.click();
  }).catch(() => {
    overlay.style.background = '';
    overlay.style.backdropFilter = '';
  });
}

  const nlLabel = ['周日','周一','周二','周三','周四','周五','周六'][cls.newLessonDay];
  const rvLabel = ['周日','周一','周二','周三','周四','周五','周六'][cls.reviewDay];

  const fmtPublished = (dateStr) => {
    if (!dateStr) return '';
    const [y, m, d] = dateStr.split('-').map(Number);
    return (+m) + '月' + (+d) + '日';
  };

  let html = '<div class="tpl-tracker">'
    + '<div class="tpl-tracker-title">📋 发布追踪</div>';

  // ── New Lesson group ──
  html += '<div class="tpl-group-label">🆕 新课（' + nlLabel + '）</div>';

  html += '<div class="tpl-row ' + (nlCardDone ? 'done' : 'pending') + '">'
    + '<span class="tpl-icon">📝</span>'
    + '<span class="tpl-label">复述提示卡</span>'
    + (nlCardDone
      ? '<span class="tpl-status">✅ 已发布</span><span class="tpl-date">' + fmtPublished(data.cardPublished) + '</span>'
        + '<button class="tpl-btn undo" onclick="toggleTemplateItem(\'' + className + '\',\'' + weekKey + '\',\'cardPublished\')">撤销</button>'
      : '<span class="tpl-status">⏳ 待发布</span>'
        + '<button class="tpl-btn mark" onclick="toggleTemplateItem(\'' + className + '\',\'' + weekKey + '\',\'cardPublished\')">标记已发</button>')
    + '</div>';

  html += '<div class="tpl-row ' + (nlVideoDone ? 'done' : 'pending') + '">'
    + '<span class="tpl-icon">🎬</span>'
    + '<span class="tpl-label">复述视频模板</span>'
    + (nlVideoDone
      ? '<span class="tpl-status">✅ 已录制</span><span class="tpl-date">' + fmtPublished(data.videoRecorded) + '</span>'
        + '<button class="tpl-btn undo" onclick="toggleTemplateItem(\'' + className + '\',\'' + weekKey + '\',\'videoRecorded\')">撤销</button>'
      : '<span class="tpl-status">⏳ 待录制</span>'
        + '<button class="tpl-btn mark" onclick="toggleTemplateItem(\'' + className + '\',\'' + weekKey + '\',\'videoRecorded\')">标记已录</button>')
    + '</div>';

  // ── Review Lesson group ──
  html += '<div class="tpl-group-label">📝 复习课（' + rvLabel + '）</div>';

  html += '<div class="tpl-row ' + (rvCardDone ? 'done' : 'pending') + '">'
    + '<span class="tpl-icon">📝</span>'
    + '<span class="tpl-label">复述提示卡</span>'
    + (rvCardDone
      ? '<span class="tpl-status">✅ 已发布</span><span class="tpl-date">' + fmtPublished(data.rvCardPublished) + '</span>'
        + '<button class="tpl-btn undo" onclick="toggleTemplateItem(\'' + className + '\',\'' + weekKey + '\',\'rvCardPublished\')">撤销</button>'
      : '<span class="tpl-status">⏳ 待发布</span>'
        + '<button class="tpl-btn mark" onclick="toggleTemplateItem(\'' + className + '\',\'' + weekKey + '\',\'rvCardPublished\')">标记已发</button>')
    + '</div>';

  html += '<div class="tpl-row ' + (rvVideoDone ? 'done' : 'pending') + '">'
    + '<span class="tpl-icon">🎬</span>'
    + '<span class="tpl-label">复述视频模板</span>'
    + (rvVideoDone
      ? '<span class="tpl-status">✅ 已录制</span><span class="tpl-date">' + fmtPublished(data.rvVideoRecorded) + '</span>'
        + '<button class="tpl-btn undo" onclick="toggleTemplateItem(\'' + className + '\',\'' + weekKey + '\',\'rvVideoRecorded\')">撤销</button>'
      : '<span class="tpl-status">⏳ 待录制</span>'
        + '<button class="tpl-btn mark" onclick="toggleTemplateItem(\'' + className + '\',\'' + weekKey + '\',\'rvVideoRecorded\')">标记已录</button>')
    + '</div>';

  // All done celebration
  if (allDone) {
    html += '<div class="tpl-tracker-all-done">🎉 本周发布全部完成！可以安心准备新课啦~</div>';
  }

  html += '</div>';
  return html;
}
