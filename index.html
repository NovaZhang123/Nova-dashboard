<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova 英语工作看板</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"
        onerror="var s=document.createElement('script');s.src='https://unpkg.com/xlsx@0.20.3/dist/xlsx.full.min.js';s.onerror=function(){window._xlsxLoadFailed=true};document.head.appendChild(s);"></script>
<style>
:root {
  --bg: #f4f2ee;
  --surface: #ffffff;
  --green: #10b981;
  --green-light: #ecfdf5;
  --green-border: #a7f3d0;
  --green-text: #065f46;
  --red: #ef4444;
  --red-light: #fef2f2;
  --red-border: #fecaca;
  --red-text: #991b1b;
  --amber: #f59e0b;
  --amber-light: #fffbeb;
  --amber-text: #92400e;
  --text: #1e293b;
  --text-muted: #94a3b8;
  --text-soft: #64748b;
  --accent: #7c3aed;
  --accent-light: #f5f3ff;
  --border: #e2e8f0;
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 8px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.03);
  --shadow-md: 0 4px 16px rgba(0,0,0,.06), 0 1px 4px rgba(0,0,0,.04);
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* Header */
.header {
  background: rgba(255,255,255,.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 14px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-brand { display: flex; align-items: center; gap: 10px; }
.header-brand .logo {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, #7c3aed, #a78bfa);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem; color: white;
}
.header-brand h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: -.01em; }
.header-brand .subtitle { font-size: .75rem; color: var(--text-muted); font-weight: 400; }

.controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.controls select {
  padding: 7px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-xs);
  font-size: .85rem; background: white; color: var(--text); cursor: pointer; outline: none;
  font-family: inherit;
}
.controls select:focus { border-color: var(--accent); }

/* Week nav */
.week-nav {
  display: flex; align-items: center; gap: 4px;
  background: white; border: 1.5px solid var(--border); border-radius: var(--radius-xs); padding: 3px;
}
.week-nav button {
  width: 30px; height: 30px; border: none; border-radius: 6px;
  background: transparent; cursor: pointer; font-size: .85rem;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-soft); transition: all .15s;
}
.week-nav button:hover { background: var(--accent-light); color: var(--accent); }
.week-nav .week-label {
  font-size: .82rem; font-weight: 600; color: var(--text);
  padding: 0 10px; min-width: 120px; text-align: center; user-select: none;
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; border: none; border-radius: var(--radius-xs);
  font-size: .84rem; font-weight: 600; cursor: pointer;
  transition: all .2s; font-family: inherit; white-space: nowrap;
}
.btn-primary { background: var(--accent); color: white; box-shadow: 0 1px 3px rgba(124,58,237,.25); }
.btn-primary:hover { background: #6d28d9; }
.btn-outline { background: white; color: var(--accent); border: 1.5px solid var(--accent); }
.btn-outline:hover { background: var(--accent-light); }
.btn-green { background: var(--green-light); color: var(--green-text); border: 1.5px solid var(--green-border); }
.btn-green:hover { background: #d1fae5; }
.btn-sm {
  font-size: .76rem; padding: 5px 12px; border-radius: 6px; font-weight: 500;
  background: var(--accent-light); color: var(--accent); border: 1px solid transparent; cursor: pointer;
}
.btn-sm:hover { border-color: var(--accent); }
.btn-ghost {
  background: transparent; border: none; color: var(--text-soft); font-size: .74rem;
  cursor: pointer; padding: 6px 10px; border-radius: 6px; font-weight: 500;
  font-family: inherit; transition: all .15s; white-space: nowrap;
}
.btn-ghost:hover { background: #f1f5f9; color: var(--text); }

.storage-indicator {
  font-size: .72rem; font-weight: 600; padding: 4px 10px; border-radius: 20px; white-space: nowrap;
}
.storage-indicator.saved { background: var(--green-light); color: var(--green-text); }
.storage-indicator.default { background: var(--amber-light); color: var(--amber-text); }
.storage-indicator.empty { background: #f8fafc; color: var(--text-muted); }
.sep { width: 1px; height: 24px; background: var(--border); margin: 0 2px; }

/* Main */
.main { max-width: 1440px; margin: 0 auto; padding: 28px 32px 40px; }

/* Tab Bar */
.tab-bar {
  display: flex; gap: 4px; padding: 6px;
  background: var(--surface); border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm); margin-bottom: 20px;
}
.tab-btn {
  flex: 1; padding: 10px 14px; border: none; background: transparent;
  border-radius: 8px; font-size: .88rem; font-weight: 600; cursor: pointer;
  font-family: inherit; color: var(--text-soft); transition: all .2s;
}
.tab-btn:hover { background: #f1f5f9; color: var(--text); }
.tab-btn.active { background: var(--accent); color: white; box-shadow: 0 1px 3px rgba(124,58,237,.25); }
.tab-content { display: none; }
.tab-content.active { display: block; }

.action-bar {
  display: flex; align-items: center; gap: 10px; margin-bottom: 24px; flex-wrap: wrap;
}
.action-bar .hint { font-size: .8rem; color: var(--text-muted); flex: 1; min-width: 200px; }

/* Class Section */
.class-section { margin-bottom: 36px; }
.class-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
}
.class-header h2 { font-size: 1.1rem; font-weight: 700; display: flex; align-items: baseline; gap: 8px; }
.class-header h2 .count { font-size: .8rem; color: var(--text-muted); font-weight: 400; }
.pill {
  font-size: .75rem; padding: 4px 12px; border-radius: 20px; font-weight: 600;
}
.pill-allgood { background: var(--green-light); color: var(--green-text); }
.pill-warn { background: var(--red-light); color: var(--red-text); }

/* Student Grid */
.student-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; }

/* Student Card */
.student-card {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  overflow: hidden; transition: all .25s; border: 1.5px solid transparent;
}
.student-card:hover { box-shadow: var(--shadow-md); border-color: var(--border); transform: translateY(-2px); }
.student-card.all-met { border-left: 4px solid var(--green); }
.student-card.has-unmet { border-left: 4px solid var(--red); }

.sc-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 8px; }
.sc-info { display: flex; flex-direction: column; gap: 2px; }
.sc-name { font-size: 1rem; font-weight: 700; color: var(--text); }
.sc-name .sync-tag { font-size: .65rem; color: var(--accent); font-weight: 500; margin-left: 4px; }
.sc-date { font-size: 0.7rem; color: var(--text-muted); }

.sc-days { display: flex; gap: 5px; padding: 0 18px 10px; }
.day-cell { flex: 1; cursor: pointer; position: relative; }
.day-box {
  width: 100%; max-width: 56px; border-radius: var(--radius-sm);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1px; padding: 8px 4px; min-height: 64px;
  transition: all .2s; border: 2px solid transparent; margin: 0 auto; user-select: none;
}
.day-box:hover { border-color: var(--accent) !important; box-shadow: 0 0 0 3px rgba(124,58,237,.15); transform: scale(1.06); z-index: 2; }
.day-box .day-label { font-size: .6rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.day-box .day-val { font-size: .9rem; font-weight: 800; line-height: 1; }
.day-box .day-tag { font-size: .52rem; font-weight: 600; margin-top: 1px; }
.day-box.met { background: var(--green-light); border-color: var(--green-border); color: var(--green-text); }
.day-box.unmet { background: var(--red-light); border-color: var(--red-border); color: var(--red-text); }
.day-box.future { background: #F1F5F9; border-color: #E2E8F0; color: #A0AEC0; opacity: 0.6; cursor: default; pointer-events: none; }
.day-box.today-pending { background: #FFFBEB; border-color: #FCD34D; color: #B45309; }
.day-box.today-pending:hover { border-color: #F59E0B !important; box-shadow: 0 0 0 3px rgba(245,158,11,.25); }

.day-edit-input {
  width: 100%; max-width: 56px; border-radius: var(--radius-sm); text-align: center;
  font-size: 1rem; font-weight: 800; border: 2.5px solid var(--accent); outline: none;
  box-shadow: 0 0 0 4px rgba(124,58,237,.2); color: var(--text); background: white;
  padding: 8px 4px; min-height: 64px; margin: 0 auto; font-family: inherit; display: none;
}
.day-cell.editing .day-box { display: none; }
.day-cell.editing .day-edit-input { display: block; }

/* Progress bar */
.sc-bar { padding: 0 18px 14px; display: flex; align-items: center; gap: 10px; }
.sc-bar .bar-track { flex: 1; height: 6px; background: #f1f5f9; border-radius: 10px; overflow: hidden; }
.sc-bar .bar-fill { height: 100%; border-radius: 10px; transition: width .5s; }
.bar-fill.green { background: var(--green); }
.bar-fill.red { background: var(--red); }
.sc-bar .bar-text { font-size: .72rem; color: var(--text-soft); font-weight: 600; min-width: 80px; text-align: right; }

/* Card actions (download) */
.sc-actions { display: flex; align-items: center; gap: 6px; }
.sc-download-btn {
  width: 28px; height: 28px; border-radius: 7px; border: none; background: transparent;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); font-size: .85rem; transition: all .15s;
}
.sc-download-btn:hover { background: var(--accent-light); color: var(--accent); }
.sc-heatmap-btn { width: 28px; height: 28px; border-radius: 7px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: .85rem; transition: all .15s; }
.sc-heatmap-btn:hover { background: var(--amber-light); color: var(--amber-text); }

/* Heatmap overlay */
.heatmap-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.4); z-index: 10000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
.heatmap-overlay.hidden { display: none; }
.heatmap-card { background: white; border-radius: 16px; box-shadow: 0 24px 64px rgba(0,0,0,.18); max-width: 520px; width: 94%; max-height: 85vh; overflow-y: auto; animation: hmSlide .28s ease; }
@keyframes hmSlide { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
.hm-header { padding: 18px 24px 14px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: white; z-index: 1; border-bottom: 1px solid #f1f5f9; }
.hm-title { font-size: 1.05rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
.hm-title .hm-class { font-size: .78rem; color: var(--text-muted); font-weight: 500; }
.hm-close { width: 32px; height: 32px; border-radius: 8px; border: none; background: #f1f5f9; cursor: pointer; font-size: 1.1rem; color: #64748b; display: flex; align-items: center; justify-content: center; transition: all .15s; }
.hm-close:hover { background: #e2e8f0; color: var(--text); }
.hm-body { padding: 20px 24px 24px; }
.hm-week-row { display: flex; gap: 6px; align-items: flex-start; margin-bottom: 10px; }
.hm-week-label { min-width: 44px; text-align: right; font-size: .7rem; font-weight: 700; color: var(--text-muted); padding-top: 24px; line-height: 1; }
.hm-week-cells { display: flex; flex: 1; gap: 4px; }
.hm-week-cells .day-cell { flex: 1; }
.hm-week-cells .day-box { min-height: 52px; padding: 6px 2px; border-radius: var(--radius-sm); width: 100%; max-width: none; }
.hm-week-cells .day-box .day-val { font-size: .85rem; }
.hm-week-cells .day-box .day-tag { font-size: .5rem; }
.hm-week-cells .day-box .day-label { font-size: .55rem; }
.hm-download-btn { width: 32px; height: 32px; border-radius: 8px; border: none; background: #f1f5f9; cursor: pointer; font-size: .9rem; color: #64748b; display: flex; align-items: center; justify-content: center; transition: all .15s; margin-right: 6px; }
.hm-download-btn:hover { background: #e2e8f0; color: var(--text); }
.hm-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 18px; padding-top: 16px; border-top: 1px solid #f1f5f9; }
.hm-stat { text-align: center; }
.hm-stat-val { font-size: 1.25rem; font-weight: 700; color: var(--text); }
.hm-stat-val .unit { font-size: .75rem; font-weight: 500; color: var(--text-muted); }
.hm-stat-lbl { font-size: .65rem; color: var(--text-muted); margin-top: 2px; }

/* Compare mode */
.student-card.compare-mode .sc-days { flex-direction: column; gap: 8px; }
.sc-week-row { display: flex; gap: 5px; align-items: center; }
.sc-week-row .day-box { min-height: 48px; padding: 5px 2px; }
.sc-week-row .day-box .day-val { font-size: .8rem; }
.sc-week-row .day-box .day-tag { font-size: .5rem; }
.sc-week-label {
  font-size: .6rem; font-weight: 700; color: var(--text-muted);
  writing-mode: vertical-rl; letter-spacing: .08em; text-align: center;
  padding: 2px 0; width: 16px; flex-shrink: 0;
}
.sc-compare-summary {
  display: flex; align-items: center; gap: 10px; padding: 0 18px 10px;
  font-size: .72rem; color: var(--text-soft);
}
.sc-compare-summary .change-up { color: var(--green); font-weight: 700; }
.sc-compare-summary .change-down { color: var(--red); font-weight: 700; }
.sc-compare-summary .change-eq { color: var(--text-muted); font-weight: 600; }
.sc-compare-bar { padding: 0 18px 12px; display: flex; align-items: center; gap: 10px; }
.sc-compare-bar .bar-track { flex: 1; height: 4px; background: #f1f5f9; border-radius: 10px; overflow: hidden; }
.sc-compare-bar .bar-fill { height: 100%; border-radius: 10px; }
.sc-compare-bar .bar-fill.prev { background: #cbd5e1; }
.sc-compare-bar .bar-text { font-size: .65rem; color: var(--text-soft); font-weight: 600; min-width: 70px; text-align: right; }

/* Toggle button in action bar */
.action-bar .toggle-btn {
  padding: 5px 12px; border-radius: 8px; border: 1.5px solid var(--border);
  background: white; font-size: .78rem; font-weight: 600; color: var(--text-soft);
  cursor: pointer; font-family: inherit; transition: all .15s; display: inline-flex; align-items: center; gap: 5px;
}
.action-bar .toggle-btn:hover { border-color: var(--accent); color: var(--accent); }
.action-bar .toggle-btn.active { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }

/* ===== VIDEO HOMEWORK TAB ===== */
.video-section { margin-bottom: 32px; }
.video-section-title {
  font-size: 1.05rem; font-weight: 700; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.video-type-tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600;
}
.video-type-tag.new { background: #e8f0fe; color: #5B8DEF; }
.video-type-tag.review { background: #fef2e0; color: #E08B2A; }

.video-card {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
}
.video-card-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; border-bottom: 1px solid var(--border);
}
.video-card-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
.video-card-date { font-size: 13px; color: var(--text-soft); }

.video-student-list { padding: 8px 12px; }
.video-student-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; border-radius: var(--radius-sm); cursor: pointer;
  transition: background 0.15s; margin: 2px 0;
}
.video-student-row:hover { background: #f8f9fa; }
.video-student-row.done { background: var(--green-light); }
.video-student-name { font-size: 14px; font-weight: 600; color: var(--text); }
.video-student-name .en { font-size: 11px; color: var(--text-soft); font-weight: 400; margin-left: 4px; }
.video-retold-wrap { flex: 1; margin: 0 10px; min-width: 0; }
.video-retold-input {
  width: 100%; padding: 5px 10px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 12px; font-family: inherit; color: var(--text); background: #fafafa; outline: none;
}
.video-retold-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-light); background: #fff; }
.video-check-icon {
  width: 34px; height: 34px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; font-size: 18px;
}
.video-student-row.done .video-check-icon { background: #c8e6c9; }
.video-student-row:not(.done) .video-check-icon { background: #f1f3f4; opacity: 0.5; }

.video-add-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; padding: 16px;
  border: 2px dashed var(--border); border-radius: var(--radius); cursor: pointer;
  color: var(--text-soft); font-size: 14px; margin-top: 8px; transition: all 0.2s;
}
.video-add-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

.video-class-content-area { padding: 10px 18px 6px; border-bottom: 1px dashed var(--border); }
.video-class-content-label { font-size: 12px; font-weight: 600; color: var(--text-soft); margin-bottom: 6px; }
.video-class-content-input {
  width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px;
  font-size: 13px; font-family: inherit; color: var(--text); background: #fafafa;
  resize: vertical; min-height: 44px; outline: none;
}
.video-class-content-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); background: #fff; }

/* ===== DOUBLE-DONE SECTION (Video Tab) ===== */
.video-double-done {
  margin-top: 16px;
  background: linear-gradient(135deg, #FFF8E1, #FFF3CD);
  border: 2px solid #FFD54F;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px;
}
.video-double-done-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.video-dd-title {
  font-size: 16px; font-weight: 700;
  color: #E8A400;
  display: flex; align-items: center; gap: 6px;
}
.video-dd-count {
  font-size: 12px; color: #B8860B; background: #FFECB3;
  padding: 2px 10px; border-radius: 12px; font-weight: 600;
}
.video-dd-cards {
  display: flex; gap: 12px; overflow-x: auto;
  padding: 4px 0 8px;
  scrollbar-width: thin;
  scrollbar-color: #FFD54F transparent;
  -webkit-overflow-scrolling: touch;
}
.video-dd-cards::-webkit-scrollbar { height: 4px; }
.video-dd-cards::-webkit-scrollbar-thumb { background: #FFD54F; border-radius: 2px; }
.video-dd-card {
  flex: 0 0 auto;
  min-width: 100px; padding: 14px 12px 10px;
  background: linear-gradient(180deg, #FFFFFF 0%, #FFFDE7 100%);
  border: 1.5px solid #FFE082;
  border-radius: var(--radius-sm);
  text-align: center;
  cursor: default;
  transition: transform 0.15s, box-shadow 0.15s;
}
.video-dd-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(255,193,7,0.25);
}
.video-dd-card .coin {
  font-size: 32px; line-height: 1;
  display: block; margin-bottom: 4px;
}
.video-dd-card .name-cn {
  font-size: 14px; font-weight: 600; color: var(--text);
}
.video-dd-card .name-en {
  font-size: 10px; color: var(--text-soft); font-weight: 400;
  margin-top: 1px;
}
.video-dd-card .badge {
  display: inline-block; margin-top: 6px;
  padding: 2px 8px; background: #FFD54F;
  border-radius: 10px; font-size: 10px; font-weight: 700;
  color: #5D4037;
}
.video-dd-download {
  text-align: center; margin-top: 12px; padding-top: 10px;
  border-top: 1px dashed #FFE082;
}
.video-dd-download-btn {
  padding: 8px 20px; border: none; border-radius: 20px;
  background: linear-gradient(135deg, #FFD54F, #FFB300);
  color: #5D4037; font-size: 13px; font-weight: 700;
  cursor: pointer; transition: all 0.2s;
  display: inline-flex; align-items: center; gap: 4px;
}
.video-dd-download-btn:hover {

const STORAGE_PREFIX = 'nd-';

// ---- Listening data: keyed by week Monday ----
function getListenKey(monday) {
  const y = monday.getFullYear();
  const m = String(monday.getMonth() + 1).padStart(2, '0');
  const d = String(monday.getDate()).padStart(2, '0');
  return STORAGE_PREFIX + 'L-' + y + '-' + m + '-' + d;
}

const DEFAULT_MONDAY_KEY = getListenKey(new Date(2026, 4, 25)); // 2026-05-25

function loadListening(monday) {
  const key = getListenKey(monday);
  try {
    const raw = localStorage.getItem(key);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  if (key === DEFAULT_MONDAY_KEY) return deepClone(DEFAULT_LISTENING);
  return null;
}

function saveListening(monday, data) {
  try {
    localStorage.setItem(getListenKey(monday), JSON.stringify(data));
  } catch (e) { console.error('Save failed:', e); }
}

function getOrCreateListening(monday) {
  let data = loadListening(monday);
  if (!data) {
    data = {};
    for (const cn of Object.keys(CLASSES)) {
      data[cn] = {};
      for (const s of getListeningStudents(cn)) {
        data[cn][s.name] = { mon: 0, tue: 0, wed: 0, thu: 0, fri: 0, sat: 0, sun: 0 };
      }
    }
    saveListening(monday, data);
  }
  // Ensure all current students exist
  for (const cn of Object.keys(CLASSES)) {
    if (!data[cn]) data[cn] = {};
    for (const s of getListeningStudents(cn)) {
      if (!data[cn][s.name]) data[cn][s.name] = { mon: 0, tue: 0, wed: 0, thu: 0, fri: 0, sat: 0, sun: 0 };
    }
  }
  return data;
}

// ---- Video homework data: keyed by ISO week ----
function getVideoKey(classId, weekKey, type) {
  return STORAGE_PREFIX + 'V-' + classId + '-' + weekKey + '-' + type;
}

function loadVideoData() {
  const result = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key.startsWith(STORAGE_PREFIX + 'V-')) {
      try { result[key] = JSON.parse(localStorage.getItem(key)); } catch (e) {}
    }
  }
  return result;
}

function getVideoRecord(className, weekKey, type) {
  const key = getVideoKey(className, weekKey, type);
  try {
    const raw = localStorage.getItem(key);
    if (raw) {
      const rec = JSON.parse(raw);
      let migrated = false;
      // Migrate: ensure retold & classContent exist
      if (!rec.retold) { rec.retold = {}; migrated = true; }
      if (!rec.classContent) { rec.classContent = ''; migrated = true; }
      // Ensure all current students exist in submissions
      const students = getAllStudents(className);
      students.forEach(s => {
        if (!(s.name in rec.submissions)) { rec.submissions[s.name] = false; migrated = true; }
        if (!(s.name in rec.retold)) { rec.retold[s.name] = ''; migrated = true; }
        // Migrate old boolean submissions to date strings
        const sub = rec.submissions[s.name];
        if (sub === true) { rec.submissions[s.name] = rec.date; migrated = true; }
      });
      // Persist migration so old data doesn't need re-migration on every load
      if (migrated) {
        try { localStorage.setItem(key, JSON.stringify(rec)); } catch (e) {}
      }
      return rec;
    }
  } catch (e) {}
  return null;
}

// Scans localStorage for all video records across all classes and weeks
function getAllVideoRecords() {
  const records = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key || !key.startsWith(STORAGE_PREFIX + 'V-')) continue;
    try {
      const raw = localStorage.getItem(key);
      if (raw) {
        const rec = JSON.parse(raw);
        // Migrate boolean submissions to date strings & persist
        let migrated = false;
        if (rec.submissions) {
          for (const name in rec.submissions) {
            if (rec.submissions[name] === true) { rec.submissions[name] = rec.date; migrated = true; }
          }
        }
        if (migrated) {
          try { localStorage.setItem(key, JSON.stringify(rec)); } catch (e) {}
        }
        records.push(rec);
      }
    } catch (e) {}
  }
  return records;
}

function ensureVideoRecord(className, weekKey, type, dateStr) {

    const submissions = {}, retold = {};

    rec = { date: dateStr, type, className, weekKey, submissions, retold, classContent: '' };
    const key = getVideoKey(className, weekKey, type);
    localStorage.setItem(key, JSON.stringify(rec));
  }
  return rec;
}

function getMonday(d) {
  const d2 = new Date(d);
  const day = d2.getDay();
  const diff = d2.getDate() - day + (day === 0 ? -6 : 1);
  d2.setDate(diff); d2.setHours(0, 0, 0, 0);
  return d2;
}
function getSunday(d) {
  const mon = getMonday(d);
  mon.setDate(mon.getDate() + 6);
  return mon;
}
function getCurrentMonday() { return getMonday(new Date()); }
function getWeekMonday(offset) {
  const m = getCurrentMonday();
  m.setDate(m.getDate() + offset * 7);
  return m;
}
function dateStr(d) {
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + m + '-' + day;
}

// ISO week
function getISOWeekKey(date) {
  const d = new Date(date); d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
  const week1 = new Date(d.getFullYear(), 0, 4);
  const weekNum = 1 + Math.round(((d.getTime() - week1.getTime()) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
  return d.getFullYear() + '-W' + String(weekNum).padStart(2, '0');
}
function getMondayOfISOWeek(weekKey) {
  const [y, w] = weekKey.split('-W').map(Number);
  const jan4 = new Date(y, 0, 4);
  const jan4Day = jan4.getDay() || 7;
  const firstMonday = new Date(jan4);
  firstMonday.setDate(jan4.getDate() - (jan4Day - 1));
  const monday = new Date(firstMonday);
  monday.setDate(firstMonday.getDate() + (w - 1) * 7);
  return monday;
}

// Report week: Sun ~ Sat (most recently completed Saturday → go back to its Sunday)
function getReportWeekMonday(date) {
  const d = new Date(date);
  const day = d.getDay(); // 0=Sun, 1=Mon, ..., 6=Sat
  // Find the most recently completed Saturday
  const daysSinceSaturday = day === 6 ? 0 : day + 1;
  const lastSat = new Date(d);
  lastSat.setDate(d.getDate() - daysSinceSaturday);
  // Go back to the Sunday before that Saturday
  lastSat.setDate(lastSat.getDate() - 6);
  lastSat.setHours(0, 0, 0, 0);
  return lastSat; // returns Sunday
}
function getReportWeekEnd(sunday) {
  const end = new Date(sunday);
  end.setDate(sunday.getDate() + 6); // Saturday
  end.setHours(23, 59, 59, 999);
  return end;
}
function formatReportWeek(sunday) {
  const sat = new Date(sunday);
  sat.setDate(sunday.getDate() + 6);
  const sm = sunday.getMonth() + 1, sd = sunday.getDate();
  const em = sat.getMonth() + 1, ed = sat.getDate();
  if (sm === em) return sm + '月' + sd + '日 - ' + ed + '日';
  return sm + '月' + sd + '日 - ' + em + '月' + ed + '日';
}

// Schedule date helpers
function getScheduleDate(weekKey, dayOfWeek) {
  const [y, w] = weekKey.split('-W').map(Number);
  const mon = getMondayOfISOWeek(weekKey);
  const offset = dayOfWeek === 0 ? 6 : dayOfWeek - 1; // JS: 0=Sun, convert to offset from Mon
  const target = new Date(mon);
  target.setDate(mon.getDate() + offset);
  return target;
}

function getNextWeekKey(weekKey) {
  const [y, w] = weekKey.split('-W').map(Number);
  const mon = getMondayOfISOWeek(weekKey);
  mon.setDate(mon.getDate() + 7);
  return getISOWeekKey(mon);
}

function dateToDayKey(d) {
  const keys = ['sun','mon','tue','wed','thu','fri','sat'];
  return keys[d.getDay()];
}

// Get new lesson and review dates for a class within a report week (Sun ~ Sat)
function getLessonDatesInReportWeek(className, reportSunday) {
  const sched = CLASSES[className];
  if (!sched) return null;
  const nl = new Date(reportSunday);
  nl.setDate(reportSunday.getDate() + sched.newLessonDay);
  nl.setHours(0, 0, 0, 0);
  const rv = new Date(reportSunday);
  rv.setDate(reportSunday.getDate() + sched.reviewDay);
  rv.setHours(0, 0, 0, 0);
  return { newLesson: nl, review: rv };
}

// Ranking window: newLessonDay ~ day before reviewDay
function getRankingWindow(className, refDate) {
  const cls = CLASSES[className];
  if (!cls) return null;
  // Find the new lesson date that starts the course week containing refDate
  const dayOfWeek = refDate.getDay();
  const daysSinceNewLesson = (dayOfWeek - cls.newLessonDay + 7) % 7;
  const nlDate = new Date(refDate);
  nlDate.setDate(refDate.getDate() - daysSinceNewLesson);
  nlDate.setHours(0, 0, 0, 0);
  // Review day offset from new lesson day
  const reviewOffset = (cls.reviewDay - cls.newLessonDay + 7) % 7;
  let revDate = new Date(nlDate);
  revDate.setDate(nlDate.getDate() + reviewOffset);
  revDate.setHours(0, 0, 0, 0);
  if (revDate.getTime() <= nlDate.getTime()) revDate.setDate(revDate.getDate() + 7);
  const end = new Date(revDate);
  end.setDate(end.getDate() - 1);
  return { start: nlDate, end };
}

function getFullAttendanceWindow(className, refDate) {
  const cls = CLASSES[className];
  if (!cls) return null;
  // Find the new lesson date that starts the course week containing refDate
  const dayOfWeek = refDate.getDay();
  const daysSinceNewLesson = (dayOfWeek - cls.newLessonDay + 7) % 7;
  const nlDate = new Date(refDate);
  nlDate.setDate(refDate.getDate() - daysSinceNewLesson);
  nlDate.setHours(0, 0, 0, 0);
  const end = new Date(nlDate);
  end.setDate(end.getDate() + 6);
  return { start: nlDate, end };
}

function sumMinutesInWindow(className, name, start, end, listenData) {
  let sum = 0;
  const d = new Date(start);
  while (d.getTime() <= end.getTime()) {
    sum += loadMinutesForDate(className, name, d, listenData);
    d.setDate(d.getDate() + 1);
  }
  return sum;
}

function isFullAttendance(className, name, start, end, listenData) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const d = new Date(start);
  while (d.getTime() <= end.getTime()) {
    if (d.getTime() <= today.getTime()) {
      if (loadMinutesForDate(className, name, d, listenData) < TARGET) return false;
    }
    d.setDate(d.getDate() + 1);
  }
  return true;
}

function countFullAttendanceDays(className, name, start, end, listenData) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  let cnt = 0;
  const d = new Date(start);
  while (d.getTime() <= end.getTime()) {
    if (d.getTime() <= today.getTime()) {
      if (loadMinutesForDate(className, name, d, listenData) >= TARGET) cnt++;
    }
    d.setDate(d.getDate() + 1);
  }
  return cnt;
}

function getDayCountInWindow(start, end) {
  return Math.round((end.getTime() - start.getTime()) / 86400000) + 1;
}

function formatRankingWeekLabel(offset) {
  if (offset === 0) return '本周';
  if (offset === -1) return '上周';
  if (offset === 1) return '下周';
  if (offset < 0) return Math.abs(offset) + '周前';
  return offset + '周后';
}

// Load minutes for a specific date (cross-week lookup)
function loadMinutesForDate(className, name, date, listenData) {
  const srcName = resolveListenName(className, name);
  const mon = getMonday(date);
  const key = getListenKey(mon);

  // First check passed-in listenData if available
  if (listenData) {
    if (listenData[className] && listenData[className][srcName] !== undefined) {
      const dk = dateToDayKey(date);
      return listenData[className][srcName][dk] || 0;
    }
  }

  // Fall back to localStorage
  try {
    const raw = localStorage.getItem(key);
    if (raw) {
      const weekData = JSON.parse(raw);
      if (weekData[className] && weekData[className][srcName] !== undefined) {
        const dk = dateToDayKey(date);
        return weekData[className][srcName][dk] || 0;
      }
    }
  } catch (e) {}

  // Fall back to DEFAULT_LISTENING
  if (key === DEFAULT_MONDAY_KEY && DEFAULT_LISTENING[className] && DEFAULT_LISTENING[className][srcName]) {
    const dk = dateToDayKey(date);
    return DEFAULT_LISTENING[className][srcName][dk] || 0;
  }
  return 0;
}

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderListening() {
  const monday = getWeekMonday(weekOffset);
  const listenData = getOrCreateListening(monday);

  // Sync: propagate data for synced students
  for (const cn of Object.keys(CLASSES)) {
    const students = CLASSES[cn].students;
    for (const s of students) {
      if (s.syncWith && listenData[cn] && listenData[cn][s.syncWith]) {
        listenData[cn][s.name] = deepClone(listenData[cn][s.syncWith]);
      }
    }
  }

  // Previous week data for compare mode
  let prevListenData = null;
  let prevMonday = null;
  if (compareMode) {
    prevMonday = getWeekMonday(weekOffset - 1);
    prevListenData = getOrCreateListening(prevMonday);
    for (const cn of Object.keys(CLASSES)) {
      const students = CLASSES[cn].students;
      for (const s of students) {
        if (s.syncWith && prevListenData[cn] && prevListenData[cn][s.syncWith]) {
          prevListenData[cn][s.name] = deepClone(prevListenData[cn][s.syncWith]);
        }
      }
    }
  }

  const filter = document.getElementById('classFilter') ? document.getElementById('classFilter').value : 'all';
  const classes = filter === 'all' ? Object.keys(CLASSES) : [filter];

  let html = '<div class="action-bar">'
    + '<span class="hint">点击日期格修改分钟数，回车确认 · Esc 取消</span>'
    + '<button class="toggle-btn ' + (compareMode ? 'active' : '') + '" onclick="toggleCompareMode()">'
    + (compareMode ? '📊 退出对比' : '📊 两周对比') + '</button></div>';

  classes.forEach(cn => {
    const students = getListeningStudents(cn);
    if (students.length === 0) return;
    if (!listenData[cn]) listenData[cn] = {};

    const stats = students.map(s => {
      const data = listenData[cn][s.name] || { mon: 0, tue: 0, wed: 0, thu: 0, fri: 0, sat: 0, sun: 0 };
      let met = 0, unmet = 0, missed = 0, total = 0;
      DAY_KEYS.forEach(k => {
        const v = data[k] || 0;
        total += v;
        if (v >= TARGET) met++; else if (v > 0) unmet++; else missed++;
      });
      return { name: s.name, data, met, unmet, missed, total };
    });

    let prevStatsMap = {};
    if (compareMode && prevListenData) {
      if (!prevListenData[cn]) prevListenData[cn] = {};
      students.forEach(s => {
        const data = prevListenData[cn][s.name] || { mon: 0, tue: 0, wed: 0, thu: 0, fri: 0, sat: 0, sun: 0 };
        let met = 0, unmet = 0, missed = 0, total = 0;
        DAY_KEYS.forEach(k => {
          const v = data[k] || 0;
          total += v;
          if (v >= TARGET) met++; else if (v > 0) unmet++; else missed++;
        });
        prevStatsMap[s.name] = { name: s.name, data, met, unmet, missed, total };
      });
    }

    const fullyMet = stats.filter(s => s.unmet === 0 && s.missed === 0).length;
    const passAll = fullyMet === stats.length && stats.length > 0;
    const pillCls = passAll ? 'pill-allgood' : 'pill-warn';
    const pillTxt = passAll ? '全达标' : (stats.length - fullyMet) + ' 人未全达标';
    const weekStr = formatWeekRange(monday);

    const sorted = [...stats].sort((a, b) => {
      if (a.unmet + a.missed > 0 && b.unmet + b.missed === 0) return -1;
      if (a.unmet + a.missed === 0 && b.unmet + b.missed > 0) return 1;
      return a.name.localeCompare(b.name, 'zh');
    });

    const cards = sorted.map(s => renderListeningCard(cn, s, monday, prevStatsMap[s.name] || null)).join('');

    html += '<section class="class-section"><div class="class-header">'
      + '<h2>' + cn + '<span class="count">' + stats.length + ' 人 · ' + weekStr + '</span></h2>'
      + '<span class="pill ' + pillCls + '">' + pillTxt + '</span>'
      + '</div><div class="student-grid">' + cards + '</div></section>';
  });

  // Contact list at the bottom
  html += buildListeningContactList(classes, listenData, monday);

  document.getElementById('listeningContent').innerHTML = html;
}

function renderListeningCard(className, s, monday, prevS) {
  const problems = s.unmet + s.missed;

  const barCls = s.total >= DAY_KEYS.length * TARGET ? 'green' : 'red';
  const barPct = Math.min((s.total / (DAY_KEYS.length * TARGET)) * 100, 100);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const cfg = getStudentCfg(className, s.name);
  const syncTag = cfg && cfg.syncWith ? '<span class="sync-tag">🔗' + cfg.syncWith + '</span>' : '';
  const weekStr = formatWeekRange(monday);

  function buildDaysHtml(statsData, refMonday, editable) {
    return DAY_KEYS.map((k, i) => {
      const v = statsData[k] || 0;
      const dayDate = new Date(refMonday);
      dayDate.setDate(refMonday.getDate() + i);
      dayDate.setHours(0, 0, 0, 0);
      const isToday = dayDate.getTime() === today.getTime();
      const isFuture = dayDate.getTime() > today.getTime();
      let label = DAY_LABELS[i];
      if (isToday) label = '今天';
      if (isFuture) label = '未开始';

      let cls, tag;
      if (isFuture) { cls = 'future'; tag = '--'; }
      else if (v >= TARGET) { cls = 'met'; tag = '✓'; }
      else { cls = 'unmet'; tag = v > 0 ? '差' + (TARGET - v) : '未打'; }

      if (!editable) {
        return '<div class="day-cell">'
          + '<div class="day-box ' + cls + '"><span class="day-label">' + label + '</span>'
          + '<span class="day-val">' + (isFuture ? '' : (v > 0 ? v : '--')) + '</span>'
          + '<span class="day-tag">' + tag + '</span></div></div>';
      }
      return '<div class="day-cell" data-class="' + className + '" data-name="' + escHtml(s.name) + '" data-day="' + k + '" onclick="startEditListening(this,event)">'
        + '<div class="day-box ' + cls + '"><span class="day-label">' + label + '</span>'
        + '<span class="day-val">' + (isFuture ? '' : (v > 0 ? v : '--')) + '</span>'
        + '<span class="day-tag">' + tag + '</span></div>'
        + '<input class="day-edit-input" type="number" min="0" max="480" value="' + v + '" data-prev="' + v + '" inputmode="numeric"'
        + ' onblur="endEditListening(this,event)" onkeydown="handleEditKey(this,event)"></div>';
    }).join('');
  }

  const daysHtml = buildDaysHtml(s.data, monday, true);

  let compareHtml = '';
  if (compareMode && prevS) {
    const prevBarCls = prevS.total >= DAY_KEYS.length * TARGET ? 'green' : 'red';
    const prevBarPct = Math.min((prevS.total / (DAY_KEYS.length * TARGET)) * 100, 100);
    const prevWeekStr = formatWeekRange(getWeekMonday(weekOffset - 1));
    const diff = s.total - prevS.total;
    const diffDays = (s.met + s.unmet + s.missed) - (prevS.met + prevS.unmet + prevS.missed);
    const diffCls = diff > 0 ? 'change-up' : (diff < 0 ? 'change-down' : 'change-eq');
    const diffIcon = diff > 0 ? '▲' : (diff < 0 ? '▼' : '—');
    const prevDaysHtml = buildDaysHtml(prevS.data, getWeekMonday(weekOffset - 1), false);

    compareHtml = '<div class="sc-days">'
      + '<div class="sc-week-row"><span class="sc-week-label">上周</span>' + prevDaysHtml + '</div>'
      + '<div class="sc-week-row"><span class="sc-week-label">本周</span>' + daysHtml + '</div>'
      + '</div>'
      + '<div class="sc-compare-summary">'
      + '<span>总分钟 <strong>' + prevS.total + '</strong> → <strong>' + s.total + '</strong></span>'
      + '<span class="' + diffCls + '">' + diffIcon + ' ' + Math.abs(diff) + ' min</span>'
      + '<span>打卡天数 <strong>' + (prevS.met + prevS.unmet + prevS.missed) + '</strong> → <strong>' + (s.met + s.unmet + s.missed) + '</strong></span>'
      + '</div>'
      + '<div class="sc-compare-bar">'
      + '<div class="bar-track"><div class="bar-fill prev" style="width:' + prevBarPct + '%"></div></div>'
      + '<span class="bar-text">' + prevS.total + ' / ' + (DAY_KEYS.length * TARGET) + ' min</span></div>'
      + '<div class="sc-compare-bar">'
      + '<div class="bar-track"><div class="bar-fill ' + barCls + '" style="width:' + barPct + '%"></div></div>'
      + '<span class="bar-text">' + s.total + ' / ' + (DAY_KEYS.length * TARGET) + ' min</span></div>';
  }

  const bodyHtml = compareMode && prevS ? compareHtml
    : '<div class="sc-days">' + daysHtml + '</div>'
      + '<div class="sc-bar"><div class="bar-track"><div class="bar-fill ' + barCls + '" style="width:' + barPct + '%"></div></div>'
      + '<span class="bar-text">' + s.total + ' / ' + (DAY_KEYS.length * TARGET) + ' min</span></div>';

  return '<div class="student-card ' + cardCls + '" id="card-' + escHtml(className) + '-' + escHtml(s.name) + '">'
    + '<div class="sc-top"><div class="sc-info">'
    + '<span class="sc-name">' + escHtml(s.name) + syncTag + '</span>'
    + '</div><div class="sc-actions">'
    + '<button class="sc-download-btn" title="下载卡片" onclick="downloadCard(this,\'' + escHtml(s.name) + '\',\'' + weekStr + '\')">⬇️</button>'
    + '<button class="sc-heatmap-btn" title="月度热力图" onclick="showHeatmap(\'' + className + '\',\'' + escHtml(s.name) + '\',this)">🔥</button>'
    + '</div></div>' + bodyHtml + '</div>';
}

  compareMode = !compareMode;
  renderListening();
}

function getContacts() {
  try { return JSON.parse(localStorage.getItem('nd-contacts') || '{}'); } catch(e) { return {}; }
}
function saveContacts(obj) { localStorage.setItem('nd-contacts', JSON.stringify(obj)); }

function toggleContacted(key, id) {
  const c = getContacts();
  if (!c[key]) c[key] = {};
  c[key][id] = !c[key][id];
  saveContacts(c);
  // Re-render without full reload: toggle the row class
  const row = document.getElementById('contact-' + id.replace(/[^a-zA-Z0-9\u4e00-\u9fff-]/g, '-'));
  if (row) row.classList.toggle('contacted', c[key][id]);
}

function buildListeningContactList(classes, listenData, monday) {
  const today = new Date(); today.setHours(0,0,0,0);
  const contactKey = 'listen-' + dateStr(monday);
  const contacts = getContacts();
  const allItems = [];

  classes.forEach(cn => {
    const students = getListeningStudents(cn);
    if (students.length === 0) return;
    if (!listenData[cn]) listenData[cn] = {};

    // Count elapsed days this week
    let elapsedDays = 0;
    DAY_KEYS.forEach((k, i) => {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      if (d.getTime() <= today.getTime()) elapsedDays++;
    });

    // Need at least 3 elapsed days for meaningful assessment
    if (elapsedDays < 3) return;

    const elapsedTarget = elapsedDays * TARGET;

    students.forEach(s => {
      const cfg = getStudentCfg(cn, s.name);
      if (cfg && cfg.exemptListening) return; // skip exempt students
      if (cfg && cfg.syncWith) return; // skip synced students (handled via sync source)

      const data = listenData[cn][s.name] || { mon:0,tue:0,wed:0,thu:0,fri:0,sat:0,sun:0 };
      let total = 0, missed = 0;
      DAY_KEYS.forEach((k, i) => {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        if (d.getTime() > today.getTime()) return; // future day, skip
        const v = data[k] || 0;
        total += v;
        if (v === 0) missed++;
      });

      // Thresholds: missed >= 3 days OR total < 50% of elapsed target
      const pct = elapsedTarget > 0 ? total / elapsedTarget : 1;
      if (missed >= 3 || (elapsedDays >= 4 && pct < 0.5)) {
        const id = cn + '-' + s.name;
        allItems.push({
          id, cn, name: s.name, total, elapsedTarget, elapsedDays, missed,
          pct: Math.round(pct * 100),
          contacted: !!(contacts[contactKey] && contacts[contactKey][id])
        });
      }
    });
  });

  // Sort: contacted at bottom, then by worst percentage first
  allItems.sort((a, b) => {
    if (a.contacted !== b.contacted) return a.contacted ? 1 : -1;
    return a.pct - b.pct;
  });

  if (allItems.length === 0) {
    return '<div class="contact-section"><div class="contact-header">'
      + '<h3>📞 待联系家长</h3></div>'
      + '<div class="contact-none">🎉 目前没有需要关注的学生</div></div>';
  }

  const pending = allItems.filter(x => !x.contacted).length;
  let html = '<div class="contact-section"><div class="contact-header">'
    + '<h3>📞 待联系家长 <span class="contact-count">' + pending + ' 人待联系</span></h3>'
    + '</div>';

  allItems.forEach(item => {
    const badgeCls = item.missed >= 3 ? 'danger' : 'warn';
    const badgeTxt = item.missed >= 3 ? '缺勤 ' + item.missed + ' 天' : '达标率 ' + item.pct + '%';
    const rowCls = item.contacted ? 'contact-row contacted' : 'contact-row';
    html += '<div class="' + rowCls + '" id="contact-' + item.id.replace(/[^a-zA-Z0-9\u4e00-\u9fff-]/g, '-') + '"'
      + ' onclick="toggleContacted(\'' + contactKey + '\',\'' + item.id + '\')">'
      + '<div class="contact-cb">' + (item.contacted ? '✓' : '') + '</div>'
      + '<div class="contact-info"><div class="contact-name">' + escHtml(item.name)
      + ' <span class="contact-class">' + item.cn + '</span></div>'
      + '<div class="contact-detail">本周打卡 ' + item.total + ' min / 目标 ' + item.elapsedTarget + ' min'
      + ' · 已过 ' + item.elapsedDays + ' 天，' + item.missed + ' 天未打卡</div></div>'
      + '<span class="contact-badge ' + badgeCls + '">' + badgeTxt + '</span></div>';
  });

  html += '</div>';
  return html;
}

function buildVideoContactList(currentClass, weekKey, records) {
  const cls = CLASSES[currentClass];
  if (!cls) return '';

  const contactKey = 'video-' + weekKey + '-' + currentClass;
  const contacts = getContacts();
  const students = getAllStudents(currentClass);
  if (students.length === 0) return '';

  // Count total sessions in this week
  const totalSessions = records.length;
  if (totalSessions === 0) return ''; // no sessions created yet

  const allItems = [];

  students.forEach(s => {
    let submitted = 0;
    records.forEach(rec => {
      if (rec && rec.submissions[s.name]) submitted++;
    });
    const rate = totalSessions > 0 ? submitted / totalSessions : 1;
    const pct = Math.round(rate * 100);

    // Threshold: 0 submissions OR < 50% submission rate
    if (submitted === 0 || (totalSessions >= 2 && pct < 50)) {
      const id = s.name;
      allItems.push({
        id, cn: currentClass, name: s.name, submitted, totalSessions, pct,
        contacted: !!(contacts[contactKey] && contacts[contactKey][id])
      });
    }
  });

  if (allItems.length === 0) {
    return '<div class="contact-section"><div class="contact-header">'
      + '<h3>📞 待联系家长</h3></div>'
      + '<div class="contact-none">🎉 所有人都已提交视频</div></div>';
  }

  // Sort: contacted at bottom, then by worst first
  allItems.sort((a, b) => {
    if (a.contacted !== b.contacted) return a.contacted ? 1 : -1;
    return a.pct - b.pct;
  });

  const pending = allItems.filter(x => !x.contacted).length;
  let html = '<div class="contact-section"><div class="contact-header">'
    + '<h3>📞 待联系家长 <span class="contact-count">' + pending + ' 人待联系</span></h3>'
    + '</div>';

  allItems.forEach(item => {
    const badgeCls = item.submitted === 0 ? 'danger' : 'warn';
    const badgeTxt = item.submitted === 0 ? '未提交' : '仅交 ' + item.submitted + '/' + item.totalSessions;
    const rowCls = item.contacted ? 'contact-row contacted' : 'contact-row';
    html += '<div class="' + rowCls + '" id="contact-' + item.id.replace(/[^a-zA-Z0-9\u4e00-\u9fff-]/g, '-') + '"'
      + ' onclick="toggleContacted(\'' + contactKey + '\',\'' + item.id + '\')">'
      + '<div class="contact-cb">' + (item.contacted ? '✓' : '') + '</div>'
      + '<div class="contact-info"><div class="contact-name">' + escHtml(item.name)
      + ' <span class="contact-class">' + item.cn + '</span></div>'
      + '<div class="contact-detail">本周视频：已交 ' + item.submitted + ' / 共 ' + item.totalSessions + ' 次'
      + ' · 完成率 ' + item.pct + '%</div></div>'
      + '<span class="contact-badge ' + badgeCls + '">' + badgeTxt + '</span></div>';
  });

  html += '</div>';
  return html;
}

function downloadCard(btn, studentName, weekStr) {
  if (typeof html2canvas === 'undefined') { toast('卡片库加载中，请稍后再试'); return; }
  const card = btn.closest('.student-card');
  if (!card) { toast('找不到卡片元素'); return; }

  // Create a temporary wrapper with the card + right-side date label
  const wrapper = document.createElement('div');
  wrapper.style.cssText = 'display:flex;gap:16px;align-items:stretch;padding:16px;background:#f4f2ee;position:fixed;left:-9999px;top:0;z-index:-1;';
  wrapper.innerHTML = card.outerHTML;

  // Add date label on the right side
  const label = document.createElement('div');
  label.style.cssText = 'display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;'
    + 'padding:12px 10px;background:white;border-radius:12px;font-size:14px;font-weight:700;'
    + 'color:#7c3aed;font-family:sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.06);min-width:40px;';
  label.textContent = weekStr;
  wrapper.appendChild(label);

  document.body.appendChild(wrapper);

  html2canvas(wrapper, { backgroundColor: '#f4f2ee', scale: 2 }).then(canvas => {
    document.body.removeChild(wrapper);
    const link = document.createElement('a');
    link.download = studentName + '-' + weekStr + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    toast('卡片已下载: ' + studentName);
  }).catch(err => {
    document.body.removeChild(wrapper);
    toast('下载失败: ' + err.message);
    console.error('downloadCard failed:', err);
  });
}

function startEditListening(cell, e) { e.stopPropagation();
  const dayIdx = DAY_KEYS.indexOf(cell.dataset.day);
  if (dayIdx >= 0) {
    const monday = getWeekMonday(weekOffset);
    const dayDate = new Date(monday);
    dayDate.setDate(monday.getDate() + dayIdx);
    dayDate.setHours(0, 0, 0, 0);
    if (dayDate.getTime() > new Date().setHours(0,0,0,0)) { toast('未来日期不可编辑'); return; }
  }
  cell.classList.add('editing');
  const input = cell.querySelector('.day-edit-input');
  input.focus(); input.select();
}
function endEditListening(input, e) {
  const cell = input.closest('.day-cell');
  if (cell) saveEditListening(cell, input);
}
function handleEditKey(input, e) {
  if (e.key === 'Enter') { e.preventDefault(); const cell = input.closest('.day-cell'); if (cell) saveEditListening(cell, input); }
  else if (e.key === 'Escape') { e.preventDefault(); input.value = input.dataset.prev; input.closest('.day-cell').classList.remove('editing'); }
}
function saveEditListening(cell, input) {
  const className = cell.dataset.class;
  const name = cell.dataset.name;
  const day = cell.dataset.day;
  let val = parseInt(input.value, 10);
  if (isNaN(val) || val < 0) val = 0;
  if (val > 480) val = 480;

  const monday = getWeekMonday(weekOffset);
  const listenData = getOrCreateListening(monday);
  if (!listenData[className]) listenData[className] = {};
  if (!listenData[className][name]) listenData[className][name] = { mon: 0, tue: 0, wed: 0, thu: 0, fri: 0, sat: 0, sun: 0 };
  listenData[className][name][day] = val;

  // Sync to linked student
  const cfg = getStudentCfg(className, name);
  if (cfg && cfg.syncWith) {
    // Actually, the source is the one being edited. We need to find who syncs from this name.
  }
  // Find all students who sync from this name
  for (const cn2 of Object.keys(CLASSES)) {
    for (const s2 of CLASSES[cn2].students) {
      if (s2.syncWith === name && cn2 === className) {
        if (!listenData[cn2]) listenData[cn2] = {};
        listenData[cn2][s2.name] = deepClone(listenData[className][name]);
      }
    }
  }

  saveListening(monday, listenData);
  cell.classList.remove('editing');
  renderListening();
  const dayIdx = DAY_KEYS.indexOf(day);
  toast(name + ' ' + DAY_LABELS[dayIdx] + '：' + (val > 0 ? val + '分钟' : '清零'));
}

function formatWeekRange(monday) {
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  const m = monday.getMonth() + 1, s = sunday.getMonth() + 1;
  const d1 = monday.getDate(), d2 = sunday.getDate();
  if (m === s) return m + '月' + d1 + '日 - ' + d2 + '日';
  return m + '月' + d1 + '日 - ' + s + '月' + d2 + '日';
}

function prevWeekL() { weekOffset--; renderHeader(); renderListening(); }
function nextWeekL() { weekOffset++; renderHeader(); renderListening(); }
function goTodayL() { weekOffset = 0; renderHeader(); renderListening(); }

function prevWeekR() { rankingWeekOffset--; renderHeader(); renderRanking(); }
function nextWeekR() { rankingWeekOffset++; renderHeader(); renderRanking(); }
function goTodayR() { rankingWeekOffset = 0; renderHeader(); renderRanking(); }

function renderVideo() {
  const cls = CLASSES[currentClass];
  if (!cls) return;
  const weekKey = currentVideoWeek;
  const todayWeek = getISOWeekKey(new Date());

  const newRecord = getVideoRecord(currentClass, weekKey, 'new');
  const reviewRecord = getVideoRecord(currentClass, weekKey, 'review');

  // Cross-week partner review (all classes)
  const partnerWeek = getNextWeekKey(weekKey);
  const partnerRecord = getVideoRecord(currentClass, partnerWeek, 'review');

  let html = '<div class="action-bar"><span class="hint">点击学生行切换提交状态 · 输入框记录复述内容</span>'
    + '<select onchange="currentClass=this.value;renderVideo()" style="margin-left:auto;padding:7px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:.85rem;font-family:inherit">';
  for (const cn of Object.keys(CLASSES)) {
    html += '<option value="' + cn + '"' + (cn === currentClass ? ' selected' : '') + '>' + cn + '</option>';
  }
  html += '</select></div>';

  // New lesson
  if (newRecord) {
    html += renderVideoSession(cls, weekKey, newRecord, 'new');
  } else {
    const nd = getScheduleDate(weekKey, cls.newLessonDay);
    html += renderVideoAddBtn('new', nd, weekKey);
  }
  // Review lesson
  if (reviewRecord) {
    html += renderVideoSession(cls, weekKey, reviewRecord, 'review');
  } else {
    const rd = getScheduleDate(weekKey, cls.reviewDay);
    html += renderVideoAddBtn('review', rd, weekKey);
  }
  // Partner review (cross-week, all classes)
  if (partnerRecord) {
    html += renderVideoSession(cls, partnerWeek, partnerRecord, 'review', true);
  } else {
    const prd = getScheduleDate(partnerWeek, cls.reviewDay);
    html += renderVideoAddBtn('review', prd, partnerWeek, true);
  }

  // Stats
  let total = 0, done = 0;
  [newRecord, reviewRecord, partnerRecord].forEach(rec => {
    if (!rec) return;
    Object.values(rec.submissions).forEach(v => { total++; if (v) done++; });
  });

  html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:16px 18px;margin-top:16px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow)">'
    + '<div style="font-size:14px;font-weight:500">📊 本周进度：<span style="color:var(--green);font-weight:700">' + done + '/' + total + '</span> 已交'
    + (total > 0 ? ' (' + Math.round(done / total * 100) + '%)' : '') + '</div>'
    + '<button class="btn btn-primary" style="font-size:13px;padding:8px 18px" onclick="downloadVideoCard()">📥 下载卡片</button></div>';

  // Double-done section: new (this week) + review (next cross-week)
  let doubleDone = [];
  const students = getAllStudents(currentClass);
  if (newRecord && partnerRecord) {
    students.forEach(s => {
      if (newRecord.submissions[s.name] && partnerRecord.submissions[s.name]) {
        doubleDone.push(s);
      }
    });
  }

  const hasDoubleDoneEligible = newRecord && partnerRecord;

  if (hasDoubleDoneEligible) {
    html += '<div class="video-double-done">'
      + '<div class="video-double-done-header">'
      + '<div class="video-dd-title">🏆 本周两次打卡</div>'
      + (doubleDone.length > 0 ? '<span class="video-dd-count">' + doubleDone.length + ' 位小明星</span>' : '')
      + '</div>';
    if (doubleDone.length > 0) {
      html += '<div class="video-dd-cards">';
      doubleDone.forEach(s => {
        html += '<div class="video-dd-card">'
          + '<span class="coin">🪙</span>'
          + '<div class="name-cn">' + escHtml(s.name) + '</div>'
          + (s.en ? '<div class="name-en">' + s.en + '</div>' : '')
          + '<span class="badge">两次打卡 ✓</span></div>';
      });
      html += '</div>'
        + '<div class="video-dd-download">'
        + '<button class="video-dd-download-btn" onclick="downloadDoubleDoneCard()">📥 下载本周打卡卡片</button></div>';
    } else {
      html += '<div class="video-dd-empty">💪 还没有小朋友完成两次打卡，继续加油！</div>';
    }
    html += '</div>';
  }

  // Contact list at the bottom
  html += buildVideoContactList(currentClass, weekKey, [newRecord, reviewRecord, partnerRecord]);

  document.getElementById('videoContent').innerHTML = html;
}

function renderVideoSession(cls, weekKey, record, type, opts) {

      + ' onclick="event.stopPropagation()"></div>'

  return '<div class="video-card" style="margin-bottom:16px">'

function toggleVideoSubmission(className, weekKey, type, studentName) {

function renderRanking() {
  const refDate = new Date();
  refDate.setDate(refDate.getDate() + rankingWeekOffset * 7);
  const weekLabel = formatRankingWeekLabel(rankingWeekOffset);
  const classes = Object.keys(CLASSES);
  let html = '<div class="action-bar"><span class="hint">课程周排名与奖励 · ' + weekLabel + '</span></div>';

  classes.forEach(cn => {
    const cls = CLASSES[cn];
    if (!cls) return;
    const rw = getRankingWindow(cn, refDate);
    const fw = getFullAttendanceWindow(cn, refDate);
    if (!rw || !fw) return;

    const dayCountRank = getDayCountInWindow(rw.start, rw.end);
    const students = getListeningStudents(cn);

    // Ranking
    const ranking = students.map(s => ({
      name: s.name,
      total: sumMinutesInWindow(cn, s.name, rw.start, rw.end)
    })).sort((a, b) => b.total - a.total);

    // Full attendance
    const fa = students.map(s => ({
      name: s.name,
      days: countFullAttendanceDays(cn, s.name, fw.start, fw.end),
      passed: isFullAttendance(cn, s.name, fw.start, fw.end)
    }));
    const faPass = fa.filter(f => f.passed);
    const faFail = fa.filter(f => !f.passed);
    const sortedFA = [...faPass, ...faFail];

    const nlLabel = ['周日','周一','周二','周三','周四','周五','周六'][cls.newLessonDay];
    const rvLabel = ['周日','周一','周二','周三','周四','周五','周六'][cls.reviewDay];
    const dayLabel = ['日','一','二','三','四','五','六'];
    const fmt = d => (d.getMonth() + 1) + '/' + d.getDate();
    const fmtDist = d => ((d.getMonth() + 1) + '月' + d.getDate() + '日（周' + dayLabel[d.getDay()] + '）');

    // Pirate distribution date = review day (day after ranking window ends)
    const pirateDist = new Date(rw.end);
    pirateDist.setDate(pirateDist.getDate() + 1);

    // Full attendance distribution date = day after full attendance window ends
    const faDist = new Date(fw.end);
    faDist.setDate(faDist.getDate() + 1);

    // Pirate coins section
    html += '<div class="ranking-section"><div class="ranking-section-header">'
      + '<h2>' + cn + ' · ' + nlLabel + '新课 <span class="badge badge-pirate">🏆 海盗币</span></h2></div>'
      + '<div class="ranking-meta">' + rvLabel + '复习课后 ~ ' + nlLabel + '新课前 · ' + dayCountRank + '天</div>'
      + '<div class="ranking-meta" style="color:var(--accent);font-weight:600">📅 发放日期：' + fmtDist(pirateDist) + '</div>';

    const medals = ['🥇', '🥈', '🥉'];
    html += '<div class="pirate-cards">';
    [0, 1, 2].forEach(idx => {
      const r = ranking[idx];
      if (!r) return;
      html += '<div class="pirate-card rank-' + (idx + 1) + '"><div class="medal">' + medals[idx] + '</div>'
        + '<div class="name">' + escHtml(r.name) + '</div><div class="minutes">' + r.total + ' 分钟</div>'
        + '<div class="coins">🏆 × ' + PIRATE_COINS[idx] + '</div><div class="coin-label">海盗币</div></div>';
    });
    html += '</div>';

    // Rest collapsed
    if (ranking.length > 3) {
      html += '<button class="pirate-rest-toggle" onclick="togglePirateRest(this)" data-class="' + cn + '">查看全部排名 <span class="arrow">▼</span></button>';
      html += '<div class="pirate-rest" id="pirate-rest-' + cn + '"><table class="pirate-rest-table"><thead><tr><th>排名</th><th>姓名</th><th>累计</th><th style="text-align:center">🏆</th></tr></thead><tbody>';
      ranking.forEach((r, i) => {
        if (i < 3) return;
        html += '<tr><td style="color:var(--text-muted);font-weight:600">' + (i + 1) + '</td>'
          + '<td><strong>' + escHtml(r.name) + '</strong></td><td>' + r.total + ' min</td>'
          + '<td style="text-align:center">—</td></tr>';
      });
      html += '</tbody></table></div>';
    }

    // Download buttons for this class
    html += '<div class="download-card-row">'
      + '<button class="download-card-btn" onclick="downloadPirateCard(\'' + cn + '\')">📷 下载海盗币卡片</button>'
      + '<button class="download-card-btn" onclick="downloadFullAttendanceCard(\'' + cn + '\')">📷 下载全勤卡片</button>'
      + '</div>';

    // Full attendance section
    html += '<h3 style="margin-top:20px;margin-bottom:8px;font-size:.95rem">🪙 小金币 · 全勤打卡 <span class="badge badge-coin">7天达标</span></h3>';
    html += '<div class="ranking-meta">' + fmt(fw.start) + ' ~ ' + fmt(fw.end) + ' · 连续7天</div>';
    html += '<div class="ranking-meta" style="color:var(--accent);font-weight:600">📅 发放日期：' + fmtDist(faDist) + '</div>';
    html += '<div class="fa-grid">';
    sortedFA.forEach(f => {
      const clsRow = f.passed ? '' : ' fail';
      html += '<div class="fa-row' + clsRow + '">'
        + '<div class="fa-name">' + escHtml(f.name) + '</div>'
        + '<div class="fa-visual"><div class="fa-dates">';
      // Date labels
      const d = new Date(fw.start);
      for (let i = 0; i < 7; i++) {
        html += '<div class="fa-date">' + (d.getMonth() + 1) + '/' + d.getDate() + '</div>';
        d.setDate(d.getDate() + 1);
      }
      html += '</div><div class="fa-blocks">';
      // Blocks
      const d2 = new Date(fw.start);
      const today = new Date(); today.setHours(0, 0, 0, 0);
      for (let i = 0; i < 7; i++) {
        let bc;
        if (d2.getTime() > today.getTime()) {
          bc = 'future';
        } else {
          const mins = loadMinutesForDate(cn, f.name, d2);
          bc = mins >= TARGET ? 'pass' : 'fail';
        }
        html += '<div class="fa-block ' + bc + '">' + (bc === 'future' ? '' : (bc === 'pass' ? '✓' : '✗')) + '</div>';
        d2.setDate(d2.getDate() + 1);
      }
      html += '</div></div>'
        + '<div class="fa-summary' + (f.passed ? ' pass' : ' fail') + '">' + f.days + '/7天</div></div>';
    });
    html += '</div></div>';
  });

  document.getElementById('rankingContent').innerHTML = html;
}

  const isOpen = rest.classList.contains('open');
  rest.classList.toggle('open');
  btn.classList.toggle('open');
  btn.querySelector('.arrow').textContent = isOpen ? '▼' : '▲';
}

function downloadPirateCard(className) {
  if (typeof html2canvas === 'undefined') { toast('卡片库加载中，请稍后再试'); return; }
  // Find the pirate cards section for this class
  const sections = document.querySelectorAll('.ranking-section');
  let target = null;
  sections.forEach(sec => {
    const h2 = sec.querySelector('h2');
    if (h2 && h2.textContent.includes(className)) target = sec;
  });
  if (!target) { toast('未找到 ' + className + ' 的卡片'); return; }

  // Clone the pirate cards into a clean canvas
  const canvas = document.createElement('div');
  canvas.className = 'card-canvas-hidden';
  canvas.style.width = '480px';
  canvas.style.padding = '24px';
  canvas.style.background = '#ffffff';
  canvas.style.borderRadius = '16px';
  canvas.style.fontFamily = 'system-ui, sans-serif';

  // Copy the pirate cards as they appear
  const pirateCards = target.querySelector('.pirate-cards');
  if (!pirateCards) { toast('未找到海盗币卡片'); return; }

  const clone = pirateCards.cloneNode(true);
  clone.style.display = 'grid';
  canvas.appendChild(clone);

  // Add title
  const title = document.createElement('div');
  title.style.cssText = 'font-size:18px;font-weight:700;margin-bottom:16px;color:#1e293b;text-align:center';
  title.textContent = className + ' · 🏆 海盗币排名';
  canvas.insertBefore(title, canvas.firstChild);

  document.body.appendChild(canvas);

  html2canvas(canvas, { backgroundColor: '#ffffff', scale: 2 }).then(imgCanvas => {
    document.body.removeChild(canvas);
    const link = document.createElement('a');
    link.download = '海盗币-' + className + '.png';
    link.href = imgCanvas.toDataURL('image/png');
    link.click();
    toast('海盗币卡片已下载');
  }).catch(() => {
    if (canvas.parentNode) canvas.parentNode.removeChild(canvas);
    toast('下载失败，请重试');
  });
}

function renderReport() {
  const sun = currentReportSunday;
  const sat = new Date(sun);
  sat.setDate(sun.getDate() + 6);
  const weekLabel = formatReportWeek(sun);

  let html = '<div class="action-bar"><span class="hint">周报区间：上周日 ~ 本周六</span>'
    + '<div class="week-nav"><button onclick="prevWeekRp()">◀</button>'
    + '<span class="week-label">' + weekLabel + '</span>'
    + '<button onclick="nextWeekRp()">▶</button>'
    + '<button onclick="goTodayRp()" style="font-size:.72rem;width:auto;padding:0 10px;font-weight:600">本周报</button></div>'
    + '<button class="btn btn-outline" onclick="downloadReportExcel()">📊 导出 Excel</button></div>';

  // Accumulate global totals
  let globalListenTotal = 0, globalListenMet = 0;
  let globalVideoTotal = 0, globalVideoDone = 0;
  let globalAttTotal = 0, globalAttPresent = 0;

  // For each class
  for (const cn of Object.keys(CLASSES)) {
    const students = getAllStudents(cn);

    // Calculate listening stats for report week
    const listenRows = students.map(s => {
      if (getStudentCfg(cn, s.name).exemptListening) {
        return { name: s.name, listening: '免打卡', listeningRate: null };
      }
      let totalDays = 0, metDays = 0;
      const d = new Date(sun);
      while (d.getTime() <= sat.getTime()) {
        totalDays++;
        if (loadMinutesForDate(cn, s.name, d) >= TARGET) metDays++;
        d.setDate(d.getDate() + 1);
      }
      return { name: s.name, listening: metDays + '/' + totalDays, listeningRate: totalDays > 0 ? metDays / totalDays : 0 };
    });

    // Calculate video stats — count submissions by date within the report week window
    const lessonDates = getLessonDatesInReportWeek(cn, sun);
    const videoByName = {};
    let videoTotal = 0, videoDone = 0;
    students.forEach(s => { videoByName[s.name] = { total: 2, done: 0, lateCount: 0 }; });

    if (lessonDates) {
      // Check new lesson video (current week)
      const nlWeek = getISOWeekKey(lessonDates.newLesson);
      const nlRec = getVideoRecord(cn, nlWeek, 'new');
      if (nlRec && nlRec.date === dateStr(lessonDates.newLesson)) {
        students.forEach(s => {
          videoTotal++;
          const sub = nlRec.submissions[s.name];
          if (sub) { videoByName[s.name].done++; videoDone++; }
          // Check for late submissions: submissions with date in report week from other records
        });
      } else {
        videoTotal += students.length;
      }

      // Check review video (current week)
      const rvWeek = getISOWeekKey(lessonDates.review);
      const rvRec = getVideoRecord(cn, rvWeek, 'review');
      if (rvRec && rvRec.date === dateStr(lessonDates.review)) {
        students.forEach(s => {
          videoTotal++;
          const sub = rvRec.submissions[s.name];
          if (sub) { videoByName[s.name].done++; videoDone++; }
        });
      } else {
        videoTotal += students.length;
      }

      // Check ALL video records for this class for submissions dated within the report week
      // This captures late/makeup submissions from previous cycles
      const allRecords = getAllVideoRecords();
      allRecords.forEach(rec => {
        if (rec.className !== cn) return;
        students.forEach(s => {
          const sub = rec.submissions[s.name];
          if (!sub) return;
          // Check if submission date falls in report week
          const subDate = typeof sub === 'string' ? sub : rec.date;
          const subD = new Date(subDate + 'T00:00:00');
          if (subD >= sun && subD <= sat) {
            // Only count if this record's lesson is NOT one of the current week's lessons
            if (rec.date !== dateStr(lessonDates.newLesson) && rec.date !== dateStr(lessonDates.review)) {
              videoByName[s.name].done++;
              videoByName[s.name].lateCount++;
              videoDone++;
              videoTotal++;
            }
          }
        });
      });
    }

    // Attendance stats
    const attByName = {};
    let attTotal = 0, attPresent = 0;
    students.forEach(s => { attByName[s.name] = { total: 2, present: 0, makeupCount: 0 }; });

    if (lessonDates) {
      [lessonDates.newLesson, lessonDates.review].forEach(ld => {
        const attData = loadAttendance(dateStr(ld));
        if (attData[cn]) {
          students.forEach(s => {
            const status = attData[cn][s.name] || 'present';
            attTotal++;
            if (status === 'present') { attByName[s.name].present++; attPresent++; }
          });
        } else {
          attTotal += students.length;
          students.forEach(s => { attByName[s.name].present++; attPresent++; });
        }
      });
    }

    // Add makeup attendance from other weeks — cross-week makeups boost current week's attendance
    const leaves = loadLeaves();
    leaves.forEach(l => {
      if (!l.makeupScheduled || !l.makeupDate) return;
      if (l.className !== cn) return;
      const md = new Date(l.makeupDate + 'T00:00:00');
      if (md >= sun && md <= sat) {
        // Skip if this is just a regular attendance for current week's own lesson
        const isOwnLesson = lessonDates && (
          l.date === dateStr(lessonDates.newLesson) ||
          l.date === dateStr(lessonDates.review)
        );
        if (!isOwnLesson) {
          if (!attByName[l.student]) attByName[l.student] = { total: 2, present: 0, makeupCount: 0 };
          attByName[l.student].present++;
          attByName[l.student].makeupCount++;
          attTotal++;
          attPresent++;
        }
      }
    });

    // Build table
    html += '<div class="report-table-wrap"><table class="report-table"><thead><tr>'
      + '<th>学生</th><th>听录音</th><th>录音达标率</th><th>视频打卡</th><th>视频达标率</th><th>出勤</th><th>出勤率</th></tr></thead><tbody>';

    students.forEach(s => {
      const lr = listenRows.find(r => r.name === s.name);
      const va = videoByName[s.name];
      const aa = attByName[s.name];

      const lRate = lr.listeningRate !== null ? (lr.listeningRate >= 0.7 ? 'rate-good' : 'rate-bad') : 'rate-na';
      const lRateText = lr.listeningRate !== null ? (lr.listeningRate * 100).toFixed(0) + '%' : '—';
      const vRate = va.total > 0 ? (va.done / va.total >= 0.5 ? 'rate-good' : 'rate-bad') : 'rate-na';
      const vRateText = va.total > 0 ? (va.done / va.total * 100).toFixed(0) + '%' : '—';
      const aRate = aa.total > 0 ? ((aa.present / aa.total) >= 0.8 ? 'rate-good' : 'rate-bad') : 'rate-na';
      const aRateText = aa.total > 0 ? (aa.present / aa.total * 100).toFixed(0) + '%' : '—';
      const aDisplay = (aa.makeupCount || 0) > 0 ? aa.present + '/' + aa.total + ' ⚡' : aa.present + '/' + aa.total;

      // Video display: show "2/2" normally, "3/2" for makeup
      const vDisplay = va.lateCount > 0 ? va.done + '/' + 2 + ' ⚡' : va.done + '/' + va.total;

      html += '<tr>'
        + '<td class="name-col">' + escHtml(s.name) + '</td>'
        + '<td>' + lr.listening + '</td>'
        + '<td class="' + lRate + '">' + lRateText + '</td>'
        + '<td>' + vDisplay + '</td>'
        + '<td class="' + vRate + '">' + vRateText + '</td>'
        + '<td>' + aDisplay + '</td>'
        + '<td class="' + aRate + '">' + aRateText + '</td>'
        + '</tr>';
    });

    // Accumulate global totals
    const lMet = listenRows.filter(r => r.listeningRate !== null).reduce((s, r) => s + r.listening * 1, 0) || 0;
    const lTotal = listenRows.filter(r => r.listeningRate !== null).length * 7;
    globalListenTotal += lTotal;
    // Count actual met days
    let lMetActual = 0, lTotalActual = 0;
    listenRows.forEach(r => {
      if (r.listeningRate !== null) {
        const parts = r.listening.split('/');
        lMetActual += parseInt(parts[0]) || 0;
        lTotalActual += parseInt(parts[1]) || 7;
      }
    });
    globalListenMet += lMetActual;

    globalVideoTotal += videoTotal;
    globalVideoDone += videoDone;
    globalAttTotal += attTotal;
    globalAttPresent += attPresent;

    // Class summary
    const lAvg = listenRows.filter(r => r.listeningRate !== null).reduce((sum, r, _, arr) => sum + r.listeningRate / arr.length, 0);
    const vAvg = videoTotal > 0 ? videoDone / videoTotal : 0;
    const aAvg = attTotal > 0 ? attPresent / attTotal : 0;

    html += '<tr class="section-header"><td><strong>' + cn + ' 汇总</strong></td>'
      + '<td>' + lMetActual + '/' + lTotalActual + '</td><td class="' + (lAvg >= 0.7 ? 'rate-good' : 'rate-bad') + '">' + (isNaN(lAvg) ? '—' : (lAvg * 100).toFixed(0) + '%') + '</td>'
      + '<td>' + videoDone + '/' + videoTotal + '</td><td class="' + (vAvg >= 0.5 ? 'rate-good' : 'rate-bad') + '">' + (vAvg * 100).toFixed(0) + '%</td>'
      + '<td>' + attPresent + '/' + attTotal + '</td><td class="' + (aAvg >= 0.8 ? 'rate-good' : 'rate-bad') + '">' + (aAvg * 100).toFixed(0) + '%</td>'
      + '</tr>';

    html += '</tbody></table></div>';
  }

  // ═══ Global Summary ═══
  const glAvg = globalListenTotal > 0 ? globalListenMet / globalListenTotal : 0;
  const gvAvg = globalVideoTotal > 0 ? globalVideoDone / globalVideoTotal : 0;
  const gaAvg = globalAttTotal > 0 ? globalAttPresent / globalAttTotal : 0;
  const gOverall = (glAvg + gvAvg + gaAvg) / 3;

  html += '<div class="report-table-wrap" style="margin-top:20px"><table class="report-table summary-table"><thead><tr>'
    + '<th colspan="7" style="text-align:center;font-size:.95rem;background:#1e293b;color:#fff">📊 综合汇总</th></tr></thead><tbody>';

  html += '<tr class="section-header">'
    + '<td>📻 录音综合达标率</td>'
    + '<td>' + globalListenMet + '/' + globalListenTotal + '</td>'
    + '<td class="' + (glAvg >= 0.7 ? 'rate-good' : 'rate-bad') + '">' + (glAvg * 100).toFixed(1) + '%</td>'
    + '<td colspan="4"></td></tr>';

  html += '<tr class="section-header">'
    + '<td>📹 视频综合达标率</td>'
    + '<td>' + globalVideoDone + '/' + globalVideoTotal + '</td>'
    + '<td class="' + (gvAvg >= 0.5 ? 'rate-good' : 'rate-bad') + '">' + (gvAvg * 100).toFixed(1) + '%</td>'
    + '<td colspan="4"></td></tr>';

  html += '<tr class="section-header">'
    + '<td>👥 总出勤率</td>'
    + '<td>' + globalAttPresent + '/' + globalAttTotal + '</td>'
    + '<td class="' + (gaAvg >= 0.8 ? 'rate-good' : 'rate-bad') + '">' + (gaAvg * 100).toFixed(1) + '%</td>'
    + '<td colspan="4"></td></tr>';

  html += '<tr class="section-header" style="border-top:2px solid var(--accent)">'
    + '<td><strong>🎯 综合 KPI</strong></td>'
    + '<td></td>'
    + '<td class="' + (gOverall >= 0.7 ? 'rate-good' : 'rate-bad') + '" style="font-size:1.1rem;font-weight:800">' + (gOverall * 100).toFixed(1) + '%</td>'
    + '<td colspan="4"></td></tr>';

  html += '</tbody></table></div>';

  document.getElementById('reportContent').innerHTML = html;
}
