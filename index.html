<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova 英语工作看板</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"
        onerror="var s=document.createElement('script');s.src='https://unpkg.com/xlsx@0.20.3/dist/xlsx.full.min.js';s.onerror=function(){window._xlsxLoadFailed=true};document.head.appendChild(s);"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
/* ╔══════════════════════════════════════════╗
   ║          GLOBAL CSS VARIABLES           ║
   ╚══════════════════════════════════════════╝ */
:root {
  --bg: #f4f2ee;
  --surface: #ffffff;
  --green: #10b981;
  --green-light: #ecfdf5;
  --green-border: #a7f3d0;
  --green-text: #065f46;
  --red: #ef4444;
  --red-light: #fef2f2;
  --red-border: #fecaca;
  --red-text: #991b1b;
  --amber: #f59e0b;
  --amber-light: #fffbeb;
  --amber-text: #92400e;
  --text: #1e293b;
  --text-muted: #94a3b8;
  --text-soft: #64748b;
  --accent: #7c3aed;
  --accent-light: #f5f3ff;
  --border: #e2e8f0;
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 8px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.03);
  --shadow-md: 0 4px 16px rgba(0,0,0,.06), 0 1px 4px rgba(0,0,0,.04);
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* Header */
.header {
  background: rgba(255,255,255,.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 14px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-brand { display: flex; align-items: center; gap: 10px; }
.header-brand .logo {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, #7c3aed, #a78bfa);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem; color: white;
}
.header-brand h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: -.01em; }
.header-brand .subtitle { font-size: .75rem; color: var(--text-muted); font-weight: 400; }

.controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.controls select {
  padding: 7px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-xs);
  font-size: .85rem; background: white; color: var(--text); cursor: pointer; outline: none;
  font-family: inherit;
}
.controls select:focus { border-color: var(--accent); }

/* Week nav */
.week-nav {
  display: flex; align-items: center; gap: 4px;
  background: white; border: 1.5px solid var(--border); border-radius: var(--radius-xs); padding: 3px;
}
.week-nav button {
  width: 30px; height: 30px; border: none; border-radius: 6px;
  background: transparent; cursor: pointer; font-size: .85rem;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-soft); transition: all .15s;
}
.week-nav button:hover { background: var(--accent-light); color: var(--accent); }
.week-nav .week-label {
  font-size: .82rem; font-weight: 600; color: var(--text);
  padding: 0 10px; min-width: 120px; text-align: center; user-select: none;
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; border: none; border-radius: var(--radius-xs);
  font-size: .84rem; font-weight: 600; cursor: pointer;
  transition: all .2s; font-family: inherit; white-space: nowrap;
}
.btn-primary { background: var(--accent); color: white; box-shadow: 0 1px 3px rgba(124,58,237,.25); }
.btn-primary:hover { background: #6d28d9; }
.btn-outline { background: white; color: var(--accent); border: 1.5px solid var(--accent); }
.btn-outline:hover { background: var(--accent-light); }
.btn-green { background: var(--green-light); color: var(--green-text); border: 1.5px solid var(--green-border); }
.btn-green:hover { background: #d1fae5; }
.btn-sm {
  font-size: .76rem; padding: 5px 12px; border-radius: 6px; font-weight: 500;
  background: var(--accent-light); color: var(--accent); border: 1px solid transparent; cursor: pointer;
}
.btn-sm:hover { border-color: var(--accent); }
.btn-ghost {
  background: transparent; border: none; color: var(--text-soft); font-size: .74rem;
  cursor: pointer; padding: 6px 10px; border-radius: 6px; font-weight: 500;
  font-family: inherit; transition: all .15s; white-space: nowrap;
}
.btn-ghost:hover { background: #f1f5f9; color: var(--text); }

.storage-indicator {
  font-size: .72rem; font-weight: 600; padding: 4px 10px; border-radius: 20px; white-space: nowrap;
}
.storage-indicator.saved { background: var(--green-light); color: var(--green-text); }
.storage-indicator.default { background: var(--amber-light); color: var(--amber-text); }
.storage-indicator.empty { background: #f8fafc; color: var(--text-muted); }
.sep { width: 1px; height: 24px; background: var(--border); margin: 0 2px; }

/* Main */
.main { max-width: 1440px; margin: 0 auto; padding: 28px 32px 40px; }

/* Tab Bar */
.tab-bar {
  display: flex; gap: 4px; padding: 6px;
  background: var(--surface); border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm); margin-bottom: 20px;
}
.tab-btn {
  flex: 1; padding: 10px 14px; border: none; background: transparent;
  border-radius: 8px; font-size: .88rem; font-weight: 600; cursor: pointer;
  font-family: inherit; color: var(--text-soft); transition: all .2s;
}
.tab-btn:hover { background: #f1f5f9; color: var(--text); }
.tab-btn.active { background: var(--accent); color: white; box-shadow: 0 1px 3px rgba(124,58,237,.25); }
.tab-content { display: none; }
.tab-content.active { display: block; }

.action-bar {
  display: flex; align-items: center; gap: 10px; margin-bottom: 24px; flex-wrap: wrap;
}
.action-bar .hint { font-size: .8rem; color: var(--text-muted); flex: 1; min-width: 200px; }

/* Class Section */
.class-section { margin-bottom: 36px; }
.class-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
}
.class-header h2 { font-size: 1.1rem; font-weight: 700; display: flex; align-items: baseline; gap: 8px; }
.class-header h2 .count { font-size: .8rem; color: var(--text-muted); font-weight: 400; }
.pill {
  font-size: .75rem; padding: 4px 12px; border-radius: 20px; font-weight: 600;
}
.pill-allgood { background: var(--green-light); color: var(--green-text); }
.pill-warn { background: var(--red-light); color: var(--red-text); }

/* Student Grid */
.student-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; }

/* Student Card */
.student-card {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  overflow: hidden; transition: all .25s; border: 1.5px solid transparent;
}
.student-card:hover { box-shadow: var(--shadow-md); border-color: var(--border); transform: translateY(-2px); }
.student-card.all-met { border-left: 4px solid var(--green); }
.student-card.has-unmet { border-left: 4px solid var(--red); }

.sc-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 8px; }
.sc-info { display: flex; flex-direction: column; gap: 2px; }
.sc-name { font-size: 1rem; font-weight: 700; color: var(--text); }
.sc-name .sync-tag { font-size: .65rem; color: var(--accent); font-weight: 500; margin-left: 4px; }
.sc-date { font-size: 0.7rem; color: var(--text-muted); }

.sc-days { display: flex; gap: 5px; padding: 0 18px 10px; }
.day-cell { flex: 1; cursor: pointer; position: relative; }
.day-box {
  width: 100%; max-width: 56px; border-radius: var(--radius-sm);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1px; padding: 8px 4px; min-height: 64px;
  transition: all .2s; border: 2px solid transparent; margin: 0 auto; user-select: none;
}
.day-box:hover { border-color: var(--accent) !important; box-shadow: 0 0 0 3px rgba(124,58,237,.15); transform: scale(1.06); z-index: 2; }
.day-box .day-label { font-size: .6rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.day-box .day-val { font-size: .9rem; font-weight: 800; line-height: 1; }
.day-box .day-tag { font-size: .52rem; font-weight: 600; margin-top: 1px; }
.day-box.met { background: var(--green-light); border-color: var(--green-border); color: var(--green-text); }
.day-box.unmet { background: var(--red-light); border-color: var(--red-border); color: var(--red-text); }
.day-box.future { background: #F1F5F9; border-color: #E2E8F0; color: #A0AEC0; opacity: 0.6; cursor: default; pointer-events: none; }
.day-box.today-pending { background: #FFFBEB; border-color: #FCD34D; color: #B45309; }
.day-box.today-pending:hover { border-color: #F59E0B !important; box-shadow: 0 0 0 3px rgba(245,158,11,.25); }

.day-edit-input {
  width: 100%; max-width: 56px; border-radius: var(--radius-sm); text-align: center;
  font-size: 1rem; font-weight: 800; border: 2.5px solid var(--accent); outline: none;
  box-shadow: 0 0 0 4px rgba(124,58,237,.2); color: var(--text); background: white;
  padding: 8px 4px; min-height: 64px; margin: 0 auto; font-family: inherit; display: none;
}
.day-cell.editing .day-box { display: none; }
.day-cell.editing .day-edit-input { display: block; }

/* Progress bar */
.sc-bar { padding: 0 18px 14px; display: flex; align-items: center; gap: 10px; }
.sc-bar .bar-track { flex: 1; height: 6px; background: #f1f5f9; border-radius: 10px; overflow: hidden; }
.sc-bar .bar-fill { height: 100%; border-radius: 10px; transition: width .5s; }
.bar-fill.green { background: var(--green); }
.bar-fill.red { background: var(--red); }
.sc-bar .bar-text { font-size: .72rem; color: var(--text-soft); font-weight: 600; min-width: 80px; text-align: right; }

/* Card actions (download) */
.sc-actions { display: flex; align-items: center; gap: 6px; }
.sc-download-btn {
  width: 28px; height: 28px; border-radius: 7px; border: none; background: transparent;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); font-size: .85rem; transition: all .15s;
}
.sc-download-btn:hover { background: var(--accent-light); color: var(--accent); }
.sc-heatmap-btn { width: 28px; height: 28px; border-radius: 7px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: .85rem; transition: all .15s; }
.sc-heatmap-btn:hover { background: var(--amber-light); color: var(--amber-text); }

/* Heatmap overlay */
.heatmap-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.4); z-index: 10000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
.heatmap-overlay.hidden { display: none; }
.heatmap-card { background: white; border-radius: 16px; box-shadow: 0 24px 64px rgba(0,0,0,.18); max-width: 520px; width: 94%; max-height: 85vh; overflow-y: auto; animation: hmSlide .28s ease; }
@keyframes hmSlide { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
.hm-header { padding: 18px 24px 14px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: white; z-index: 1; border-bottom: 1px solid #f1f5f9; }
.hm-title { font-size: 1.05rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
.hm-title .hm-class { font-size: .78rem; color: var(--text-muted); font-weight: 500; }
.hm-close { width: 32px; height: 32px; border-radius: 8px; border: none; background: #f1f5f9; cursor: pointer; font-size: 1.1rem; color: #64748b; display: flex; align-items: center; justify-content: center; transition: all .15s; }
.hm-close:hover { background: #e2e8f0; color: var(--text); }
.hm-body { padding: 20px 24px 24px; }
.hm-week-row { display: flex; gap: 6px; align-items: flex-start; margin-bottom: 10px; }
.hm-week-label { min-width: 44px; text-align: right; font-size: .7rem; font-weight: 700; color: var(--text-muted); padding-top: 24px; line-height: 1; }
.hm-week-cells { display: flex; flex: 1; gap: 4px; }
.hm-week-cells .day-cell { flex: 1; }
.hm-week-cells .day-box { min-height: 52px; padding: 6px 2px; border-radius: var(--radius-sm); width: 100%; max-width: none; }
.hm-week-cells .day-box .day-val { font-size: .85rem; }
.hm-week-cells .day-box .day-tag { font-size: .5rem; }
.hm-week-cells .day-box .day-label { font-size: .55rem; }
.hm-download-btn { width: 32px; height: 32px; border-radius: 8px; border: none; background: #f1f5f9; cursor: pointer; font-size: .9rem; color: #64748b; display: flex; align-items: center; justify-content: center; transition: all .15s; margin-right: 6px; }
.hm-download-btn:hover { background: #e2e8f0; color: var(--text); }
.hm-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 18px; padding-top: 16px; border-top: 1px solid #f1f5f9; }
.hm-stat { text-align: center; }
.hm-stat-val { font-size: 1.25rem; font-weight: 700; color: var(--text); }
.hm-stat-val .unit { font-size: .75rem; font-weight: 500; color: var(--text-muted); }
.hm-stat-lbl { font-size: .65rem; color: var(--text-muted); margin-top: 2px; }

/* Compare mode */
.student-card.compare-mode .sc-days { flex-direction: column; gap: 8px; }
.sc-week-row { display: flex; gap: 5px; align-items: center; }
.sc-week-row .day-box { min-height: 48px; padding: 5px 2px; }
.sc-week-row .day-box .day-val { font-size: .8rem; }
.sc-week-row .day-box .day-tag { font-size: .5rem; }
.sc-week-label {
  font-size: .6rem; font-weight: 700; color: var(--text-muted);
  writing-mode: vertical-rl; letter-spacing: .08em; text-align: center;
  padding: 2px 0; width: 16px; flex-shrink: 0;
}
.sc-compare-summary {
  display: flex; align-items: center; gap: 10px; padding: 0 18px 10px;
  font-size: .72rem; color: var(--text-soft);
}
.sc-compare-summary .change-up { color: var(--green); font-weight: 700; }
.sc-compare-summary .change-down { color: var(--red); font-weight: 700; }
.sc-compare-summary .change-eq { color: var(--text-muted); font-weight: 600; }
.sc-compare-bar { padding: 0 18px 12px; display: flex; align-items: center; gap: 10px; }
.sc-compare-bar .bar-track { flex: 1; height: 4px; background: #f1f5f9; border-radius: 10px; overflow: hidden; }
.sc-compare-bar .bar-fill { height: 100%; border-radius: 10px; }
.sc-compare-bar .bar-fill.prev { background: #cbd5e1; }
.sc-compare-bar .bar-text { font-size: .65rem; color: var(--text-soft); font-weight: 600; min-width: 70px; text-align: right; }

/* Toggle button in action bar */
.action-bar .toggle-btn {
  padding: 5px 12px; border-radius: 8px; border: 1.5px solid var(--border);
  background: white; font-size: .78rem; font-weight: 600; color: var(--text-soft);
  cursor: pointer; font-family: inherit; transition: all .15s; display: inline-flex; align-items: center; gap: 5px;
}
.action-bar .toggle-btn:hover { border-color: var(--accent); color: var(--accent); }
.action-bar .toggle-btn.active { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }

/* ===== DAILY CHECK-IN REPORT MODAL ===== */
.report-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.4); z-index: 10000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
.report-overlay.hidden { display: none; }
.report-card { background: white; border-radius: 16px; box-shadow: 0 24px 64px rgba(0,0,0,.18); max-width: 560px; width: 94%; max-height: 85vh; overflow-y: auto; animation: hmSlide .28s ease; }
.report-header { padding: 18px 24px 14px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: white; z-index: 1; border-bottom: 1px solid #f1f5f9; }
.report-title { font-size: 1.05rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
.report-close { width: 32px; height: 32px; border-radius: 8px; border: none; background: #f1f5f9; cursor: pointer; font-size: 1.1rem; color: #64748b; display: flex; align-items: center; justify-content: center; transition: all .15s; }
.report-close:hover { background: #e2e8f0; color: var(--text); }
.report-body { padding: 20px 24px 24px; }
.report-textarea {
  width: 100%; min-height: 360px; border: 1.5px solid var(--border); border-radius: 12px;
  padding: 16px; font-size: .92rem; line-height: 1.8; font-family: inherit; color: var(--text);
  resize: vertical; outline: none; background: #fafafa;
}
.report-textarea:focus { border-color: var(--accent); background: white; }
.report-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
.report-class-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.report-class-tab {
  padding: 5px 14px; border-radius: 20px; border: 1.5px solid var(--border);
  background: white; font-size: .8rem; font-weight: 600; color: var(--text-soft);
  cursor: pointer; font-family: inherit; transition: all .15s;
}
.report-class-tab:hover { border-color: var(--accent); color: var(--accent); }
.report-class-tab.active { background: var(--accent); color: white; border-color: var(--accent); }
.report-summary { display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.report-summary-item { font-size: .78rem; color: var(--text-soft); background: #f8fafc; padding: 4px 10px; border-radius: 6px; }
.report-summary-item strong { color: var(--text); }

/* Card Preview Overlay */
.card-preview-wrap {
  background: white; border-radius: 16px; box-shadow: 0 24px 64px rgba(0,0,0,.18);
  max-width: 480px; width: 94%; max-height: 88vh; overflow-y: auto;
  padding: 16px 20px 20px; animation: hmSlide .28s ease;
}
.card-preview-body { border-radius: 12px; overflow: hidden; }

/* Daily report card styles */
.dr-card { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #ffffff; border-radius: 14px; }
.dr-card-header { text-align: center; padding: 20px 16px 16px; background: linear-gradient(135deg,#eef2ff,#f0f9ff); border-radius: 14px 14px 0 0; }
.dr-card-header .dr-class { font-size: 22px; font-weight: 800; color: #1e293b; }
.dr-card-header .dr-date { font-size: 12px; color: #64748b; margin-top: 4px; }
.dr-card-header .dr-target { font-size: 11px; color: #94a3b8; margin-top: 2px; }
.dr-stats-bar { display: flex; gap: 0; }
.dr-stat { flex: 1; text-align: center; padding: 10px 6px; }
.dr-stat .dr-stat-num { font-size: 24px; font-weight: 800; }
.dr-stat .dr-stat-label { font-size: 10px; color: #64748b; margin-top: 2px; }
.dr-stat.met { background: #f0fdf4; }
.dr-stat.met .dr-stat-num { color: #16a34a; }
.dr-stat.close { background: #fffbeb; }
.dr-stat.close .dr-stat-num { color: #d97706; }
.dr-stat.missed { background: #fef2f2; }
.dr-stat.missed .dr-stat-num { color: #dc2626; }
.dr-body { padding: 12px 16px; }
.dr-student-row { display: flex; align-items: center; padding: 10px 12px; border-radius: 10px; margin-bottom: 6px; gap: 12px; transition: all .15s; }
.dr-student-row.met { background: #f0fdf4; border-left: 4px solid #22c55e; }
.dr-student-row.close { background: #fffbeb; border-left: 4px solid #f59e0b; }
.dr-student-row.missed { background: #fef2f2; border-left: 4px solid #ef4444; }
.dr-student-name { flex: 1; font-size: 15px; font-weight: 700; color: #1e293b; }
.dr-student-min { font-size: 22px; font-weight: 800; min-width: 56px; text-align: right; }
.dr-student-row.met .dr-student-min { color: #16a34a; }
.dr-student-row.close .dr-student-min { color: #d97706; }
.dr-student-row.missed .dr-student-min { color: #dc2626; }
.dr-student-status { font-size: 11px; font-weight: 600; min-width: 50px; text-align: right; }
.dr-student-row.met .dr-student-status { color: #16a34a; }
.dr-student-row.close .dr-student-status { color: #92400e; }
.dr-student-row.missed .dr-student-status { color: #991b1b; }
.dr-progress-section { padding: 0 16px 16px; }
.dr-progress-bar-wrap { background: #e2e8f0; border-radius: 8px; height: 10px; overflow: hidden; margin-bottom: 6px; }
.dr-progress-bar-fill { height: 100%; border-radius: 8px; transition: width .4s; }
.dr-progress-text { text-align: center; font-size: 11px; color: #64748b; }
.dr-progress-text strong { color: #1e293b; }
.dr-footer { text-align: center; padding: 14px 16px 18px; border-top: 1px solid #f1f5f9; }
.dr-footer .dr-motivation { font-size: 14px; font-weight: 700; color: #334155; }
.dr-footer .dr-watermark { font-size: 10px; color: #94a3b8; margin-top: 6px; }

/* ===== VIDEO HOMEWORK TAB ===== */
.video-section { margin-bottom: 32px; }
.video-section-title {
  font-size: 1.05rem; font-weight: 700; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.video-type-tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600;
}
.video-type-tag.new { background: #e8f0fe; color: #5B8DEF; }
.video-type-tag.review { background: #fef2e0; color: #E08B2A; }

.video-card {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
}
.video-card-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; border-bottom: 1px solid var(--border);
}
.video-card-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
.video-card-date { font-size: 13px; color: var(--text-soft); }

.video-student-list { padding: 8px 12px; }
.video-student-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; border-radius: var(--radius-sm); cursor: pointer;
  transition: background 0.15s; margin: 2px 0;
}
.video-student-row:hover { background: #f8f9fa; }
.video-student-row.done { background: var(--green-light); }
.video-student-name { font-size: 14px; font-weight: 600; color: var(--text); }
.video-student-name .en { font-size: 11px; color: var(--text-soft); font-weight: 400; margin-left: 4px; }
.video-retold-wrap { flex: 1; margin: 0 10px; min-width: 0; }
.video-retold-input {
  width: 100%; padding: 5px 10px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 12px; font-family: inherit; color: var(--text); background: #fafafa; outline: none;
}
.video-retold-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-light); background: #fff; }
.video-check-icon {
  width: 34px; height: 34px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; font-size: 18px;
}
.video-student-row.done .video-check-icon { background: #c8e6c9; }
.video-student-row:not(.done) .video-check-icon { background: #f1f3f4; opacity: 0.5; }

.video-add-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; padding: 16px;
  border: 2px dashed var(--border); border-radius: var(--radius); cursor: pointer;
  color: var(--text-soft); font-size: 14px; margin-top: 8px; transition: all 0.2s;
}
.video-add-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

.video-class-content-area { padding: 10px 18px 6px; border-bottom: 1px dashed var(--border); }
.video-class-content-label { font-size: 12px; font-weight: 600; color: var(--text-soft); margin-bottom: 6px; }
.video-class-content-input {
  width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px;
  font-size: 13px; font-family: inherit; color: var(--text); background: #fafafa;
  resize: vertical; min-height: 44px; outline: none;
}
.video-class-content-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); background: #fff; }

/* Template tracking (复述提示卡 / 复述视频模板) */
.tpl-tracker {
  margin-top: 16px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px;
}
.tpl-tracker-title {
  font-size: 15px; font-weight: 700;
  color: var(--text);
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 14px;
}
.tpl-group-label {
  font-size: 12px; font-weight: 700;
  color: var(--text-soft);
  margin: 10px 0 6px;
  padding-left: 2px;
  text-transform: none;
}
.tpl-tracker-all-done {
  text-align: center; padding: 8px 0 2px;
  font-size: 14px; font-weight: 700;
  color: var(--green);
}
.tpl-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; margin-bottom: 8px;
  border-radius: var(--radius-sm);
  transition: all 0.2s;
  background: var(--bg);
}
.tpl-row:last-child { margin-bottom: 0; }
.tpl-row.done { background: #f0fdf4; border: 1px solid #bbf7d0; }
.tpl-row.pending { background: #fefce8; border: 1px solid #fde68a; }
.tpl-row .tpl-icon { font-size: 22px; margin-right: 10px; }
.tpl-row .tpl-label { font-weight: 600; font-size: 14px; color: var(--text); }
.tpl-row .tpl-status {
  font-size: 12px; font-weight: 600; margin-left: 8px;
  padding: 2px 8px; border-radius: 10px;
}
.tpl-row.done .tpl-status { background: #dcfce7; color: #166534; }
.tpl-row.pending .tpl-status { background: #fef3c7; color: #92400e; }
.tpl-row .tpl-date {
  font-size: 11px; color: var(--text-soft); margin-left: 8px;
}
.tpl-btn {
  margin-left: auto; padding: 6px 14px; border: none;
  border-radius: 16px; font-size: 12px; font-weight: 600;
  cursor: pointer; transition: all 0.15s; color: #fff;
}
.tpl-btn.mark { background: var(--accent); }
.tpl-btn.mark:hover { opacity: 0.85; }
.tpl-btn.undo { background: var(--text-soft); font-size: 11px; padding: 4px 10px; }
.tpl-btn.undo:hover { background: #5f6368; }
.tpl-btn:active { transform: scale(0.96); }

/* ─── Weekly Calendar Todo Board ─── */
.wb-container {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.wb-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 0;
  border-bottom: 1px solid var(--border);
}
.wb-day-header {
  text-align: center;
  padding: 14px 6px 10px;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-soft);
  border-right: 1px solid var(--border);
  background: #fafafa;
  position: relative;
}
.wb-day-header:last-child { border-right: none; }
.wb-day-header.today { color: var(--accent); background: var(--accent-light); }
.wb-day-header .wb-date-num {
  display: block;
  font-size: 22px; font-weight: 800;
  margin-top: 2px; line-height: 1.2;
}
.wb-day-header.today .wb-date-num {
  color: var(--accent);
}
.wb-day-col {
  min-height: 120px;
  padding: 8px;
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 6px;
  transition: background 0.2s;
}
.wb-day-col:last-child { border-right: none; }
.wb-day-col.today { background: #faf5ff; }
.wb-day-col.weekend { background: #f9fafb; }
.wb-day-col.weekend.today { background: #faf5ff; }

.wb-task {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 9px; border-radius: 8px;
  font-size: 12px; cursor: pointer;
  transition: all 0.15s;
  border: 1px solid transparent;
  position: relative;
  word-break: break-all;
}
.wb-task.publish { font-weight: 600; }
.wb-task.publish.done { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }
.wb-task.publish.pending { background: #fefce8; border-color: #fde68a; color: #92400e; }
.wb-task.custom { font-weight: 500; }
.wb-task.custom.done { background: #f0fdf4; border-color: #bbf7d0; color: #166534; text-decoration: line-through; opacity: 0.7; }
.wb-task.custom.pending { background: #f8fafc; border-color: #e2e8f0; color: #475569; }
.wb-task:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,.06); }
.wb-task .wb-task-icon { font-size: 15px; flex-shrink: 0; }
.wb-task .wb-task-text { flex: 1; line-height: 1.4; }
.wb-task .wb-task-class { font-size: 10px; color: var(--text-muted); font-weight: 500; }
.wb-task .wb-task-del {
  display: none; flex-shrink: 0;
  width: 18px; height: 18px; line-height: 18px;
  text-align: center; border-radius: 50%;
  font-size: 11px; color: #ef4444; cursor: pointer;
  background: #fef2f2;
}
.wb-task.custom:hover .wb-task-del { display: block; }
.wb-task .wb-task-del:hover { background: #fee2e2; }

.wb-add-btn {
  display: flex; align-items: center; justify-content: center;
  padding: 6px; border-radius: 8px;
  border: 1.5px dashed var(--border);
  color: var(--text-muted); font-size: 12px;
  cursor: pointer; transition: all 0.2s;
  margin-top: auto;
}
.wb-add-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

.wb-add-inline { display: none; flex-direction: column; gap: 6px; margin-top: 4px; }
.wb-add-inline.active { display: flex; }
.wb-add-inline input {
  width: 100%; padding: 6px 8px; border: 1.5px solid var(--accent);
  border-radius: 6px; font-size: 12px; font-family: inherit;
  outline: none;
}
.wb-add-inline .wb-add-actions {
  display: flex; gap: 4px;
}
.wb-add-inline button {
  flex: 1; padding: 4px 8px; border: none; border-radius: 6px;
  font-size: 11px; font-weight: 600; cursor: pointer;
  transition: all 0.15s;
}
.wb-add-inline .wb-add-confirm { background: var(--accent); color: #fff; }
.wb-add-inline .wb-add-cancel { background: #e2e8f0; color: #64748b; }
.wb-add-inline .wb-add-confirm:hover { opacity: 0.85; }
.wb-add-inline .wb-add-cancel:hover { background: #cbd5e1; }

.wb-legend {
  display: flex; gap: 16px; padding: 10px 16px;
  font-size: 11px; color: var(--text-soft);
  align-items: center; border-bottom: 1px solid var(--border);
}
.wb-legend span { display: flex; align-items: center; gap: 4px; }
.wb-legend .wb-dot {
  width: 10px; height: 10px; border-radius: 3px;
}
.wb-legend .wb-dot.done { background: #bbf7d0; }
.wb-legend .wb-dot.pending { background: #fde68a; }

.wb-stats {
  padding: 12px 16px;
  font-size: 13px; font-weight: 600;
  color: var(--text);
  display: flex; align-items: center; gap: 8px;
}
.wb-stats.wb-all-done { color: #166534; }
.wb-stats .wb-stats-bar {
  flex: 1; height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden;
}
.wb-stats .wb-stats-fill {
  height: 100%; background: var(--green); border-radius: 3px;
  transition: width 0.3s;
}

/* ─── Class download button for listening tab ─── */
.class-download-btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 12px; border: 1.5px solid var(--border);
  border-radius: 8px; background: var(--surface);
  font-size: 12px; font-weight: 600; color: var(--text-soft);
  cursor: pointer; transition: all 0.2s;
  white-space: nowrap;
}
.class-download-btn:hover {
  border-color: var(--accent); color: var(--accent);
  background: var(--accent-light);
}
.class-download-preview {
  position: fixed; left: -9999px; top: 0;
  width: 800px; padding: 24px; background: #f4f2ee;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}
.class-download-preview .cd-class-header {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 16px; padding: 12px 16px;
  background: #fff; border-radius: 12px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.class-download-preview .cd-class-name {
  font-size: 20px; font-weight: 800; color: var(--text);
}
.class-download-preview .cd-class-week {
  font-size: 13px; color: var(--text-soft);
  margin-left: auto;
}

/* Hidden card preview for html2canvas (video tab + listening download) */
.video-card-preview {
  position: fixed; left: -9999px; top: 0; z-index: -1;
  background: #f4f2ee; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}
.video-card-preview .card-header { text-align: center; margin-bottom: 8px; }
.video-card-preview .card-title { font-size: 20px; font-weight: 700; color: #5B8DEF; }
.video-card-preview .card-week { font-size: 13px; color: #5f6368; margin-top: 4px; }
.video-card-preview .hw-badge {
  display: inline-block; padding: 3px 14px; border-radius: 12px;
  background: #fce4ec; color: #E91E63; font-size: 13px; font-weight: 700;
  margin-bottom: 12px;
}
.video-card-preview .card-divider {
  height: 3px; background: linear-gradient(90deg, #5B8DEF, #34A853, #FBBC04);
  border-radius: 2px; margin-bottom: 16px;
}
.video-card-preview .session-block { margin-bottom: 10px; }
.video-card-preview .session-title-row {
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
  margin-bottom: 4px; font-size: 13px; font-weight: 700;
}
.video-card-preview .session-meta {
  display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
  font-size: 11px; color: #9ca3af;
}
.video-card-preview .session-count {
  font-size: 11px; font-weight: 600; margin-left: auto;
}
.video-card-preview .class-content {
  font-size: 11px; color: #6b7280; margin-bottom: 6px;
  padding: 6px 8px; background: #f8f9fa; border-radius: 6px;
  line-height: 1.5; max-height: 3em; overflow: hidden;
}
.video-card-preview .deadline-badge {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700;
}
.video-card-preview .deadline-badge.urgent { background: #fce8e6; color: #EA4335; }
.video-card-preview .deadline-badge.soon { background: #fef2e0; color: #E08B2A; }
.video-card-preview .deadline-badge.plenty { background: #e6f4ea; color: #34A853; }
/* Compact vertical card item — portrait-friendly */
.video-card-preview .card-item {
  display: block; padding: 8px 12px; margin-bottom: 4px;
  border-radius: 8px; font-size: 13px;
  position: relative;
}
.video-card-preview .card-item .card-item-top {
  display: flex; align-items: center; justify-content: space-between;
}
.video-card-preview .card-item.done { background: #e6f4ea; }
.video-card-preview .card-item.pending { background: #fff8f0; }
.video-card-preview .card-item .student-name { font-size: 14px; font-weight: 600; }
.video-card-preview .card-item .status-icon {
  font-size: 16px; line-height: 1;
}
.video-card-preview .card-item .card-item-bottom {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 4px;
}
.video-card-preview .card-item .encourage {
  font-size: 11px; font-weight: 600;
}
.video-card-preview .card-item.done .encourage { color: #34A853; }
.video-card-preview .card-item.pending .encourage { color: #999; }
.video-card-preview .card-footer {
  text-align: center; margin-top: 14px; padding-top: 12px;
  border-top: 1px solid #e8e4e0; font-size: 13px; color: #5f6368;
  line-height: 1.6;
}
.video-card-preview .progress-bar-wrap {
  width: 100%; height: 6px; background: #e8e4e0;
  border-radius: 3px; margin: 8px 0; overflow: hidden;
}
.video-card-preview .progress-bar-fill {
  height: 6px; border-radius: 3px; transition: width 0.3s;
}

/* ===== RANKING TAB (reuse from listening-tracker) ===== */
.ranking-section {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 20px 24px; margin-bottom: 24px;
}
.ranking-section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; flex-wrap: wrap; gap: 8px;
}
.ranking-section-header h2 { font-size: 1.05rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.badge {
  font-size: .72rem; font-weight: 600; padding: 2px 10px; border-radius: 20px; white-space: nowrap;
}
.badge-pirate { background: #fef3c7; color: #92400e; }
.badge-coin  { background: #fef9c3; color: #854d0e; }

.pirate-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 16px; }
.pirate-card {
  background: linear-gradient(135deg, #fef9c3 0%, #fef3c7 100%);
  border: 2px solid #fbbf24; border-radius: var(--radius);
  padding: 18px 16px; text-align: center; position: relative; overflow: hidden;
}
.pirate-card.rank-1 { background: linear-gradient(135deg, #fef08a 0%, #fde047 100%); border-color: #eab308; }
.pirate-card.rank-2 { background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); border-color: #94a3b8; }
.pirate-card.rank-3 { background: linear-gradient(135deg, #fff7ed 0%, #fed7aa 100%); border-color: #d97706; }
.pirate-card .medal { font-size: 2rem; line-height: 1; margin-bottom: 6px; }
.pirate-card .name { font-size: 1.05rem; font-weight: 700; color: #1e293b; }
.pirate-card .minutes { font-size: .82rem; color: #64748b; margin: 4px 0 8px; }
.pirate-card .coins { font-size: 1.3rem; font-weight: 800; color: #92400e; }
.pirate-card .coin-label { font-size: .7rem; color: #92400e; opacity: .7; }

.pirate-rest-toggle {
  display: flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--accent);
  background: none; border: 1.5px solid var(--accent); border-radius: 20px;
  padding: 5px 14px; cursor: pointer; margin: 0 auto 12px; font-weight: 600;
}
.pirate-rest-toggle:hover { background: var(--accent-light); }
.pirate-rest-toggle.open .arrow { transform: rotate(180deg); }
.pirate-rest-toggle .arrow { transition: transform .2s; display: inline-block; }
.pirate-rest { display: none; }
.pirate-rest.open { display: block; }
.pirate-rest-table { width: 100%; border-collapse: collapse; font-size: .88rem; }
.pirate-rest-table th {
  text-align: left; color: var(--text-muted); font-weight: 600; font-size: .72rem;
  text-transform: uppercase; padding: 7px 10px; border-bottom: 2px solid var(--border);
}
.pirate-rest-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); }

.fa-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.fa-row {
  display: flex; align-items: flex-start; gap: 10px; padding: 8px 12px;
  background: var(--green-light); border-radius: var(--radius-sm); flex-wrap: wrap;
}
.fa-row.fail { background: var(--red-light); }
.fa-visual { display: flex; flex-direction: column; gap: 2px; }
.fa-name { font-size: .92rem; font-weight: 600; width: 64px; flex-shrink: 0; color: var(--text); }
.fa-blocks { display: flex; gap: 4px; }
.fa-block {
  width: 28px; height: 28px; border-radius: 6px; display: flex;
  align-items: center; justify-content: center; font-size: .7rem; font-weight: 700; color: white;
}
.fa-block.pass  { background: var(--green); }
.fa-block.fail  { background: var(--red); }
.fa-block.future { background: var(--text-muted); opacity: .35; }
.fa-block.today-pending { background: #FCD34D; color: #B45309; }
.fa-dates { display: flex; gap: 4px; margin-bottom: 2px; }
.fa-date { width: 28px; font-size: .55rem; color: var(--text-muted); text-align: center; line-height: 1.1; }
.fa-summary { font-size: .78rem; font-weight: 700; min-width: 48px; text-align: right; }
.fa-summary.pass { color: var(--green-text); }
.fa-summary.fail { color: var(--red-text); }
.ranking-meta { font-size: .75rem; color: var(--text-muted); margin-bottom: 12px; }

/* Download card buttons */
.download-card-btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 12px; border: 1px solid var(--border); border-radius: 20px;
  background: var(--surface); color: var(--text-soft);
  font-size: .72rem; font-weight: 600; cursor: pointer;
  transition: all .15s; white-space: nowrap;
}
.download-card-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.download-card-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }

/* 两次打卡小明星卡片 */
.double-done-section {
  margin-top: 16px; padding: 16px 18px;
  background: linear-gradient(135deg, #fffde7 0%, #fff8e1 100%);
  border: 1.5px solid #ffe082; border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.double-done-header {
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
}
.double-done-title {
  font-size: .95rem; font-weight: 800; color: #e8a400;
}
.double-done-count {
  font-size: .78rem; background: #ffd54f; color: #5d4037;
  padding: 2px 10px; border-radius: 10px; font-weight: 700;
}
.double-done-cards {
  display: flex; gap: 10px; overflow-x: auto;
  padding: 4px 0 8px;
  scrollbar-width: thin; scrollbar-color: #ffd54f transparent;
  -webkit-overflow-scrolling: touch;
}
.double-done-cards::-webkit-scrollbar { height: 4px; }
.double-done-cards::-webkit-scrollbar-thumb { background: #ffd54f; border-radius: 2px; }
.double-done-card {
  flex: 0 0 auto; min-width: 100px; padding: 14px 12px 10px;
  background: linear-gradient(180deg, #fff 0%, #fffde7 100%);
  border: 1.5px solid #ffe082; border-radius: 10px;
  text-align: center; transition: transform .15s, box-shadow .15s;
}
.double-done-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(255,193,7,.25);
}
.double-done-card .coin { font-size: 32px; line-height: 1; display: block; margin-bottom: 4px; }
.double-done-card .name-cn { font-size: 14px; font-weight: 600; color: var(--text); }
.double-done-card .name-en { font-size: 10px; color: var(--text-muted); font-weight: 400; margin-top: 1px; }
.double-done-card .badge {

.double-done-download-btn {

}

.double-done-empty {

}

/* 本周补交区域 */
.late-submit-section {
  margin-top: 16px; padding: 16px 18px;
  background: linear-gradient(135deg, #e3f2fd 0%, #e1f5fe 100%);

  box-shadow: var(--shadow);
}
.late-submit-header {
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
}
.late-submit-title {
  font-size: .95rem; font-weight: 800; color: #1565c0;
}
.late-submit-count {
  font-size: .78rem; background: #90caf9; color: #0d47a1;

}
.late-submit-list {
  display: flex; flex-direction: column; gap: 8px;
}
.late-submit-item {

}
.late-submit-item:hover {

}
.late-submit-item .student {

}
.late-submit-item .student-name {
  font-size: 14px; font-weight: 600; color: var(--text);
}
.late-submit-item .student-en {

}
.late-submit-item .lesson-tag {

}
.late-submit-item .submit-date {
  font-size: 12px; color: #5f6368;
  white-space: nowrap;
}
.late-submit-empty {
  text-align: center; padding: 12px; color: #1565c0;
  font-size: 13px; opacity: .7;
}

/* Card canvas (hidden, used for capture) */
.card-canvas-hidden { position: fixed; left: -9999px; top: 0; z-index: -1; }

/* Late submission modal */
.late-modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.4); z-index: 11000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
.late-modal-overlay.hidden { display: none; }
.late-modal-card { background: white; border-radius: 16px; box-shadow: 0 24px 64px rgba(0,0,0,.18); max-width: 420px; width: 92%; padding: 24px; animation: hmSlide .28s ease; }
.late-modal-card h3 { margin: 0 0 16px; font-size: 1.1rem; color: var(--text); }
.late-modal-card .field { margin-bottom: 14px; }
.late-modal-card label { display: block; font-size: .8rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
.late-modal-card select, .late-modal-card input[type="date"] {
  width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 10px;
  font-size: .92rem; font-family: inherit; background: #fff; color: var(--text);
}
.late-modal-card select:focus, .late-modal-card input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,141,239,.12); }
.late-modal-card .actions { display: flex; gap: 10px; margin-top: 18px; }
.late-modal-card .actions button { flex: 1; padding: 10px; border: none; border-radius: 10px; font-size: .9rem; font-weight: 600; cursor: pointer; font-family: inherit; }
.late-modal-card .actions .btn-primary { background: var(--accent); color: #fff; }
.late-modal-card .actions .btn-primary:hover { opacity: .9; }
.late-modal-card .actions .btn-ghost { background: #f1f5f9; color: var(--text-muted); }
.late-modal-card .actions .btn-ghost:hover { background: #e2e8f0; }
.late-submit-add-btn {
  font-size: 12px; padding: 4px 12px; background: #e3f2fd; color: #1565c0;
  border: 1px solid #90caf9; border-radius: 8px; cursor: pointer; font-weight: 600;
  font-family: inherit; transition: all .15s; margin-left: auto;
}
.late-submit-add-btn:hover { background: #bbdefb; }
.late-submit-del {
  font-size: 13px; padding: 0 4px; background: none; border: none;
  color: #94a3b8; cursor: pointer; border-radius: 4px; line-height: 1;
  transition: all .15s; flex-shrink: 0; margin-left: 4px;
}
.late-submit-del:hover { color: #ef4444; background: #fef2f2; }

/* ===== WEEKLY REPORT TAB ===== */
.report-week-nav {
  display: flex; align-items: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
}
.report-table-wrap {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  overflow-x: auto; margin-bottom: 24px;
}
.report-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
.report-table th {
  background: #f8fafc; padding: 10px 10px; text-align: center; font-weight: 700;
  font-size: .74rem; color: var(--text-soft); border-bottom: 2px solid var(--border);
  white-space: nowrap;
}
.report-table td {
  padding: 9px 10px; text-align: center; border-bottom: 1px solid #f1f5f9;
  font-weight: 600; font-size: .84rem; white-space: nowrap;
}
.report-table td.name-col { text-align: left; font-weight: 700; }
.report-table .rate-good { color: var(--green-text); }
.report-table .rate-bad { color: var(--red-text); }
.report-table .rate-na { color: var(--text-muted); }
.report-table tr.section-header td {
  background: #f8fafc; font-weight: 700; color: var(--text-soft);
  font-size: .76rem; text-transform: uppercase; letter-spacing: .03em;
  border-top: 2px solid var(--border);
}
.summary-table td { font-size: .88rem; padding: 11px 14px; text-transform: none; letter-spacing: normal; }
.summary-table thead th { font-size: .82rem; }

/* ===== ATTENDANCE TAB ===== */
.att-section { margin-bottom: 32px; }
.att-date-row {
  display: flex; align-items: center; gap: 6px; margin-bottom: 14px; flex-wrap: wrap;
}
.att-date-row input[type="date"] {
  padding: 7px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-xs);
  font-size: .85rem; font-family: inherit;
}
.att-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px;
}
.att-card {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
  gap: 10px; transition: all .2s;
}
.att-card:hover { box-shadow: var(--shadow-md); }
.att-card .att-name { font-size: .95rem; font-weight: 700; }
.att-card .att-btns { display: flex; gap: 4px; }
.att-btn {
  padding: 4px 12px; border-radius: 6px; font-size: .76rem; font-weight: 600;
  border: 2px solid transparent; cursor: pointer; background: #f1f5f9; color: var(--text-soft);
  font-family: inherit; transition: all .15s;
}
.att-btn.active-present { background: var(--green-light); color: var(--green-text); border-color: var(--green-border); }
.att-btn.active-leave { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
.att-btn:hover { opacity: .8; }
.att-summary {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px 20px; margin-bottom: 20px; display: flex; gap: 24px; flex-wrap: wrap;
}
.att-summary-item { font-size: .88rem; font-weight: 600; }
.att-summary-item .num { font-weight: 800; font-size: 1.1rem; margin-right: 2px; }

.att-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius-sm); overflow: hidden; box-shadow: var(--shadow); }
.att-table th, .att-table td { padding: 10px 12px; text-align: center; border-bottom: 1px solid var(--border); }
.att-table th { background: #f8fafc; font-size: .78rem; font-weight: 700; color: var(--text-soft); }
.att-table thead th.att-lesson-col { width: 150px; }
.att-table thead th.att-name-col { text-align: left; width: auto; }
.att-table .att-date-sub { font-size: .65rem; color: var(--text-muted); font-weight: 400; display: block; margin-top: 2px; }
.att-table .att-name-cell { text-align: left; font-weight: 600; font-size: .88rem; }
.att-table .att-toggle-cell { white-space: nowrap; }
.att-table .att-toggle-cell .att-btn { margin: 0 2px; }

.leave-history {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px 20px; margin-top: 20px;
}
.leave-history h3 { font-size: .95rem; font-weight: 700; margin-bottom: 12px; }
.leave-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; border-radius: 8px; margin-bottom: 4px; flex-wrap: wrap; gap: 8px;
}
.leave-item.pending-makeup { background: #fef2f2; border-left: 3px solid var(--red); }
.leave-item.scheduled { background: var(--green-light); border-left: 3px solid var(--green); }
.leave-item .leave-info { font-size: .84rem; font-weight: 500; }
.leave-item .leave-actions { display: flex; gap: 6px; align-items: center; }
.leave-item .leave-actions input[type="date"] {
  padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px;
  font-size: .78rem; font-family: inherit; width: 120px;
}

/* ===== PRINTABLE CARD ===== */
.printable-card {
  width: 680px; background: white; border-radius: 20px; padding: 32px 36px;
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  box-shadow: 0 8px 32px rgba(0,0,0,.12); margin: 16px auto;
}
.pc-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; padding-bottom: 16px; border-bottom: 2px solid #f1f5f9; }
.pc-header h2 { font-size: 1.3rem; font-weight: 800; color: #1e293b; }
.pc-header .pc-class { font-size: .78rem; color: var(--text-muted); margin-bottom: 2px; }
.pc-header .pc-week { font-size: .85rem; color: var(--text-soft); font-weight: 600; }
.pc-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
.pc-table th {
  background: #f8fafc; padding: 10px 8px; text-align: center; font-weight: 700;
  font-size: .76rem; color: var(--text-soft); border-bottom: 2px solid var(--border);
  text-transform: uppercase; letter-spacing: .03em;
}
.pc-table td { padding: 9px 8px; text-align: center; border-bottom: 1px solid #f1f5f9; font-weight: 600; font-size: .84rem; }
.pc-table .pass { color: var(--green-text); background: var(--green-light); }
.pc-table .fail { color: var(--red-text); background: var(--red-light); }
.pc-summary {
  margin-top: 18px; padding-top: 14px; border-top: 2px solid #f1f5f9;
  display: flex; justify-content: space-between; font-size: .82rem;
  color: var(--text-soft); gap: 16px; flex-wrap: wrap;
}
.pc-footer { text-align: center; margin-top: 18px; font-size: .7rem; color: #cbd5e1; }

/* Toast */
.toast {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
  background: #1e293b; color: white; padding: 10px 28px; border-radius: 30px;
  font-size: .84rem; font-weight: 600; z-index: 2000; opacity: 0;
  transition: opacity .3s; pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,.2);
}
.toast.show { opacity: 1; }

/* 小金币庆祝动画 */
.coin-celebration-overlay {
  position: fixed; inset: 0; z-index: 3000; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
}
.coin-celebration-card {
  background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
  border: 2.5px solid #f59e0b;
  border-radius: 20px;
  padding: 28px 36px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(245,158,11,0.35);
  animation: coinCardIn .4s cubic-bezier(.34,1.56,.64,1) both;
  max-width: 320px;
}
.coin-celebration-card .coin-big { font-size: 3.2rem; animation: coinSpin 1s ease-out; display: inline-block; }
.coin-celebration-card .coin-title { font-size: 1.2rem; font-weight: 800; color: #92400e; margin: 8px 0 4px; }
.coin-celebration-card .coin-sub { font-size: .88rem; color: #b45309; }
.coin-particles { position: absolute; inset: 0; pointer-events: none; }
.coin-particle {
  position: absolute;
  font-size: 1.4rem;
  animation: particleFly 1.2s ease-out forwards;
}
@keyframes coinCardIn {
  0% { opacity:0; transform: scale(.5) translateY(30px); }
  100% { opacity:1; transform: scale(1) translateY(0); }
}
@keyframes coinCardOut {
  0% { opacity:1; transform: scale(1); }
  100% { opacity:0; transform: scale(.85) translateY(-20px); }
}
@keyframes coinSpin {
  0% { transform: rotateY(0deg) scale(0.5); }
  60% { transform: rotateY(360deg) scale(1.2); }
  100% { transform: rotateY(720deg) scale(1); }
}
@keyframes particleFly {
  0% { opacity:1; transform: translate(0,0) scale(1); }
  100% { opacity:0; transform: translate(var(--tx), var(--ty)) scale(0.3); }
}
.dl-container { position: fixed; top: 0; left: 0; z-index: -9999; opacity: 0; pointer-events: none; }

/* Report download btn */
.report-dl-btn {
  font-size: .82rem; font-weight: 600; padding: 6px 16px; border-radius: 20px;
  border: 1.5px solid var(--accent); background: var(--accent-light);
  color: var(--accent); cursor: pointer; font-family: inherit; transition: all .15s;
}
.report-dl-btn:hover { background: var(--accent); color: white; }

/* Contact list (待联系家长) */
.contact-section { margin-top: 20px; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.contact-header { padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1.5px solid var(--red-border); background: var(--red-light); }
.contact-header h3 { font-size: .95rem; color: var(--red-text); margin: 0; display: flex; align-items: center; gap: 8px; }
.contact-count { font-size: .8rem; color: var(--red); font-weight: 700; background: white; padding: 2px 10px; border-radius: 20px; }
.contact-row { display: flex; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--border); gap: 12px; transition: background .15s; cursor: pointer; }
.contact-row:hover { background: #fffbeb; }
.contact-row.contacted { opacity: 0.45; }
.contact-row.contacted .contact-name { text-decoration: line-through; }
.contact-cb { width: 20px; height: 20px; border-radius: 6px; border: 2px solid #d1d5db; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: .55rem; transition: all .15s; background: white; }
.contact-row.contacted .contact-cb { background: var(--green); border-color: var(--green); color: white; }
.contact-info { flex: 1; min-width: 0; }
.contact-name { font-size: .88rem; font-weight: 600; color: var(--text); }
.contact-class { font-size: .72rem; color: var(--text-muted); }
.contact-detail { font-size: .72rem; color: var(--text-soft); line-height: 1.4; }
.contact-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: .68rem; font-weight: 700; }
.contact-badge.danger { background: var(--red-light); color: var(--red); }
.contact-badge.warn { background: var(--amber-light); color: var(--amber-text); }
.contact-none { padding: 24px 18px; text-align: center; font-size: .85rem; color: var(--green); font-weight: 600; background: var(--green-light); }

/* Student weekly card modal */
.stu-card-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.45); z-index: 1000; display: flex; align-items: center; justify-content: center; overflow-y: auto; padding: 20px 0; }
.stu-card-modal { background: #fff; border-radius: 16px; width: 380px; max-width: 92vw; box-shadow: 0 20px 60px rgba(0,0,0,.2); overflow: hidden; animation: stuCardIn .25s ease; margin: auto; }
@keyframes stuCardIn { from { transform: scale(.92) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
.stu-card-body { padding: 20px 20px 14px; }
.stu-card-header { text-align: center; margin-bottom: 14px; }
.stu-card-header h2 { font-size: 1.1rem; margin: 0 0 2px; color: #1e293b; }
.stu-card-header .stu-card-week { font-size: .74rem; color: #94a3b8; }
.stu-card-section { margin-bottom: 10px; }
.stu-card-section-title { font-size: .74rem; color: #94a3b8; margin-bottom: 4px; }
.stu-card-stars { display: flex; gap: 4px; font-size: 1.3rem; }
.stu-card-star { color: #e2e8f0; }
.stu-card-star.filled { color: #f59e0b; }
.stu-card-progress { font-size: .74rem; color: #64748b; margin-top: 2px; }
.stu-card-progress .up { color: #10b981; font-weight: 700; }
.stu-card-progress .down { color: #ef4444; font-weight: 700; }
.stu-card-progress .same { color: #94a3b8; }
.stu-card-achievements { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.stu-card-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: .72rem; font-weight: 700; }
.stu-card-badge.gold { background: #fef3c7; color: #92400e; }
.stu-card-badge.silver { background: #e0e7ff; color: #3730a3; }
.stu-card-badge.bronze { background: #fce7f3; color: #9d174d; }
/* Inline section comments (praise + remind) */
.stu-card-inline { font-size: .7rem; margin-top: 2px; line-height: 1.5; }
.sci-praise { color: #059669; font-weight: 600; }
.sci-remind { color: #b45309; }
/* Late submission display in student card */
.stu-card-late { font-size: .68rem; color: #6366f1; margin-top: 4px; line-height: 1.6; }
.stu-card-late-item { padding: 2px 0; }
/* Extra chips (streak, progress, rank) */
.stu-card-extras { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.stu-card-extra-chip { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 12px; font-size: .66rem; font-weight: 600; }
.stu-card-extra-chip.praise { background: #fef3c7; color: #92400e; }
.stu-card-extra-chip.remind { background: #fef2f2; color: #991b1b; }
/* Comment textarea */
.stu-card-comment { margin-top: 10px; }
.stu-card-comment textarea { width: 100%; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 8px 10px; font-size: .78rem; resize: none; height: 48px; outline: none; transition: border-color .15s; box-sizing: border-box; }
.stu-card-comment textarea:focus { border-color: #6366f1; }
.stu-card-actions { display: flex; gap: 8px; padding: 0 20px 16px; }
.stu-card-btn { flex: 1; padding: 9px 0; border: none; border-radius: 10px; font-size: .82rem; font-weight: 700; cursor: pointer; transition: all .15s; }
.stu-card-btn.primary { background: #6366f1; color: #fff; }
.stu-card-btn.primary:hover { background: #4f46e5; }
.stu-card-btn.secondary { background: #f1f5f9; color: #475569; }
.stu-card-btn.secondary:hover { background: #e2e8f0; }

/* Day grid for listening (red/green blocks like tracker cards) */
.stu-card-day-grid { display: flex; gap: 3px; margin-top: 4px; }
.stu-card-day-box { flex: 1; text-align: center; padding: 5px 2px; border-radius: 7px; font-size: .65rem; color: #fff; font-weight: 700; min-width: 30px; }
.stu-card-day-box.met { background: #10b981; }
.stu-card-day-box.partial { background: #f59e0b; }
.stu-card-day-box.unmet { background: #ef4444; }
.stu-card-day-box.future { background: #e2e8f0; color: #94a3b8; }
.stu-card-day-box.exempt { background: #e2e8f0; color: #94a3b8; }
.stu-card-day-box .day-name { font-size: .56rem; opacity: .85; margin-bottom: 1px; }
.stu-card-day-box .day-icon { font-size: .85rem; }

/* Video big blocks */
.stu-card-video-grid { display: flex; gap: 6px; margin-top: 4px; }
.stu-card-video-box { flex: 1; text-align: center; padding: 10px 6px; border-radius: 10px; font-size: .74rem; font-weight: 700; }
.stu-card-video-box.done { background: #ecfdf5; color: #065f46; border: 1.5px solid #10b981; }
.stu-card-video-box.undone { background: #fef2f2; color: #991b1b; border: 1.5px solid #ef4444; }
.stu-card-video-box.pending { background: #fffbeb; color: #92400e; border: 1.5px solid #f59e0b; }
.stu-card-video-box .v-icon { font-size: 1rem; margin-bottom: 2px; }
.stu-card-video-box .v-date { font-size: .62rem; opacity: .65; margin-bottom: 1px; }

<script>
// ╔══════════════════════════════════════════╗
// ║          DATA MODEL & CONFIG            ║
// ╚══════════════════════════════════════════╝

const TARGET = 40;
const DAY_LABELS = ['周一','周二','周三','周四','周五','周六','周日'];
const DAY_KEYS = ['mon','tue','wed','thu','fri','sat','sun'];
const DAY_SHORT = ['一','二','三','四','五','六','日'];

const PIRATE_COINS = [8, 6, 4];

// Unified class & student definitions
const CLASSES = {
  '1班': {
    newLessonDay: 0, reviewDay: 5, // Sun new, Fri review
    students: [

    students: [
      { name: '赵千祎', en: 'Anna', syncWith: null },

    students: [

      { name: '张宸滋', en: 'Daisy', syncWith: null, transferredDate: '2026-05-13' },
      { name: '张毓君', en: 'Hannah', syncWith: null, transferredDate: '2026-05-13' },
      { name: '杨栩',   en: 'Willian', syncWith: null },
      { name: '刘敬斌', en: 'Daniel', syncWith: null },
      { name: '陈文楷', en: 'Leo', syncWith: null },
      { name: '田俊杰', en: 'Matt', syncWith: null },
      { name: '朱昱颖', en: 'Luna', syncWith: null },
      { name: '刘秋昀', en: 'Samson', syncWith: null, joinedDate: '2026-05-06' },
      { name: '李元祁', en: 'Rex',    syncWith: null, joinedDate: '2026-06-21' },
      { name: '朱传柠', en: null,    syncWith: null, leftDate: '2026-04-08' },
      { name: '罗浠潼', en: null,    syncWith: null, leftDate: '2026-04-15' },
    ]
  }
};

// 2班课表切分：2026-06-20 之前旧课表（周二新课、周六复习），之后新课表（周六新课、周二复习）
const SCHEDULE_CUTOVER_2BAN = new Date('2026-06-20T00:00:00');
function getSchedule(className, dateInput) {
  if (className !== '2班') return CLASSES[className];
  const sched = CLASSES[className];
  if (!sched) return sched;
  let d;
  if (dateInput instanceof Date) { d = dateInput; }
  else { d = new Date(dateInput + 'T00:00:00'); }
  if (d < SCHEDULE_CUTOVER_2BAN) {
    return { newLessonDay: 2, reviewDay: 6, students: sched.students };
  }
  return { newLessonDay: 6, reviewDay: 2, students: sched.students };
}

// Helper: get student config by name
function getStudentCfg(className, name) {
  const cls = CLASSES[className];
  if (!cls) return null;
  return cls.students.find(s => s.name === name) || null;
}

// New student helpers: graduated listening targets & join-date exemption
// Returns true if a report week is before this student's join/transfer date
function isBeforeJoinWeek(cn, name, reportSunday) {
  const cfg = getStudentCfg(cn, name);
  if (!cfg) return false;
  const cutoffDate = cfg.joinedDate || cfg.transferredDate;
  if (!cutoffDate) return false;
  const cutoff = new Date(cutoffDate + 'T00:00:00');
  return reportSunday.getTime() < cutoff.getTime();
}

// Returns true if a report week is after this student's left date (退学/停课)
// Rule: if the week's Saturday >= leftDate, the student is exempt for that week
function isAfterLeftWeek(cn, name, reportSunday) {
  const cfg = getStudentCfg(cn, name);
  if (!cfg || !cfg.leftDate) return false;
  const left = new Date(cfg.leftDate + 'T00:00:00');
  const sat = new Date(reportSunday);
  sat.setDate(sat.getDate() + 6);
  return sat.getTime() >= left.getTime();
}

// Combined check: student is exempt if before join OR after left
function isStudentInactive(cn, name, reportSunday) {
  return isBeforeJoinWeek(cn, name, reportSunday) || isAfterLeftWeek(cn, name, reportSunday);
}

// Returns graduated listening target (minutes) based on how long student has been enrolled
// Month 1 (0-30 days): 20 min | Month 2 (31-60 days): 30 min | Month 3+ (>60 days): 40 min
function getStudentTarget(cn, name, refDate) {
  const cfg = getStudentCfg(cn, name);
  if (!cfg || !cfg.joinedDate) return TARGET; // normal target
  const joined = new Date(cfg.joinedDate + 'T00:00:00');
  const daysSinceJoin = Math.floor((refDate.getTime() - joined.getTime()) / 86400000);
  if (daysSinceJoin < 31) return 20;
  if (daysSinceJoin < 61) return 30;
  return TARGET; // month 3+: same as everyone
}

// Get listening-eligible students for a class (exclude exempt)
function getListeningStudents(className) {
  const cls = CLASSES[className];
  if (!cls) return [];
  return cls.students.filter(s => !s.exemptListening);
}

// Get all students for a class
function getAllStudents(className) {
  return (CLASSES[className] || {}).students || [];
}

// Resolve sync: if student has syncWith, return the source name
function resolveListenName(className, name) {
  const cfg = getStudentCfg(className, name);
  if (cfg && cfg.syncWith) return cfg.syncWith;
  return name;
}

// Default listening data (one example week)
const DEFAULT_LISTENING = {
  '1班': {
    '董彭芃': { mon: 78, tue: 65, wed: 38, thu: 57, fri: 91, sat: 99, sun: 36 },
    '郭知瑶': { mon: 120, tue: 46, wed: 30, thu: 74, fri: 79, sat: 51, sun: 40 },
    '王娜':   { mon: 44, tue: 46, wed: 51, thu: 92, fri: 2, sat: 65, sun: 50 },
    '李明泽': { mon: 17, tue: 23, wed: 0, thu: 0, fri: 38, sat: 93, sun: 37 },
  },
  '2班': {
    '赵千祎': { mon: 50, tue: 102, wed: 43, thu: 41, fri: 49, sat: 73, sun: 38 },
    '孙晓霖': { mon: 89, tue: 51, wed: 94, thu: 92, fri: 92, sat: 115, sun: 97 },
    '徐提珈': { mon: 0, tue: 0, wed: 0, thu: 80, fri: 0, sat: 0, sun: 0 },
    '陈宗楷': { mon: 42, tue: 43, wed: 43, thu: 49, fri: 43, sat: 49, sun: 0 },
    '陈熙':   { mon: 176, tue: 88, wed: 172, thu: 163, fri: 105, sat: 82, sun: 154 },
    '尹续菲': { mon: 55, tue: 45, wed: 71, thu: 52, fri: 46, sat: 40, sun: 48 },
  },
  '6班': {
    '王俊朔': { mon: 119, tue: 95, wed: 62, thu: 88, fri: 74, sat: 14, sun: 44 },
    '李艺明': { mon: 187, tue: 52, wed: 47, thu: 104, fri: 35, sat: 20, sun: 108 },
    '张宸滋': { mon: 175, tue: 45, wed: 54, thu: 61, fri: 67, sat: 0, sun: 46 },
    '张毓君': { mon: 0, tue: 21, wed: 0, thu: 44, fri: 45, sat: 72, sun: 89 },
    '杨栩':   { mon: 0, tue: 41, wed: 42, thu: 43, fri: 44, sat: 130, sun: 481 },
    '刘敬斌': { mon: 19, tue: 27, wed: 36, thu: 32, fri: 9, sat: 9, sun: 0 },
    '陈文楷': { mon: 96, tue: 97, wed: 38, thu: 130, fri: 134, sat: 13, sun: 87 },
    '田俊杰': { mon: 48, tue: 43, wed: 0, thu: 54, fri: 46, sat: 93, sun: 98 },
    '朱昱颖': { mon: 47, tue: 49, wed: 49, thu: 44, fri: 22, sat: 46, sun: 45 },
    '刘秋昀': { mon: 70, tue: 40, wed: 88, thu: 51, fri: 0, sat: 52, sun: 42 },
    '李元祁': { mon: 0,  tue: 0,  wed: 0,  thu: 0,  fri: 0, sat: 0,  sun: 0  },
  }
};

// ╔══════════════════════════════════════════╗
// ║            PERSISTENCE LAYER            ║
// ╚══════════════════════════════════════════╝

const STORAGE_PREFIX = 'nd-';

// ── localStorage 键名一览（统一前缀 nd-） ──
// nd-L-YYYY-MM-DD         → 听力打卡数据（按周）
// nd-V-{class}-{ISO周}-{type} → 复述视频记录（新课/复习课）
// nd-TPL-{class}-{ISO周}  → 复述模板追踪（提示卡/视频模板）
// nd-A-YYYY-MM-DD         → 出勤数据（按日）
// nd-leaves               → 请假/补课记录
// nd-TODO-{ISO周}         → 日历待办事项
// nd-contacts             → 提醒已联系家长记录
// nd-late-{class}-{ISO周} → 本周补交记录（纯手动添加）
// nd-report-text-{ISO周}  → 周报文本（看过程/看自己 input 内容）

// ---- Listening data: keyed by week Monday ----
function getListenKey(monday) {
  const y = monday.getFullYear();
  const m = String(monday.getMonth() + 1).padStart(2, '0');
  const d = String(monday.getDate()).padStart(2, '0');
  return STORAGE_PREFIX + 'L-' + y + '-' + m + '-' + d;
}

const DEFAULT_MONDAY_KEY = getListenKey(new Date(2026, 4, 25)); // 2026-05-25

function loadListening(monday) {
  const key = getListenKey(monday);
  try {
    const raw = localStorage.getItem(key);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  if (key === DEFAULT_MONDAY_KEY) return deepClone(DEFAULT_LISTENING);
  return null;
}

function saveListening(monday, data) {
  try {
    localStorage.setItem(getListenKey(monday), JSON.stringify(data));
  } catch (e) { console.error('Save failed:', e); }
}

function getOrCreateListening(monday) {
  let data = loadListening(monday);
  if (!data) {
    data = {};
    for (const cn of Object.keys(CLASSES)) {
      data[cn] = {};
      for (const s of getListeningStudents(cn)) {
        data[cn][s.name] = { mon: 0, tue: 0, wed: 0, thu: 0, fri: 0, sat: 0, sun: 0 };
      }
    }
    saveListening(monday, data);
  }
  // Ensure all current students exist
  for (const cn of Object.keys(CLASSES)) {
    if (!data[cn]) data[cn] = {};
    for (const s of getListeningStudents(cn)) {
      if (!data[cn][s.name]) data[cn][s.name] = { mon: 0, tue: 0, wed: 0, thu: 0, fri: 0, sat: 0, sun: 0 };
    }
  }
  return data;
}

// ---- Video homework data: keyed by ISO week ----
function getVideoKey(classId, dateStr, type) {
  return STORAGE_PREFIX + 'V-' + classId + '-' + dateStr + '-' + type;
}

// Lesson type helpers — support 'new', 'review'
function getLessonTypeLabel(type) {
  if (type === 'new') return '新课';
  if (type === 'review') return '复习课';
  return type;
}
function getLessonTypeIcon(type) {
  if (type === 'new') return '📘';
  if (type === 'review') return '📗';
  return '📚';
}
function getLessonTypeColor(type) {
  if (type === 'new') return '#5B8DEF';
  if (type === 'review') return '#E08B2A';
  return '#64748B';
}

function loadVideoData() {
  const result = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key.startsWith(STORAGE_PREFIX + 'V-')) {
      try { result[key] = JSON.parse(localStorage.getItem(key)); } catch (e) {}
    }
  }
  return result;
}

// Video key migration: old format V-{cn}-{ISO_WEEK}-{type} → new format V-{cn}-{date}-{type}
// Called on page load and after importBackup().
// Idempotent: only migrates if old-format keys are detected.
function migrateVideoKeys() {
  // Collect old-format keys (contain a W\d+ segment)
  const keysToMigrate = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key || !key.startsWith(STORAGE_PREFIX + 'V-')) continue;
    if (key === STORAGE_PREFIX + 'V-MIGRATED-v2') continue;
    const parts = key.replace(STORAGE_PREFIX + 'V-', '').split('-');
    if (parts.some(p => /^W\d{1,2}$/.test(p))) {
      keysToMigrate.push(key);
    }
  }
  if (keysToMigrate.length === 0) return; // Nothing to migrate

  let migrated = 0;
  keysToMigrate.forEach(oldKey => {
    try {
      const raw = localStorage.getItem(oldKey);
      if (!raw) return;
      const rec = JSON.parse(raw);
      if (!rec.date || !rec.type) return;
      // Skip general_review records (feature rolled back)
      if (rec.type === 'general_review') { localStorage.removeItem(oldKey); return; }
      const newKey = getVideoKey(rec.className, rec.date, rec.type);
      // Preserve existing new-format record (don't overwrite user edits)
      if (!localStorage.getItem(newKey)) {
        localStorage.setItem(newKey, raw);
        migrated++;
      }
      localStorage.removeItem(oldKey);
    } catch (e) {}
  });
  if (migrated > 0) console.log('Video key migration: ' + migrated + ' records moved to date-based keys');
  localStorage.setItem(STORAGE_PREFIX + 'V-MIGRATED-v2', '1');
}
migrateVideoKeys();

function getVideoRecord(className, dateStr, type) {

    const raw = localStorage.getItem(key);

      let migrated = false;
      // Migrate: ensure retold & classContent exist
      if (!rec.retold) { rec.retold = {}; migrated = true; }
      if (!rec.classContent) { rec.classContent = ''; migrated = true; }
      // Ensure all current students exist in submissions
      const students = getAllStudents(className);
      students.forEach(s => {
        if (!(s.name in rec.submissions)) { rec.submissions[s.name] = false; migrated = true; }
        if (!(s.name in rec.retold)) { rec.retold[s.name] = ''; migrated = true; }
        // Migrate old boolean submissions to date strings
        const sub = rec.submissions[s.name];
        if (sub === true) { rec.submissions[s.name] = rec.date; migrated = true; }
      });
      // Persist migration so old data doesn't need re-migration on every load
      if (migrated) {
        try { localStorage.setItem(key, JSON.stringify(rec)); } catch (e) {}
      }
      return rec;
    }
  } catch (e) {}
  return null;
}

function getMonday(d) {
  const d2 = new Date(d);
  const day = d2.getDay();
  const diff = d2.getDate() - day + (day === 0 ? -6 : 1);
  d2.setDate(diff); d2.setHours(0, 0, 0, 0);
  return d2;
}
function getSunday(d) {
  const mon = getMonday(d);
  mon.setDate(mon.getDate() + 6);
  return mon;
}
function getCurrentMonday() { return getMonday(new Date()); }
function getWeekMonday(offset) {
  const m = getCurrentMonday();
  m.setDate(m.getDate() + offset * 7);
  return m;
}
function dateStr(d) {
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + m + '-' + day;
}

// ISO week
function getISOWeekKey(date) {
  const d = new Date(date); d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
  const week1 = new Date(d.getFullYear(), 0, 4);
  const weekNum = 1 + Math.round(((d.getTime() - week1.getTime()) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
  return d.getFullYear() + '-W' + String(weekNum).padStart(2, '0');
}
function getMondayOfISOWeek(weekKey) {
  const [y, w] = weekKey.split('-W').map(Number);
  const jan4 = new Date(y, 0, 4);
  const jan4Day = jan4.getDay() || 7;
  const firstMonday = new Date(jan4);
  firstMonday.setDate(jan4.getDate() - (jan4Day - 1));
  const monday = new Date(firstMonday);
  monday.setDate(firstMonday.getDate() + (w - 1) * 7);
  return monday;
}

function getPrevWeekKey(weekKey) {
  const mon = getMondayOfISOWeek(weekKey);
  mon.setDate(mon.getDate() - 7);
  return getISOWeekKey(mon);
}
function getNextWeekKey(weekKey) {
  const mon = getMondayOfISOWeek(weekKey);
  mon.setDate(mon.getDate() + 7);
  return getISOWeekKey(mon);
}
